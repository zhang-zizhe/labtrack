function LabInventory(){
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);
  const [fetchingData, setFetchingData] = useState(false);

  const [tab,setTab] = useState("inventory");
  const [items,setItems] = useState([]);
  const [deliveries,setDeliv] = useState([]);
  const [checkouts,setCheckouts] = useState([]);
  const [orders,setOrders] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [modal,setModal] = useState(null);
  const [labelItem,setLabelItem]=useState(null);
  const [lastBackup,setLastBackup]=useState(null);
  const [backingUp,setBackingUp]=useState(false);
  const [preItem,setPreItem] = useState("");
  const [detail,setDetail] = useState(null);
  const [groupDetail,setGroupDetail] = useState(null);
  const [editItem,setEditItem] = useState(null);
  const [pendingItem,setPendingItem] = useState(null);
  const [search,setSearch] = useState("");
  const [catF,setCatF] = useState("All");
  const [view,setView] = useState("grid");
  const [selected,setSelected] = useState(new Set());
  const [toasts,setToasts] = useState([]);
  const [confirm,setConfirm] = useState(null);
  const [dataLoaded,setDataLoaded] = useState(false);
  const [userRole, setUserRole] = useState("member");
  const [page, setPage] = useState(0);
  const [invLimit, setInvLimit] = useState(ITEMS_PER_PAGE);
  const [checkoutLimit, setCheckoutLimit] = useState(30);
  const tableScrollRef = useRef(null);
  const scrollCooldown = useRef(false);
  const [sortBy, setSortBy] = useState("name-az");
  const [darkMode, setDarkMode] = useState(true);
  const [previewMode, setPreviewMode] = useState(false);
  const [editLocked, setEditLocked] = useState(true);
  const tid = useRef(0);
  const tokenRef = useRef(null);   // current Entra ID token; refreshed on demand by getFreshToken
  const deletedItemIds = useRef(new Set());
  const lastModified = useRef({items:0, orders:0, checkouts:0, deliveries:0});
  const apiQueue = useRef([]);
  const apiRunning = useRef(false);
  const [selectedOrders, setSelectedOrders] = useState(new Set());
  const [editOrder, setEditOrder] = useState(null);
  const [emailText, setEmailText] = useState("");
  const [sessionExpired, setSessionExpired] = useState(false);
  const [orderSearch, setOrderSearch] = useState("");
  const [orderStatusFilter, setOrderStatusFilter] = useState("All");
  const [ordersPage, setOrdersPage] = useState(0);
  const lastSelOrder = useRef(null);
  const lastSelCheckout = useRef(null);

  // Restore session + theme
  useEffect(()=>{
    try {
      const saved = localStorage.getItem("labtrack_user");
      if (saved) {
        const u = JSON.parse(saved);
        setUser(u);
        tokenRef.current = u.token || null;
        // The stored token is almost always expired by now; MSAL holds the
        // refresh token. If its cache was cleared, drop back to the login page.
        if (u.token && !isBypassToken(u.token)) {
          Promise.resolve(window.msalReady).then(app => {
            if (app.getAllAccounts().length === 0) {
              setUser(null); tokenRef.current = null;
              localStorage.removeItem("labtrack_user");
            }
          }).catch(()=>{});
        }
      } else if (DEV_MODE) {
        // Skip the login page and talk to the backend directly. Only works while
        // DEV_NO_AUTH_KEY is set to the same value in google-apps-script.js.
        // Name and email here are display-only placeholders; the backend
        // substitutes DEV_NO_AUTH_EMAIL as the identity it actually authorizes.
        const devUser = { token: "dev:" + LAB.dev_key, name: "Dev Mode", email: "dev@localhost" };
        setUser(devUser);
        tokenRef.current = devUser.token;
      }
      localStorage.removeItem("labtrack_categories"); // no longer cached; server is source of truth
      const dark = localStorage.getItem("labtrack_dark");
      if (dark !== null) {
        const isDark = dark !== "false";
        setDarkMode(isDark);
        document.documentElement.classList.toggle("light", !isDark);
      }
    } catch {}
    setLoading(false);
  },[]);

  // Apply dark/light mode
  useEffect(()=>{
    document.documentElement.classList.toggle("light", !darkMode);
    localStorage.setItem("labtrack_dark", String(darkMode));
  },[darkMode]);

  // Fetch data from backend when signed in
  useEffect(()=>{
    if (!user || dataLoaded) return;
    if (!APP_CONFIG.apps_script_url || user.token === "local") {
      try {
        const saved = localStorage.getItem("labtrack_data");
        if (saved) {
          const d = JSON.parse(saved);
          if (d.items) setItems(d.items);
          if (d.deliveries) setDeliv(d.deliveries);
          if (d.checkouts) setCheckouts(d.checkouts);
          if (d.orders) setOrders(d.orders);
        }
      } catch {}
      setDataLoaded(true);
      return;
    }
    setFetchingData(true);
    (async ()=>{
      const data = await API.fetchAll(await getFreshToken());
      if (data && data.error === "NotMember") {
        setUser(null);
        localStorage.removeItem("labtrack_user");
        setError("Your account (" + (user.email||"") + ") is not authorized to access this lab's system. Contact a lab admin to be added.");
        setDataLoaded(true); setFetchingData(false); return;
      }
      if (data && data.error === "Unauthorized") {
        setSessionExpired(true);
      }
      if (data && data.error) {
        console.error("[LabTrack] Backend error:", data.error, data.detail);
        try {
          const saved = localStorage.getItem("labtrack_data");
          if (saved) {
            const d = JSON.parse(saved);
            if (d.items) setItems(d.items);
            if (d.deliveries) setDeliv(d.deliveries);
            if (d.checkouts) setCheckouts(d.checkouts);
            if (d.orders) setOrders(d.orders);
          }
        } catch {}
      } else if (data && data.items) {
        setItems(data.items);
        setDeliv(data.deliveries || []);
        setCheckouts(data.checkouts || []);
        setOrders(data.orders || []);
        // Load categories from settings
        if (data.settings && data.settings.categories) {
          try {
            const serverCats = JSON.parse(data.settings.categories);
            if (Array.isArray(serverCats) && serverCats.length > 0) {
              setCategories(serverCats);
            }
          } catch {}
        }
        if (data.userRole) setUserRole(data.userRole);
        if (data.settings && data.settings.last_backup) setLastBackup(data.settings.last_backup);
      }
      setDataLoaded(true);
      setFetchingData(false);
    })();
  },[user]);

  // Save data locally as fallback
  useEffect(()=>{
    if (!dataLoaded) return;
    localStorage.setItem("labtrack_data", JSON.stringify({items, deliveries, checkouts, orders}));
  },[items, deliveries, checkouts, orders, dataLoaded]);

  // Auto-refresh: poll every 30s for changes from other users
  useEffect(()=>{
    if (!user || !dataLoaded || !APP_CONFIG.apps_script_url || user.token === "local") return;
    const interval = setInterval(async ()=>{
      try {
        const data = await API.fetchAll(await getFreshToken());
        if (data && !data.error && data.items) {
          const now = Date.now(); const GRACE = 60000;
          const lm = lastModified.current;
          if (now - lm.items     > GRACE) setItems(data.items.filter(i=>!deletedItemIds.current.has(String(i.id))));
          if (now - lm.deliveries > GRACE) setDeliv(data.deliveries || []);
          if (now - lm.checkouts  > GRACE) setCheckouts(data.checkouts || []);
          if (now - lm.orders     > GRACE) setOrders(data.orders || []);
          if (data.userRole) setUserRole(data.userRole);
          if (data.settings && data.settings.categories) {
            try {
              const sc = JSON.parse(data.settings.categories);
              if (Array.isArray(sc) && sc.length > 0) { setCategories(sc); }
            } catch {}
          }
        }
      } catch {}
    }, 30000);
    return () => clearInterval(interval);
  },[user, dataLoaded]);

  // Reset page/limit when filters change
  useEffect(()=>{ setPage(0); setInvLimit(ITEMS_PER_PAGE); },[search, catF, sortBy]);

  // Infinite scroll via scroll event on the correct container:
  // - list view: the inner table div (overflow:auto, maxHeight:65vh)
  // - grid view: window (page grows naturally as items are added)
  useEffect(()=>{
    const loadMore=()=>{
      if(scrollCooldown.current) return;
      scrollCooldown.current=true;
      setInvLimit(l=>l+ITEMS_PER_PAGE);
      setTimeout(()=>{scrollCooldown.current=false;},400);
    };
    if(view==="list"){
      const el=tableScrollRef.current;
      if(!el) return;
      const fn=()=>{if(el.scrollTop+el.clientHeight>=el.scrollHeight-150) loadMore();};
      el.addEventListener("scroll",fn,{passive:true});
      return ()=>el.removeEventListener("scroll",fn);
    } else {
      const fn=()=>{if(window.innerHeight+window.scrollY>=document.body.scrollHeight-300) loadMore();};
      window.addEventListener("scroll",fn,{passive:true});
      return ()=>window.removeEventListener("scroll",fn);
    }
  },[view]);

  const addToast=useCallback((type,msg,onClick)=>{
    const id=++tid.current;
    setToasts(t=>[...t,{id,type,msg,onClick}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),6000);
    return id;
  },[]);

  const handleSignIn = (u) => {
    tokenRef.current = u.token;
    setUser(u); setSessionExpired(false); setDataLoaded(false);
    localStorage.setItem("labtrack_user", JSON.stringify(u));
  };

  const handleSignOut = () => {
    tokenRef.current = null;
    setUser(null); setDataLoaded(false); setItems([]); setDeliv([]); setCheckouts([]); setOrders([]);
    localStorage.removeItem("labtrack_user");
    Promise.resolve(window.msalReady)
      .then(app => app.clearCache())   // drops MSAL's cached account + refresh token
      .catch(()=>{});
  };

  // Returns a non-expired ID token, renewing it through MSAL's refresh token
  // when needed. Replaces the old GSI timer: nothing is scheduled, the token is
  // simply refreshed on the next API call after it goes stale.
  const getFreshToken = async (interactive) => {
    if (!user) return null;
    if (isBypassToken(user.token)) return user.token;

    const cur = tokenRef.current;
    const claims = cur ? decodeJwt(cur) : null;
    if (claims && claims.exp && (claims.exp * 1000 - Date.now()) > 5 * 60 * 1000) return cur;

    try {
      const app = await window.msalReady;
      const accounts = app.getAllAccounts();
      const account = accounts.find(a => a.homeAccountId === user.homeAccountId) || accounts[0];
      if (!account) throw new Error("no cached account");
      const req = { scopes: MSAL_SCOPES(), account };
      const r = interactive ? await app.acquireTokenPopup(req) : await app.acquireTokenSilent(req);
      tokenRef.current = r.idToken;
      setSessionExpired(false);
      return r.idToken;
    } catch(e) {
      // Refresh token expired or revoked — show the banner and let the request
      // go out with the stale token so the server's rejection stays authoritative.
      console.error("[MSAL] token refresh failed:", e);
      setSessionExpired(true);
      return cur;
    }
  };

  const handleSaveCategories = async (newCats) => {
    setCategories(newCats);
    if (APP_CONFIG.apps_script_url && user?.token !== "local") {
      await API.post(await getFreshToken(), "saveSettings", { key: "categories", value: JSON.stringify(newCats) });
    }
    addToast("success", "Categories updated");
  };

  // keyboard shortcuts
  useEffect(()=>{
    if (!user) return;
    const h=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
      if(e.key==="Escape"){setModal(null);setDetail(null);setConfirm(null);setLabelItem(null);}
      if(e.key==="n"||e.key==="N") setModal("delivery");
      if(e.key==="c"||e.key==="C"){setPreItem("");setModal("checkout");}
    };
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[user]);

  // computed
  const lowStock = items.filter(i=>i.minQty>0&&i.qty<=i.minQty);
  const activeOut = checkouts.filter(c=>c.status==="Active");
  const overdues = checkouts.filter(c=>isOverdue(c));

  // handlers
  const postAction = (action, payload) => {
    // Mark data type as locally modified → suppress poll override for 60s
    const now = Date.now();
    if (/item/i.test(action)) lastModified.current.items = now;
    if (/checkout|return/i.test(action)) { lastModified.current.checkouts = now; lastModified.current.items = now; }
    if (/order/i.test(action)) lastModified.current.orders = now;
    if (/delivery/i.test(action)) lastModified.current.deliveries = now;
    // No backend (local preview, or apps_script_url not set yet): the local state
    // change IS the write, so report success. Returning null here would read as a
    // failed request and make optimistic updates roll themselves back.
    // `offline` marks it so server-only actions can tell the difference.
    if (!APP_CONFIG.apps_script_url || user?.token === "local") return Promise.resolve({ ok: true, offline: true });
    // Queue requests so rapid edits don't race in GAS
    return new Promise(resolve => {
      apiQueue.current.push({action, payload, resolve});
      if (!apiRunning.current) {
        (async () => {
          apiRunning.current = true;
          while (apiQueue.current.length > 0) {
            const req = apiQueue.current.shift();
            try {
              // Token is fetched per request, not at enqueue time — a request that
              // sat in the queue would otherwise go out with an expired token.
              const result = await API.post(await getFreshToken(), req.action, req.payload);
              if (result?.error === "Unauthorized") { setSessionExpired(true); }
              if (result?.error === "NotMember") { setUser(null); localStorage.removeItem("labtrack_user"); setError("Your account is not authorized to access this lab's system."); }
              if (result?.error && result.error !== "Unauthorized" && result.error !== "NotMember") addToast("error", `Error: ${result.error} — ${result.detail||""}`);
              req.resolve(result);
            } catch(e) { req.resolve(null); }
          }
          apiRunning.current = false;
        })();
      }
    });
  };

  const handleDelivery=async(d)=>{
    setDeliv(p=>[d,...p]);
    addToast("success",`Delivery logged: ${d.item}`);
    await postAction("addDelivery", {delivery: d});
  };

  const handleCheckout=(c)=>{
    const checkout={...c, checkedOutByEmail: user?.email||""};
    setItems(prev=>prev.map(i=>i.name===checkout.item?{...i,status:i.shared?"Available":"In Use",usedBy:[...toArr(i.usedBy),checkout.user]}:i));
    setCheckouts(p=>[checkout,...p]);
    addToast("success",`${checkout.item} → ${checkout.user}`);

  };

  const handleUseConsumable = async (itemId, qty) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    const item = items.find(i=>i.id===itemId); if(!item) return;

    setItems(p=>p.map(i=>i.id===itemId?updated:i));

  const handleReturn=async(coId)=>{

    const nowStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    setCheckouts(p=>p.map(c=>c.id===coId?{...c,status:"Returned",ret:nowStr}:c));

    await postAction("returnItem", {checkoutId: coId});

  const handleBulkReturn=()=>{

    const coMap=Object.fromEntries(checkouts.filter(c=>ids.includes(c.id)).map(c=>[c.id,c]));
    setCheckouts(prev=>prev.map(c=>ids.includes(c.id)?{...c,status:"Returned"}:c));

      ids.forEach(id=>{const co=coMap[id];if(!co)return;s=s.map(i=>i.name===co.item?{...i,status:"Available",usedBy:toArr(i.usedBy).filter(u=>u!==co.user)}:i);});
      return s;
    });

    return finalId;
  };

  const handleUpdateItem = async (updatedItem) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setItems(p=>p.map(i=>i.id===updatedItem.id?{...i,...updatedItem}:i));
    addToast("success",`"${updatedItem.name}" updated`);
    await postAction("updateItem", {item: updatedItem});
  };

  const handleDeleteItem = async (itemId) => {

  const handleAddOrder = async (order) => {

  const handleSendDigest = async () => {

  const handleBackupNow = async () => {

    if(result && result.ok){
      const now=new Date();
      const pad=n=>String(n).padStart(2,"0");
      const ts=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      setLastBackup(ts);
      addToast("success",`Backup saved: ${result.backupName}`);
    } else {
      addToast("error","Backup failed — "+((result&&result.detail)||"check Apps Script logs"));

  };

  const handleUpdateOrderStatus = async (orderId, newStatus) => {
    setOrders(p=>p.map(o=>o.id===orderId?{...o,status:newStatus}:o));
    addToast("success",`Order marked as ${newStatus}`);
    await postAction("updateOrderStatus", {orderId, status: newStatus});
  };

  const handleUpdateOrder = async (order) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setOrders(p=>p.map(o=>o.id===order.id?order:o));
    addToast("success","Order updated");
    await postAction("updateOrder", {order});
  };

  const handleDeleteOrder = async (orderId) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    if (userRole !== "admin") {
      addToast("error", "Only admins can delete orders.");
      return;
    }
    setOrders(p=>p.filter(o=>o.id!==orderId));
    addToast("success","Order request removed");
    await postAction("deleteOrder", {orderId});
  };

  // Show staging modal immediately; sync to sheet in background
  const handleOrderReceived = (order) => {
    setPendingItem(order); // instant — no waiting for API
    const delivery={id:uid(),item:order.item,qty:order.qty,unit:order.unit,from:"(Order #"+order.id+")",receivedBy:user?.name||"",date:getToday(),tracking:"",status:"Logged"};
    handleDelivery(delivery);              // fire and forget
    handleUpdateOrderStatus(order.id,"Received"); // fire and forget
  };

  const handleConfirmPendingItem = async (itemData) => {
    const newItem = {id:uid(), status:"Available", usedBy:[], ...itemData, qty:+itemData.qty||0, minQty:isNaN(+itemData.minQty)?0:+itemData.minQty};
    setItems(p=>[newItem,...p]);
    addToast("success",`"${newItem.name}" added to inventory!`);
    const res = await postAction("addItem", {item: newItem});
    if(res?.displayId && res.displayId !== newItem.displayId)
      setItems(p=>p.map(i=>i.id===newItem.id?{...i,displayId:res.displayId}:i));
  };

  // filtered & sorted inventory
  const filtered = useMemo(()=>{
    let f = items.filter(i=>{
      const q=search.toLowerCase();
      const s = v => String(v==null?"":v).toLowerCase();
      return(s(i.name).includes(q)||s(i.loc).includes(q)||s(i.cat).includes(q)||s(i.desc).includes(q)||s(i.serial).includes(q))
        &&(catF==="All"||i.cat===catF);
    });
    // Sort
    const srt = v => String(v==null?"":v);
    if(sortBy==="name-az") f.sort((a,b)=>srt(a.name).localeCompare(srt(b.name)));
    else if(sortBy==="name-za") f.sort((a,b)=>srt(b.name).localeCompare(srt(a.name)));
    else if(sortBy==="newest") f.sort((a,b)=>Number(b.id)-Number(a.id));
    else if(sortBy==="qty-low") f.sort((a,b)=>a.qty-b.qty);
    else if(sortBy==="qty-high") f.sort((a,b)=>b.qty-a.qty);
    return f;
  },[items, search, catF, sortBy]);

  // Group sub-ID items (track-individually, non-consumable) under one display entry
  const displayItems = useMemo(()=>{
    const groups = {};
    const result = [];
    filtered.forEach(item => {
      if (isSubItem(item.displayId) && !item.consumable) {
        const baseId = getBaseId(item.displayId);
        if (!groups[baseId]) {
          const g = {_isGroup:true,_baseId:baseId,_items:[],id:baseId,name:item.name,cat:item.cat,loc:item.loc,desc:item.desc,img:item.img,unit:item.unit,displayId:baseId,shared:item.shared,consumable:false,minQty:item.minQty};
          groups[baseId] = g;
          result.push(g);
        }
        groups[baseId]._items.push(item);
      } else {
        result.push(item);
      }
    });
    Object.values(groups).forEach(g=>{
      g.qty = g._items.length;
      const inUseCount = g._items.filter(i=>toArr(i.usedBy).length>0).length;
      g.usedBy = [...new Set(g._items.flatMap(i=>toArr(i.usedBy)))];
      g.status = inUseCount===0?"Available":inUseCount===g._items.length?"In Use":"Partially In Use";
    });
    return result;
  },[filtered]);

  // Load-more sliced items
  const paginatedItems = displayItems.slice(0, invLimit);

  const pendingOrders = orders.filter(o=>o.status==="Pending").length;
  const activeOrders = orders.filter(o=>o.status!=="Received"&&o.status!=="Rejected").sort((a,b)=>Number(b.id)-Number(a.id));
  const receivedOrders = orders.filter(o=>o.status==="Received"||o.status==="Rejected").sort((a,b)=>Number(b.id)-Number(a.id));
  const ORDERS_PER_PAGE = 15;
  const filteredActiveOrders = activeOrders.filter(o=>{
    const q = orderSearch.toLowerCase();
    const matchText = !q || (o.item||"").toLowerCase().includes(q) || (o.store||"").toLowerCase().includes(q) || (o.requestedBy||"").toLowerCase().includes(q) || (o.reason||"").toLowerCase().includes(q);
    const matchStatus = orderStatusFilter==="All" || o.status===orderStatusFilter;
    const matchDate = true; // date filter handled via orderStatusFilter "Today" below
    return matchText && matchStatus;
  });
  const ordersPageCount = Math.ceil(filteredActiveOrders.length/ORDERS_PER_PAGE);
  const pagedActiveOrders = filteredActiveOrders.slice(ordersPage*ORDERS_PER_PAGE, (ordersPage+1)*ORDERS_PER_PAGE);

  const TABS=[
    {id:"inventory",l:"Inventory",n:"grid",count:items.length},
    {id:"orders",l:"Order Requests",n:"cart",count:activeOrders.length},
    {id:"usage",l:"Usage",n:"users",count:activeOut.length},
    {id:"calendar",l:"Calendar",n:"calendar",count:0},
  ];

  // Loading
  if (loading) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg0)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:40,height:40,border:"3px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/>
        <div style={{color:"var(--sub)",fontSize:14}}>Loading...</div>
      </div>
    </div>;
  }

  if (!user) return <LoginPage onSignIn={handleSignIn}/>;

  return(
    <div style={{background:"var(--bg0)",minHeight:"100vh",color:"var(--text)"}}>
      {/* HEADER */}
      <header style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,position:"sticky",top:0,zIndex:200}}>
        <div style={{display:"flex",alignItems:"center",gap:13}}>
          <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,#00d4c8,#004d4a)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 18px rgba(0,212,200,.3)",flexShrink:0}}>
            <Ico n="layers" s={18} col="var(--bg0)"/>
          </div>
          <div>
            <div style={{fontFamily:"'Roboto',sans-serif",fontWeight:900,fontSize:16,letterSpacing:"-0.02em"}}>LabTrack</div>
            <div style={{color:"var(--dim)",fontSize:10,fontFamily:"'IBM Plex Mono',monospace"}}>robotics · inventory · v4.0</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {overdues.length>0&&(
            <div className="overdue-pulse" style={{display:"flex",alignItems:"center",gap:6,background:"var(--red-d)",border:"1px solid #ff4d6a44",borderRadius:20,padding:"5px 12px",fontSize:12,color:"var(--red)"}}>
              <Ico n="clock" s={13} col="var(--red)"/>{overdues.length} overdue
            </div>
          )}
          {lowStock.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:6,background:"var(--amber-d)",border:"1px solid #f5a62344",borderRadius:20,padding:"5px 12px",fontSize:12,color:"var(--amber)"}}>
              <Ico n="alert" s={13} col="var(--amber)"/>{lowStock.length} low stock
            </div>
          )}
          {/* Help */}
          <button onClick={()=>setModal("help")} title="Help & Guide" className="ibtn"
            style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:"var(--sub)"}}>
            <Ico n="help" s={14}/>
          </button>
          {/* Theme toggle */}
          <button onClick={()=>setDarkMode(d=>!d)} title={darkMode?"Switch to Light Mode":"Switch to Dark Mode"}
            style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:"var(--sub)",transition:"all .15s"}}
            className="ibtn">
            <Ico n={darkMode?"sun":"moon"} s={14}/>
          </button>
          {/* Edit lock */}
          <button onClick={()=>{
            if(editLocked && userRole!=="admin"){
              postAction("logEditUnlock",{user:user?.name||"",email:user?.email||""});
            }

          }} title={editLocked?"Unlock editing":"Lock editing to prevent accidental changes"}
            style={{background:editLocked?"var(--red-d)":"var(--bg2)",border:`1px solid ${editLocked?"#ff4d6a50":"var(--border)"}`,borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:editLocked?"var(--red)":"var(--sub)",transition:"all .15s"}}
            className="ibtn">
            <Ico n={editLocked?"lock":"unlock"} s={14}/>

          {/* Admin: preview as user */}
          {userRole==="admin"&&(

              style={{background:previewMode?"var(--blue-d)":"var(--bg2)",border:`1px solid ${previewMode?"var(--blue)":"var(--border)"}`,borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:previewMode?"var(--blue)":"var(--sub)",transition:"all .15s"}}
              className="ibtn">
              <Ico n="eye" s={14}/>
            </button>
          )}
          {/* Admin: Send Digest Now */}
          {userRole==="admin"&&APP_CONFIG.apps_script_url&&(
            <button onClick={handleSendDigest} title="Send Slack digest now (admin)"
              style={{background:"var(--purple-d)",border:"1px solid #b47dff33",borderRadius:8,padding:"6px 11px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,color:"var(--purple)",fontSize:12,fontWeight:600,fontFamily:"'Outfit',sans-serif"}}>
              <Ico n="bell2" s={13} col="var(--purple)"/>Digest
            </button>
          )}
          {/* Admin: Backup Now */}
          {userRole==="admin"&&APP_CONFIG.apps_script_url&&(

              title={lastBackup?`Last backup: ${lastBackup}\nClick to backup now`:"Click to backup spreadsheet to Google Drive"}

            <button onClick={handleSignOut} title="Sign out" style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:"2px",display:"flex",alignItems:"center"}}><Ico n="logout" s={14}/></button>
          </div>
        </div>
      </header>

      {/* NAV */}
      <nav style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",padding:"0 24px",display:"flex",gap:2}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"transparent",border:"none",borderBottom:`2px solid ${tab===t.id?"var(--cyan)":"transparent"}`,color:tab===t.id?"var(--cyan)":"var(--dim)",padding:"13px 16px",cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:7,fontFamily:"'Outfit',sans-serif",transition:"color .15s,border-color .15s"}}>

          </button>

      {/* Session expired banner */}
      {sessionExpired&&(

        </div>

      {/* Dev mode banner — deliberately loud and not dismissible, because leaving

      {DEV_MODE&&(
        <div style={{background:"#7f1d1d",borderBottom:"2px solid #ef4444",padding:"9px 24px",display:"flex",alignItems:"center",gap:8}}>
          <Ico n="alert" s={15} col="#fecaca"/>
          <span style={{color:"#fecaca",fontSize:12.5,fontWeight:700,letterSpacing:"0.01em"}}>
            DEV MODE — authentication is disabled. Clear <code style={{fontFamily:"'IBM Plex Mono',monospace"}}>dev_key</code> and <code style={{fontFamily:"'IBM Plex Mono',monospace"}}>DEV_NO_AUTH_KEY</code> before this holds real inventory.

      {/* Admin preview mode banner */}
      {previewMode&&(
        <div style={{background:"var(--blue-d)",borderBottom:"1px solid #4da6ff30",padding:"8px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>

            <Ico n="eye" s={14} col="var(--blue)"/>
            <span style={{color:"var(--blue)",fontSize:12,fontWeight:600}}>Admin Preview — you are viewing the site as a regular user</span>
          </div>
          <button onClick={()=>setPreviewMode(false)} style={{background:"none",border:"1px solid #4da6ff40",color:"var(--blue)",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>Exit Preview</button>

            <span style={{color:"var(--red)",fontSize:12,fontWeight:600}}>Editing locked — inventory is in read-only mode</span>

        </div>

      {/* Loading overlay */}

        <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"60px 20px",flexDirection:"column",gap:16}}>
          <div style={{width:40,height:40,border:"3px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
          <div style={{color:"var(--sub)",fontSize:14}}>Fetching inventory data...</div>
        </div>

      {!fetchingData && (
      <main style={{padding:"24px",maxWidth:1360,margin:"0 auto"}}>

        {/* Stats */}
        <div style={{display:"flex",gap:12,marginBottom:overdues.length||lowStock.length?16:24,flexWrap:"wrap"}}>
          <Stat label="Total Items" val={items.length} icon="box" ac="var(--cyan)" sub="in inventory"/>
          <Stat label="Categories" val={[...new Set(items.map(i=>i.cat))].length} icon="layers" ac="var(--purple)" sub="active types"/>
          <Stat label="Orders" val={activeOrders.length} icon="cart" ac="var(--amber)" sub="in pipeline"/>
          <Stat label="Checked Out" val={activeOut.length} icon="users" ac="var(--blue)" sub="active"/>
          <Stat label="Overdue" val={overdues.length} icon="clock" ac={overdues.length?"var(--red)":"var(--green)"} sub="past return date" warn={overdues.length>0}/>
        </div>

        {/* Alert banners */}
        {overdues.length>0&&(
          <div style={{background:"var(--red-d)",border:"1px solid #ff4d6a30",borderRadius:10,padding:"10px 16px",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <Ico n="clock" s={15} col="var(--red)"/>
            <span style={{color:"var(--red)",fontSize:13,fontWeight:600}}>Overdue returns:</span>
            <span style={{color:"var(--sub)",fontSize:13}}>{overdues.map(c=>`${c.item} (${c.user})`).join(" · ")}</span>
            <Btn v="ghost" sm style={{marginLeft:"auto"}} onClick={()=>setTab("usage")}>View in Usage →</Btn>
          </div>
        )}
        {lowStock.length>0&&(
          <div style={{background:"var(--amber-d)",border:"1px solid #f5a62330",borderRadius:10,padding:"10px 16px",marginBottom:24,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <Ico n="alert" s={15} col="var(--amber)"/>
            <span style={{color:"var(--amber)",fontSize:13,fontWeight:600}}>Low stock:</span>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {lowStock.map(i=>(
                <button key={i.id} onClick={()=>{setDetail(i);setTab("inventory");}} style={{background:"var(--amber-d)",color:"var(--amber)",border:"1px solid #f5a62340",borderRadius:12,padding:"2px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>
                  {i.name} ({i.qty} {i.unit})
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ════════ INVENTORY TAB ════════ */}
        {tab==="inventory"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              <div style={{position:"relative",flex:1,minWidth:200,maxWidth:320}}>
                <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)"}}><Ico n="search" s={14} col="var(--dim)"/></span>
                <Inp placeholder="Search name, location, serial no..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:34}}/>
                {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:0,display:"flex"}}><Ico n="x" s={13}/></button>}
              </div>

              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                {["All",...categories].map(c=>{
                  const count=c==="All"?items.length:items.filter(i=>i.cat===c).length;
                  if(count===0&&c!=="All")return null;
                  const isSel=catF===c;
                  const ac=getCatAccent(c,categories);
                  return(
                    <button key={c} onClick={()=>setCatF(c)} style={{background:isSel?(c==="All"?"var(--bg4)":`${ac}18`):"var(--bg2)",color:isSel?(c==="All"?"var(--text)":ac):"var(--sub)",border:`1px solid ${isSel?(c==="All"?"var(--border-hi)":ac):"var(--border)"}`,borderRadius:20,padding:"4px 11px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'Outfit',sans-serif",transition:"all .15s",display:"flex",alignItems:"center",gap:4}}>
                      {c}{c!=="All"&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,opacity:.7}}>{count}</span>}
                    </button>
                  );
                })}
                {effectiveRole==="admin"&&<button onClick={()=>setModal("manageCategories")} title="Manage Categories (admin only)" style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:20,padding:"4px 8px",cursor:"pointer",display:"flex",alignItems:"center",transition:"all .15s"}}>
                  <Ico n="settings" s={13} col="var(--dim)"/>
                </button>}
              </div>

              {/* Sort */}
              <Sel value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{width:"auto",padding:"6px 10px",fontSize:12,borderRadius:8}}>
                <option value="name-az">Name A-Z</option>
                <option value="name-za">Name Z-A</option>
                <option value="newest">Newest</option>
                <option value="qty-low">Qty Low→High</option>
                <option value="qty-high">Qty High→Low</option>
              </Sel>

              <div style={{display:"flex",gap:2,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:3,marginLeft:"auto"}}>
                {["grid","list"].map(v=>(
                  <button key={v} onClick={()=>setView(v)} style={{background:view===v?"var(--bg4)":"transparent",border:view===v?"1px solid var(--border-hi)":"1px solid transparent",borderRadius:6,padding:"5px 9px",cursor:"pointer",display:"flex",alignItems:"center",transition:"all .15s"}}>
                    <Ico n={v} s={15} col={view===v?"var(--cyan)":"var(--dim)"}/>
                  </button>
                ))}
              </div>

              <Btn v="ghost" onClick={()=>{setPreItem("");setModal("checkout");}}><Ico n="tag" s={14}/>Check Out</Btn>
              <Btn onClick={()=>{if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}setModal("addItem");}}><Ico n="plus" s={14} col="#000"/>Add Item</Btn>
            </div>

            {search&&<div style={{color:"var(--dim)",fontSize:12,marginBottom:12}}>{filtered.length} result{filtered.length!==1?"s":""} for "{search}"</div>}

            {filtered.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px",color:"var(--dim)"}}>
                <Ico n={items.length===0?"box":"search"} s={48} col="var(--bg4)"/>
                <div style={{marginTop:16,fontSize:16,color:"var(--sub)"}}>{items.length===0?"No items in inventory yet":"No items found"}</div>
                <div style={{fontSize:13,marginTop:4}}>{items.length===0?"Add your first item to get started":"Try a different search or category"}</div>
                {items.length===0 ? (
                  <Btn style={{marginTop:16}} onClick={()=>setModal("addItem")}><Ico n="plus" s={14} col="#000"/>Add First Item</Btn>
                ) : (
                  <button onClick={()=>{setSearch("");setCatF("All");}} style={{marginTop:16,background:"none",border:"1px solid var(--border)",color:"var(--cyan)",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13}}>Clear filters</button>
                )}
              </div>
            ):view==="grid"?(
              <ErrorBoundary>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(238px,1fr))",gap:14}}>
                {paginatedItems.map((item,idx)=>{
                  const ac=getCatAccent(item.cat,categories);
                  if(item._isGroup){
                    const availCount=item._items.filter(i=>!i.usedBy?.length).length;
                    const inUseCount=item._items.length-availCount;
                    return(
                      <div key={item._baseId} className="card-item" onClick={()=>setGroupDetail(item)} style={{background:"var(--bg1)",border:"2px solid var(--border)",borderRadius:14,overflow:"hidden",animation:`fadeUp .3s ease ${Math.min(idx,.8)*0.04}s both`,cursor:"pointer"}}>
                        <div style={{position:"relative"}}>
                          <img src={item.img||`https://placehold.co/280x112/141b24/3d5068?text=${encodeURIComponent(item.cat)}`} alt={item.name} style={{width:"100%",height:112,objectFit:"cover",display:"block"}}/>
                          <div style={{position:"absolute",bottom:0,left:0,right:0,height:44,background:"linear-gradient(transparent,var(--bg1))"}}/>
                          <div style={{position:"absolute",top:10,right:10}}><Badge status={item.status}/></div>
                          <div style={{position:"absolute",top:10,left:10,background:"rgba(7,9,15,.78)",borderRadius:7,padding:"3px 8px"}}>
                            <span style={{color:ac,fontSize:9,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",letterSpacing:"0.08em"}}>{(item.cat||"").toUpperCase()}</span>
                          </div>
                        </div>
                        <div style={{padding:"11px 14px 13px"}}>
                          <div style={{fontWeight:700,fontSize:14,color:"var(--text)",marginBottom:2,fontFamily:"'Roboto',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                          <div style={{color:"var(--dim)",fontSize:11,marginBottom:4,fontFamily:"'IBM Plex Mono',monospace",display:"flex",gap:8,flexWrap:"wrap"}}>
                            <CopyIdBadge id={item.displayId}/>
                            <span style={{color:"var(--purple)",fontSize:10}}>TRACKED UNITS</span>
                          </div>
                          <div style={{color:"var(--dim)",fontSize:11,marginBottom:10,fontFamily:"'IBM Plex Mono',monospace"}}>{item.loc||"—"}</div>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                              <span style={{color:ac,fontFamily:"'Roboto',sans-serif",fontSize:24,fontWeight:900,lineHeight:1,letterSpacing:"-0.02em"}}>{item.qty}</span>
                              <span style={{color:"var(--dim)",fontSize:11}}>units</span>
                            </div>
                            <div style={{fontSize:11,textAlign:"right",lineHeight:1.4}}>
                              <div style={{color:"var(--green)",fontWeight:600}}>{availCount} avail</div>
                              {inUseCount>0&&<div style={{color:"var(--amber)",fontWeight:600}}>{inUseCount} in use</div>}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  }
                  const isLow=item.minQty>0&&item.qty<=item.minQty;
                  return(
                    <div key={item.id} className="card-item" onClick={()=>setDetail(item)} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden",animation:`fadeUp .3s ease ${Math.min(idx,.8)*0.04}s both`}}>
                      <div style={{position:"relative"}}>
                        <img src={item.img||`https://placehold.co/280x112/141b24/3d5068?text=${encodeURIComponent(item.cat)}`} alt={item.name} style={{width:"100%",height:112,objectFit:"cover",display:"block"}}/>
                        <div style={{position:"absolute",bottom:0,left:0,right:0,height:44,background:"linear-gradient(transparent,var(--bg1))"}}/>
                        <div style={{position:"absolute",top:10,right:10}}><Badge status={isLow?"Low Stock":item.status}/></div>
                        <div style={{position:"absolute",top:10,left:10,background:"rgba(7,9,15,.78)",borderRadius:7,padding:"3px 8px"}}>
                          <span style={{color:ac,fontSize:9,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",letterSpacing:"0.08em"}}>{(item.cat||"").toUpperCase()}</span>
                        </div>
                      </div>
                      <div style={{padding:"11px 14px 13px"}}>
                        <div style={{fontWeight:700,fontSize:14,color:"var(--text)",marginBottom:2,fontFamily:"'Roboto',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                        <div style={{color:"var(--dim)",fontSize:11,marginBottom:4,fontFamily:"'IBM Plex Mono',monospace",display:"flex",gap:8,flexWrap:"wrap"}}>
                          <CopyIdBadge id={item.displayId}/>
                          {item.shared&&<span style={{color:"var(--purple)",fontSize:10}}>SHARED</span>}
                          {item.consumable&&<span style={{color:"var(--amber)",fontSize:10}}>CONSUMABLE</span>}
                        </div>
                        <div style={{color:"var(--dim)",fontSize:11,marginBottom:10,fontFamily:"'IBM Plex Mono',monospace"}}>{item.loc||"—"}{item.serial?` · S/N: ${item.serial}`:""}</div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                            <span style={{color:isLow?"var(--red)":ac,fontFamily:"'Roboto',sans-serif",fontSize:24,fontWeight:900,lineHeight:1,letterSpacing:"-0.02em"}}>{item.qty}</span>
                            <span style={{color:"var(--dim)",fontSize:11}}>{item.unit}</span>
                          </div>
                          {item.consumable?(
                            <button onClick={e=>{e.stopPropagation();if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}const n=parseInt(window.prompt(`How many ${item.unit} used? (max ${item.qty})`,"1"));if(!isNaN(n)&&n>0)handleUseConsumable(item.id,Math.min(n,item.qty));}} style={{background:editLocked?"var(--bg3)":"var(--amber-d)",color:editLocked?"var(--dim)":"var(--amber)",border:"1px solid #f5a62330",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:editLocked?"not-allowed":"pointer"}}>Use</button>
                          ):toArr(item.usedBy).length>0?(
                            <div style={{display:"flex"}}>{toArr(item.usedBy).slice(0,3).map((u,i)=><div key={u} style={{marginLeft:i>0?-8:0,zIndex:3-i}}><MemberAvatar name={u} sz={24}/></div>)}</div>
                          ):null}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
              </ErrorBoundary>
            ):(
              <ErrorBoundary>
              <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
                <div ref={tableScrollRef} style={{overflow:"auto",maxHeight:"65vh"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{borderBottom:"1px solid var(--border)"}}>
                      {["Item","Category","Stock","Location","Serial/Product No.","Status","In Use By"].map(h=>(
                        <th key={h} className="sticky-th" style={{padding:"11px 16px",textAlign:"left",color:"var(--dim)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{h}</th>
                      ))}
                    </tr></thead>
                    <tbody>
                      {paginatedItems.map((item,i)=>{
                        if(item._isGroup){
                          const availCount=item._items.filter(it=>!it.usedBy?.length).length;
                          const inUseCount=item._items.length-availCount;
                          return(
                            <tr key={item._baseId} className="row-hover" onClick={()=>setGroupDetail(item)} style={{borderBottom:i<paginatedItems.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}>
                              <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{item.name}<span style={{marginLeft:6,fontSize:10,color:"var(--purple)",fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>TRACKED UNITS</span></td>
                              <td style={{padding:"10px 16px"}}><span style={{color:getCatAccent(item.cat,categories),fontSize:12}}>{item.cat}</span></td>
                              <td style={{padding:"10px 16px",fontFamily:"'IBM Plex Mono',monospace",fontWeight:600}}>{item.qty} <span style={{color:"var(--dim)",fontWeight:400}}>units</span></td>
                              <td style={{padding:"10px 16px",color:"var(--sub)",fontSize:12}}>{item.loc||"—"}</td>
                              <td style={{padding:"10px 16px",color:"var(--dim)",fontSize:11}}><span style={{color:"var(--green)"}}>{availCount} avail</span>{inUseCount>0&&<span style={{color:"var(--amber)",marginLeft:6}}>{inUseCount} in use</span>}</td>
                              <td style={{padding:"10px 16px"}}><Badge status={item.status}/></td>
                              <td style={{padding:"10px 16px"}}>{toArr(item.usedBy).length>0?<div style={{display:"flex",gap:4}}>{toArr(item.usedBy).slice(0,3).map(u=><MemberAvatar key={u} name={u} sz={24}/>)}</div>:<span style={{color:"var(--dim)"}}>—</span>}</td>
                            </tr>
                          );
                        }
                        return(
                          <tr key={item.id} className="row-hover" onClick={()=>setDetail(item)} style={{borderBottom:i<paginatedItems.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}>
                            <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{item.name}</td>

                    const activeCheckouts=checkouts.filter(x=>x.status==="Active"&&canReturn(x));
                    const handleCoClick=(e)=>{
                      if(c.status!=="Active"||!canRet)return;
                      if(e.shiftKey&&lastSelCheckout.current!=null){
                        const ids=activeCheckouts.map(x=>x.id);
                        const a=ids.indexOf(lastSelCheckout.current),b=ids.indexOf(c.id);
                        const [lo,hi]=[Math.min(a,b),Math.max(a,b)];
                        const ns=new Set(selected);ids.slice(lo,hi+1).forEach(x=>ns.add(x));setSelected(ns);
                      } else {
                        const ns=new Set(selected);ns.has(c.id)?ns.delete(c.id):ns.add(c.id);setSelected(ns);
                        lastSelCheckout.current=c.id;
                      }
                    };
                    return(
                      <tr key={c.id} onClick={handleCoClick} className="row-hover" style={{borderBottom:i<checkouts.length-1?"1px solid var(--border)":"none",transition:"background .15s",background:od?"rgba(45,0,16,.4)":isSel?"var(--cyan-d)":undefined,cursor:(c.status==="Active"&&canRet)?"pointer":"default",userSelect:"none"}}>
                        <td style={{padding:"10px 16px"}}>{c.status==="Active"&&canRet&&<input type="checkbox" checked={isSel} onChange={handleCoClick} onClick={e=>e.stopPropagation()} style={{cursor:"pointer",accentColor:"var(--cyan)"}}/>}</td>
                        <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{c.item}</td>
                        <td style={{padding:"10px 16px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><MemberAvatar name={c.user} sz={26}/><span style={{color:"var(--sub)"}}>{c.user}</span></div></td>
                        <td style={{padding:"10px 16px",color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>{c.out}</td>
                        <td style={{padding:"10px 16px",color:od?"var(--red)":"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:od?700:400}}>{c.ret||"—"}{od&&" !"}</td>
                        <td style={{padding:"10px 16px"}}><Badge status={od?"Overdue":c.status}/></td>
                        <td style={{padding:"10px 16px"}}>{c.status==="Active"&&canRet&&<Btn v="ghost" sm onClick={e=>{e.stopPropagation();setConfirm({msg:`Return "${c.item}" from ${c.user}?`,onConfirm:()=>handleReturn(c.id)});}}><Ico n="undo" s={12}/>Return</Btn>}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>
              {checkouts.length>checkoutLimit&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"12px 0",gap:12,borderTop:"1px solid var(--border)"}}>
                  <span style={{color:"var(--dim)",fontSize:12}}>Showing {checkoutLimit} of {checkouts.length} records</span>
                  <button onClick={()=>setCheckoutLimit(l=>l+30)} style={{background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"5px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>Load more</button>
                </div>
              )}
            </div>
              </>
            )}
          </div>
        )}

        {/* ════════ CALENDAR TAB ════════ */}
        {tab==="calendar"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <h2 style={{margin:"0 0 20px",fontFamily:"'Roboto',sans-serif",fontSize:18,fontWeight:700}}>Activity Calendar</h2>
            <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,padding:24}}>
              <CalView checkouts={checkouts} deliveries={deliveries}/>
            </div>
          </div>
        )}
      </main>
      )}

      {/* MODALS */}
      {modal==="delivery" && <DeliveryModal onClose={()=>setModal(null)} onAdd={handleDelivery} userName={user?.name||""}/>}
      {modal==="checkout" && <CheckoutModal items={items} onClose={()=>setModal(null)} onAdd={handleCheckout} preItem={preItem} userName={user?.name||""} userEmail={user?.email||""} categories={categories}/>}
      {modal==="addItem" && <AddItemModal onClose={()=>setModal(null)} onAdd={handleAddItem} categories={categories} allItems={items} onShowLabel={setLabelItem}/>}
      {labelItem&&<LabelModal item={labelItem} onClose={()=>setLabelItem(null)} onAddAnother={()=>{setLabelItem(null);setModal("addItem");}}/>}
      {modal==="order" && <OrderModal onClose={()=>setModal(null)} onAddMany={handleAddOrderMany} userName={user?.name||""} userEmail={user?.email||""} categories={categories}/>}
      {modal==="manageCategories" && <ManageCategoriesModal categories={categories} onSave={handleSaveCategories} onClose={()=>setModal(null)}/>}
      {editItem && <EditItemModal item={editItem} onClose={()=>setEditItem(null)} onSave={handleUpdateItem} onDelete={handleDeleteItem} onAdd={handleAddItem} categories={categories} isAdmin={effectiveRole==="admin"}/>}
      {editOrder && <EditOrderModal order={editOrder} onClose={()=>setEditOrder(null)} onSave={handleUpdateOrder} isAdmin={effectiveRole==="admin"} categories={categories}/>}
      {modal==="emailText"&&<Modal onClose={()=>{setModal(null);setEmailText("");}} title="📧 Purchase Request Email Text" mw={700}>
        <p style={{color:"var(--sub)",fontSize:13,marginBottom:10}}>Select all and copy (Ctrl+A → Ctrl+C), then paste into your email.</p>
        <textarea readOnly value={emailText} onClick={e=>e.target.select()} style={{width:"100%",height:260,background:"var(--bg2)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"12px 14px",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",resize:"vertical",outline:"none",lineHeight:1.8,display:"block"}}/>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <Btn onClick={()=>{setModal(null);setEmailText("");}}>Done</Btn>
        </div>
      </Modal>}
      {pendingItem && <PendingItemModal order={pendingItem} allItems={items} categories={categories} onClose={()=>setPendingItem(null)} onConfirm={handleConfirmPendingItem}/>}
      {modal==="help" && <Modal onClose={()=>setModal(null)} title="LabTrack — Help & Guide" mw={640}>
        <div style={{display:"flex",flexDirection:"column",gap:20,fontSize:13}}>
          {[
            {icon:"box",title:"Inventory Tab",color:"var(--cyan)",items:["Add items with the + button. Fill in name, category, location, and quantity.","Set Min Stock to get a red Low Stock badge when qty drops to or below that number.","Shared items (e.g. toolboxes) stay Available when checked out — multiple people can use them simultaneously.","Consumable items (e.g. stickers, reagents) show a Use button on the card — enter quantity used to deduct without a formal checkout.","Each item gets a Label ID (e.g. RM-000001). Print it on a sticker and attach it to the physical item. Configure prefixes in Settings → Manage Categories.","When adding multiple cameras, laptops, or robots, check 'Track each unit individually' to create separate items with sub-IDs (e.g. CE-000042-001, CE-000042-002), each with its own serial number.","Click any item card to see full details, checkout history, and quick actions."]},
            {icon:"tag",title:"Usage / Checkout Tab",color:"var(--blue)",items:["Use Check Out to assign a non-consumable, non-shared item to a person. Enter qty, dates, and optional notes.","Shared items can be checked out by multiple people at the same time and remain Available.","Consumable items do not appear in the checkout list — use the Use button on the card instead.","Mark items Returned when done. Overdue checkouts are highlighted in red.","Only the person who created the checkout, listed group members, or admins can return an item.","Group members: when checking out, optionally add teammates' emails (comma-separated) so they can also return the item.","Bulk Return lets you return multiple items at once."]},
            {icon:"cart",title:"Order Requests Tab",color:"var(--amber)",items:["Submit purchase requests with store, item, link, qty, and price.","Only the person who submitted an order (or an admin) can edit it.","Select multiple orders with checkboxes → Copy Text generates a bullet-list (qty · item · link · price) with grand total — ready to paste into an email or message. Save to Sheet writes the same summary as a table to your Google Sheet.","Admins can move orders through: Pending → Approved → Ordered → Received.","When marked Received, a staging form opens — fill in location, label ID, and serial number before it is added to inventory.","Deliveries are automatically logged when an order is marked Received."]},
            {icon:"calendar",title:"Calendar Tab",color:"var(--purple)",items:["Visual monthly calendar showing deliveries, active checkouts, and return due dates.","Color-coded: green = delivery, blue = checkout start, amber = return due.","Click any day to see all events on that date."]},
            {icon:"layers",title:"Item Statuses",color:"var(--sub)",items:["🟢 Available — ready to use","🔵 In Use — checked out by one or more people","🟡 Maintenance — temporarily out of service","🔴 Broken — damaged or needs repair","⚠️ Low Stock — qty is at or below the Min Stock threshold (shown as a badge)"]},
            {icon:"settings",title:"Settings (Admin only)",color:"var(--orange)",items:["Manage Categories — add, remove, or rename categories; set label ID prefix per category (e.g. RM for Robots & Motors).","Admins list — edit in the Settings tab of the Google Sheet (JSON array of @jh.edu sign-in addresses, not @jhu.edu).","Slack notifications — set slack_mode in Settings tab: all | important | digest | off.","Your Microsoft token expires after ~1 hour and renews silently in the background. If you see a red banner at the top, click Sign In Again."]},
          ].map(s=>(
            <div key={s.title}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><Ico n={s.icon} s={16} col={s.color}/><strong style={{color:s.color,fontFamily:"'Roboto',sans-serif"}}>{s.title}</strong></div>
              <ul style={{margin:0,paddingLeft:20,color:"var(--sub)",lineHeight:1.9}}>{s.items.map((it,i)=><li key={i}>{it}</li>)}</ul>
            </div>
          ))}
        </div>
      </Modal>}
      {detail && <ItemDetail item={detail} checkouts={checkouts} onClose={()=>setDetail(null)} onReturn={handleReturn} onQuickCheckout={handleQuickCheckout} onEdit={handleEditItem} categories={categories} editLocked={editLocked}/>}
      {groupDetail && <GroupDetail group={groupDetail} checkouts={checkouts} onClose={()=>setGroupDetail(null)} onEdit={handleEditItem} onQuickCheckout={handleQuickCheckout} onReturn={handleReturn} editLocked={editLocked} categories={categories} onAddUnit={async (newUnit)=>{const fid=await handleAddItem(newUnit);setGroupDetail(p=>p?{...p,qty:(p.qty||0)+1,_items:[...(p._items||[]),{...newUnit,displayId:fid||newUnit.displayId}]}:p);}}/>}
      {confirm && <ConfirmModal msg={confirm.msg} onConfirm={confirm.onConfirm} onClose={()=>setConfirm(null)}/>}

      <ToastStack toasts={toasts} rm={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(LabInventory));
</script>
</body>
</html>
