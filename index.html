<script type="module">
// MSAL v3+ ships ESM only (Microsoft retired their own CDN), so it is imported
// as a module and handed to the Babel-compiled app below via window.msalReady.
import { PublicClientApplication } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.18.0/+esm";
window.msalReady = (async () => {
  const app = new PublicClientApplication({
    auth: {
      clientId: window.ENTRA_CONFIG.client_id,
      // Tenant-specific authority: Microsoft itself rejects non-JHU accounts,
      // before any token ever reaches us.
      authority: "https://login.microsoftonline.com/" + window.ENTRA_CONFIG.tenant_id,
      redirectUri: location.origin + location.pathname,
    },
    cache: { cacheLocation: "localStorage" },
  });
  await app.initialize();
  window.msalApp = app;
  return app;
})();
window.msalReady.catch(e => console.error("[MSAL] init failed:", e));
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* ── JHU palette ─────────────────────────────────────────────────────────────
   Light is the default. Surfaces, text and semantic hues mirror the lab site's
   tokens (assets/css/app.scss on jhu-alliancelab.github.io) so LabTrack reads as
   part of alliance-ai.cs.jhu.edu rather than a separate product.

   Heritage Blue #002D72 is JHU's primary and carries every UI accent here.
   Text placed on an accent fill uses --on-accent, which flips with the mode —
   the accent is dark in light mode and light in dark mode.

   The four hues that share the calendar (delivery / checked out / return due /
   overdue) were validated together rather than picked by eye, all-pairs, per
   mode. Light on #ffffff: worst CVD ΔE 16.8, normal-vision 21.6, contrast pass
   except Spirit Blue at 2.44 — which is covered, every chip and the legend
   carry a text label. Dark on #0f1825: CVD 9.7, normal-vision 16.7, contrast
   pass; Spirit Blue and gold sit slightly above the dark lightness band
   (0.71 / 0.69 vs 0.67), a deliberate trade — both discriminability gates pass
   and the band governs even visual weight, not legibility.

   Green is deliberately NOT one of those four. Green-for-delivery beside
   red-for-overdue measured ΔE 5.1 under deuteranopia, below the floor of 6:
   the two lab members most likely to care about an overdue item could not tell
   the chips apart. Green now only marks "available" / "all clear", where it
   never sits next to red. */
:root{
  --bg0:#f4f7fb; --bg1:#ffffff; --bg2:#ebf3fb; --bg3:#dfeaf7; --bg4:#cdd8ea;
  --border:#cdd8ea; --border-hi:#b0d0f4;
  --text:#1a2030; --sub:#334155; --dim:#64748b;
  --on-accent:#ffffff;
  --cyan:#002d72; --cyan-d:#e6eefa; --cyan-m:#004eb3;   /* Heritage Blue — primary accent */
  --spirit:#68ace5; --spirit-d:#e6f1fb;                  /* Spirit Blue — delivery */
  --blue:#004eb3; --blue-d:#e2ecfa;                      /* checked out / in use */
  --amber:#a8820a; --amber-d:#f8f1d8;                    /* return due — JHU gold, darkened into band */
  --red:#9a2c2c; --red-d:#f9e9e9;                        /* overdue / danger */
  --green:#2e7d32; --green-d:#e8f3e9;                    /* available / all clear */
  --purple:#6a4c93; --purple-d:#efeaf7;
  --orange:#b5651d; --orange-d:#faeee3;
}
/* ── Dark mode — its own steps from the same hue families, not a flip ── */
html.dark{
  --bg0:#0b1220; --bg1:#0f1825; --bg2:#16202f; --bg3:#1f2b3d; --bg4:#2a3850;
  --border:#22314a; --border-hi:#33456a;
  --text:#e6ecf5; --sub:#9baac0; --dim:#64748b;
  --on-accent:#0f1825;
  --cyan:#68ace5; --cyan-d:#122a44; --cyan-m:#4a8fd0;
  --spirit:#5ba9e8; --spirit-d:#122a44;
  --blue:#3a6fbe; --blue-d:#101f38;
  --amber:#be9420; --amber-d:#2b2210;
  --red:#ce5a5a; --red-d:#2e1414;
  --green:#4c9e5a; --green-d:#0f2618;
  --purple:#9c86c4; --purple-d:#1d1830;
  --orange:#cf8a4e; --orange-d:#2b1c10;
}
body{background:var(--bg0);color:var(--text);font-family:'Outfit',sans-serif;margin:0;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg1);}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px;}
select option{background:var(--bg2);}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:none;}
html.dark input[type=date]::-webkit-calendar-picker-indicator,html.dark input[type=time]::-webkit-calendar-picker-indicator{filter:invert(0.6);}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes toastSlide{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

.card-item{transition:all .2s cubic-bezier(.4,0,.2,1);cursor:pointer;}
/* Shadow tinted with Heritage Blue, matching --shadow-md on the lab site. */
.card-item:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(0,45,114,.13),0 0 0 1px rgba(104,172,229,.45);border-color:var(--border-hi)!important;}
html.dark .card-item:hover{box-shadow:0 14px 36px rgba(0,0,0,.55),0 0 0 1px rgba(104,172,229,.18);}
.row-hover:hover{background:var(--bg3)!important;}
.ibtn:hover{background:var(--bg3)!important;color:var(--text)!important;}
.chip-sel{background:var(--cyan-d)!important;color:var(--cyan)!important;border-color:var(--cyan-m)!important;}
.item-sel-row{background:var(--cyan-d)!important;border-color:var(--cyan-m)!important;}
.item-sel-row:hover{background:var(--cyan-d)!important;}
.overdue-pulse{animation:pulse 2s infinite;}
.sticky-th{position:sticky;top:0;background:var(--bg2);z-index:1;}
/* Every rule above reads from the tokens, so switching html.dark is the whole
   theme switch — there is no second set of mode-specific rules to keep in sync. */
</style>

<script type="text/babel" data-presets="react">

// ─── DYNAMIC DATE ────────────────────────────────────────────────────────────
// Local, not UTC. toISOString() names tomorrow from 20:00 in Baltimore, and this
// is not only drawn — it prefills the checkout and delivery date fields, so an
// evening checkout was *stored* under tomorrow's date. It also decides which
// calendar cell is ringed as today and, through isOverdue, which loans are late.
const getToday = () => { const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const uid = () => Date.now() + Math.floor(Math.random() * 1e9);
const toArr = v => Array.isArray(v) ? v.filter(x => x != null && x !== "") : [];
const getNow = () => { const n=new Date(); return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); };
const getDatePart = dt => dt ? String(dt).split(" ")[0] : "";
const getTimePart = dt => dt ? (String(dt).split(" ")[1]||"") : "";
const fmtDatetime = (d, t) => d ? (t ? `${d} ${t}` : d) : "";
const getTodayParts = () => {
  const d = new Date();
  return { d: d.getDate(), m: d.getMonth(), y: d.getFullYear() };
};

// ─── CONFIG ──────────────────────────────────────────────────────────────────

// app does is decide whose thing something is — your request, your overdue item —
// and a single member login can only ever show you one side of that.
const PREVIEW_USERS = [
  { role:"member", name:"Member One", email:"member1@preview" },
  { role:"member", name:"Member Two", email:"member2@preview" },
  { role:"admin",  name:"Admin",      email:"admin@preview"   },
];
const [M1,M2,ADM] = PREVIEW_USERS;

// ─── PREVIEW DEMO DATA ────────────────────────────────────────────────────────

// an inventory before they can see a checkout, a queue or an overdue row at all.
// This seeds one of each, dated relative to today so it never goes stale. It is

// a real backend never reaches this path.
const demoData = () => {

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`+(t?" "+t:"");};

// Decode a JWT payload for display only — never for authorization decisions.
// The Apps Script backend verifies the signature and every claim.
const decodeJwt = (t) => {
  try {
    let b = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return JSON.parse(atob(b));
  } catch { return null; }
};

// JHU sign-in names are <JHED>@jh.edu, which lands in preferred_username.
// The `email` claim is optional in Entra and is often the @jhu.edu alias instead,
// so preferred_username is the one that must match the Settings sheet lists.
const userFromAuthResult = (r) => {
  const c = decodeJwt(r.idToken) || {};
  const email = String(c.preferred_username || c.upn || c.email || (r.account && r.account.username) || "").trim().toLowerCase();
  return {
    token: r.idToken,
    name: c.name || (r.account && r.account.name) || email,
    email,
    homeAccountId: (r.account && r.account.homeAccountId) || "",
  };
};

const isOutOfStock = i => i && !isUntracked(i) && Number(i.qty)<=0;

const isOverdue = (co) => co.status === "Active" && co.ret && getDatePart(co.ret) < getToday();

// ─── BOOKING RULES ────────────────────────────────────────────────────────────
// Mirrors the three rules in google-apps-script.js. The backend is what actually
// enforces them — two people can open the form at the same moment and neither
// browser knows about the other's draft. This half exists so the form can say no
// before the round trip instead of after it. Keep the two in step.
const MAX_DAYS_WITHOUT_APPROVAL = 7;
const MAX_LEAD_DAYS = 31;              // how far ahead a booking may start
const MAX_HOLD_DAYS = 90;              // and how long it may run once it does
const CO_PENDING = "Pending Approval";
// A booking's two ends have to be read off the same clock. new Date("2026-08-25")
// is UTC midnight but new Date("2026-08-25T09:00") is local, and the form lets you
// leave the return *time* blank — so the end of a hold landed four hours before
// the day it names even started. Build it from the parts.
// Mirrors bookingMs_() in google-apps-script.js.
const bookingMs = s => {
  const m = String(s||"").trim().match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?$/);
  const d = m ? new Date(+m[1],+m[2]-1,+m[3],m[4]===undefined?0:+m[4],m[5]===undefined?0:+m[5])
              : new Date(String(s||"").trim().replace(" ","T"));
  return isNaN(d.getTime()) ? null : d.getTime();
};
const bookingDays = (out,ret) => { const a=bookingMs(out), b=bookingMs(ret); return (a===null||b===null) ? 0 : (b-a)/86400000; };
const needsApproval = c => bookingDays(c.out,c.ret) > MAX_DAYS_WITHOUT_APPROVAL;
const hhmmMins = t => { const m=String(t||"").match(/^(\d{1,2}):(\d{2})$/); return m ? parseInt(m[1],10)*60+parseInt(m[2],10) : null; };
// Two bookings collide when their date ranges overlap AND their daily windows do.
// No window means all day, which collides with anything inside the range.
const bookingsClash = (a,b) => {
  const aS=bookingMs(a.out), aE=bookingMs(a.ret), bS=bookingMs(b.out), bE=bookingMs(b.ret);
  if(aS===null||aE===null||bS===null||bE===null) return false;
  if(aS>=bE||bS>=aE) return false;
  const aF=hhmmMins(a.fromTime), aT=hhmmMins(a.toTime), bF=hhmmMins(b.fromTime), bT=hhmmMins(b.toTime);
  if(aF===null||aT===null||bF===null||bT===null) return true;
  return aF<bT && bF<aT;
};
// A request starting months out would hold its slot open against every
// overlapping booking until somebody decided it, so one speculative request could
// freeze an item for a term. Only the start is capped; a long hold is still
// allowed, it just needs approval. Past starts stay legal — checkouts get logged
// after the fact. Mirrors leadTooFar_() in google-apps-script.js.
const leadLimitDate = () => { const d=new Date(Date.now()+MAX_LEAD_DAYS*86400000); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const leadTooFar = out => { const st=bookingMs(out); return st!==null && st-Date.now() > MAX_LEAD_DAYS*86400000; };
const hasWindow = c => hhmmMins(c.fromTime)!==null && hhmmMins(c.toTime)!==null;
const windowLabel = c => hasWindow(c) ? `${c.fromTime}–${c.toTime} daily` : "All day";
// Only an active booking holds the slot. A pending request reserves nothing —
// that is the whole point of it being pending — so several people may ask for the
// same week and an admin picks between them.
const blocksSlot = c => c.status==="Active";
// Has it begun? An Active booking holds its item from its start until somebody
// returns it — a hold for next month is on the calendar rather than in anybody's
// hands, but one that is merely late is still very much in them.
// Mirrors bookingHoldsItem_() in google-apps-script.js.
const bookingHoldsItem = c => { const a=bookingMs(c.out); return a===null||a<=Date.now(); };
// Which physical row a booking is about. Bookings written before itemId was
// populated have only the name to go on, and split units share a name — so the id
// wins whenever there is one. Mirrors updateItemStatus()'s target in the backend.
const isCheckoutTarget = (item, co) =>
  (co.itemId!==undefined&&co.itemId!==null&&String(co.itemId)!=="")
    ? String(item.id)===String(co.itemId)
    : item.name===co.item;
// What an item's flag should say, given every booking there is. Derived rather than
// asserted, because a sole-use item may carry a second Active booking for later now
// that rule 2 judges by date — so ending one hold does not mean the thing is back —
// and because Maintenance and Broken are somebody's call about the object that a
// return must not quietly undo. Mirrors updateItemStatus()/syncItemStatuses().
const deriveItemState = (item, allCheckouts) => {
  if(item.status==="Maintenance"||item.status==="Broken") return {status:item.status,usedBy:toArr(item.usedBy)};
  const holders=[];
  allCheckouts.forEach(c=>{
    if(c.status!=="Active"||!bookingHoldsItem(c)) return;
    if(!isCheckoutTarget(item,c)) return;
    if(!holders.includes(c.user)) holders.push(c.user);
  });
  return {status:(!item.shared&&holders.length)?"In Use":"Available", usedBy:holders};
};
const isPending  = c => c.status===CO_PENDING;
// Bookings written before itemId was populated have only the name to go on.
const sameBooked = (a,b) => (a.itemId&&b.itemId) ? String(a.itemId)===String(b.itemId) : a.item===b.item;
// Competing requests exist for sole-use items too, and matter most there: nothing
// is marked In Use, so the availability filter cannot see the queue at all.
const rivalsFor = (c, all) => all.filter(x=>String(x.id)!==String(c.id)&&isPending(x)&&sameBooked(x,c)&&bookingsClash(x,c));
// Why a booking has to wait, or "" if it can go straight through. Being long is
// the obvious reason. The other is that somebody is already queuing for the same
// slot: without this a three-day booking would take what a three-week request has
// been waiting on, and win purely by being short enough to skip the queue.
// Mirrors waitReason_() in google-apps-script.js — keep the two in step.
const waitReason = (c, all) => needsApproval(c) ? "long" : (rivalsFor(c,all).length ? "queue" : "");
const blockerFor = (c, all) => all.find(x=>String(x.id)!==String(c.id)&&blocksSlot(x)&&sameBooked(x,c)&&bookingsClash(x,c));
// Why a booking's dates don't make sense, or "" if they do. Every rule above is a
// comparison between two instants, and comparing against a non-date is false — so
// a backwards range doesn't trip the rules, it slips past all of them at once: it
// measures as negative days so it never needs approval, it clashes with nothing so
// it never blocks, and it covers no calendar day so it draws nowhere, while
// sitting in the list as an active, already-overdue loan. Typing the wrong month
// into the second date box is all it takes.
// Mirrors badRange_() in google-apps-script.js — keep the two in step.
const badRange = c => {
  const a=bookingMs(c.out), b=bookingMs(c.ret);
  if(a===null) return "Pick a checkout date";
  if(b===null) return "Pick a return date";
  if(b<=a) return "The return date has to be after the checkout date";
  // Rule 3's queue is transitive, so a hold running to next June puts every booking
  // until then behind an admin. Set well past any real hold, to catch the typo.
  if(b-a > MAX_HOLD_DAYS*86400000) return `A booking can run for at most ${MAX_HOLD_DAYS} days — check the return date's year`;
  const hasFrom=String(c.fromTime||"")!=="", hasTo=String(c.toTime||"")!=="";
  if(hasFrom!==hasTo) return "A daily window needs both a start and an end time";
  if(hasFrom&&!(hhmmMins(c.fromTime)!==null&&hhmmMins(c.toTime)!==null&&hhmmMins(c.fromTime)<hhmmMins(c.toTime)))
    return "The daily window has to end after it starts";
  return "";
};

// ─── IMAGE COMPRESSION ──────────────────────────────────────────────────────
// Resolves to a data URL, or to "" if the file cannot be read or decoded — a HEIC
// straight off a phone, a renamed .txt, a truncated download. Without the error
// paths the promise simply never settled and the upload sat there forever with
// nothing on screen to say why.
const compressImage = (file) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onerror = () => resolve("");
  reader.onload = (e) => {
    const img = new Image();
    img.onerror = () => resolve("");
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if (w > 400) { h = Math.round(h * 400 / w); w = 400; }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.7));
      } catch { resolve(""); }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// ─── BACKEND API ──────────────────────────────────────────────────────────────
const API = {
  async fetchAll(token) {
    if (!APP_CONFIG.apps_script_url) return null;
    try {
      const url = APP_CONFIG.apps_script_url + "?token=" + encodeURIComponent(token);
      const r = await fetch(url, { redirect: "follow" });
      const text = await r.text();
      try { return JSON.parse(text); } catch { console.error("[API] Not JSON:", text.slice(0, 500)); return null; }
    } catch(e) { console.error("[API] fetchAll error:", e); return null; }
  },
  async post(token, action, payload) {
    if (!APP_CONFIG.apps_script_url) return null;
    try {
      const body = JSON.stringify({ token, action, ...payload });
      const r = await fetch(APP_CONFIG.apps_script_url, {
        method: "POST", body: body, redirect: "follow",
      });
      const text = await r.text();
      try { return JSON.parse(text); }
      catch {
        // Apps Script answers a thrown script, a quota refusal or a bad deployment
        // with an HTML page. Treating that as success reported writes as saved
        // that never reached the sheet.
        console.error("[API] Not JSON:", text.slice(0, 500));
        return { error: "Bad response", detail: "The lab sheet answered with something that wasn't a result — the write may not have been saved. Reload to see what actually landed." };
      }
    } catch(e) { console.error("[API] post error:", e); return null; }
  }
};

// ─── MODAL SHELL ─────────────────────────────────────────────────────────────
const Modal = ({onClose,title,mw=560,children,noPad,dirty=false,saving=false}) => {
  const mdTarget=useRef(null);
  const [warnClose,setWarnClose]=useState(false);
  const warnTimer=useRef(null);
  const handleBdMD=e=>{mdTarget.current=e.target;};
  const handleBdClick=e=>{
    if(saving) return; // never close while a save is in flight
    if(e.target!==e.currentTarget||mdTarget.current!==e.currentTarget)return;
    if(dirty&&!warnClose){
      setWarnClose(true);
      clearTimeout(warnTimer.current);
      warnTimer.current=setTimeout(()=>setWarnClose(false),3000);
      return;
    }
    clearTimeout(warnTimer.current);
    onClose();
  };
  return(
    <div onMouseDown={handleBdMD} onClick={handleBdClick} style={{position:"fixed",inset:0,background:"rgba(7,9,15,.88)",backdropFilter:"blur(7px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--bg1)",border:"1px solid var(--border-hi)",borderRadius:16,width:"100%",maxWidth:mw,maxHeight:"94vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 32px 80px rgba(0,0,0,.8),0 0 0 1px rgba(0,212,200,.05)",animation:"fadeUp .22s ease"}}>

          <div style={{width:13,height:13,border:"2px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite",flexShrink:0}}/>

        </div>}
        {!saving&&warnClose&&<div style={{background:"var(--amber-d)",borderBottom:"1px solid color-mix(in srgb, var(--amber) 38%, transparent)",padding:"8px 20px",display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--amber)",flexShrink:0}}>⚠ Click outside again to discard unsaved changes</div>}
        {title!==false&&(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 24px 16px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
            <h2 style={{margin:0,color:"var(--text)",fontSize:17,fontFamily:"'Roboto',sans-serif",fontWeight:700}}>{title}</h2>

              ? <div style={{width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:16,height:16,border:"2px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/></div>

// ─── TAG INPUT ───────────────────────────────────────────────────────────────
const TagInput = ({tags,onChange,placeholder=""}) => {
  const [inp,setInp]=useState("");
  const inpRef=useRef(null);
  const add=()=>{const t=inp.trim();if(t&&!tags.includes(t))onChange([...tags,t]);setInp("");};
  const remove=i=>onChange(tags.filter((_,j)=>j!==i));
  const onKeyDown=e=>{
    if(e.key==="Enter"||e.key===","){e.preventDefault();add();}
    if(e.key==="Backspace"&&!inp&&tags.length>0){e.preventDefault();remove(tags.length-1);}
  };
  return(
    <div onClick={()=>inpRef.current?.focus()} style={{display:"flex",flexWrap:"wrap",gap:4,padding:"5px 8px",border:"1px solid var(--border)",borderRadius:8,background:"var(--bg2)",cursor:"text",minHeight:38,alignItems:"center"}}>
      {tags.map((t,i)=>(
        <span key={i} style={{background:"var(--bg3)",border:"1px solid var(--border-hi)",borderRadius:5,padding:"2px 7px",fontSize:11,display:"inline-flex",alignItems:"center",gap:3,color:"var(--text)",lineHeight:1.4}}>
          {t}
          <span onMouseDown={e=>{e.preventDefault();remove(i);}} style={{cursor:"pointer",color:"var(--dim)",fontSize:14,lineHeight:1,userSelect:"none",marginLeft:2}}>×</span>
        </span>
      ))}
      <input ref={inpRef} value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={onKeyDown} onBlur={add}
        placeholder={tags.length===0?placeholder:""}
        style={{flex:1,minWidth:80,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:13,padding:"2px 4px"}}/>
    </div>
  );
};
// Renders a comma-separated desc string as chips (if it looks like tags) or plain text
const DescChips = ({desc}) => {
  if(!desc)return <span style={{color:"var(--dim)",fontSize:13}}>No description.</span>;

  if(tags.length<=1&&desc.length>40)return <p style={{color:"var(--sub)",fontSize:13,lineHeight:1.6,margin:0}}>{desc}</p>;

    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>

    </div>
  );
};

const ImageUpload = ({value, onChange}) => {
  const fileRef = useRef(null);

  const [showUrl, setShowUrl] = useState(false);
  const [urlVal, setUrlVal] = useState(value && !value.startsWith("data:") ? value : "");

  const [imgErr, setImgErr] = useState("");
  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImgErr("");
    const compressed = await compressImage(file);
    if (!compressed) { setImgErr("That file couldn't be read as an image — try a JPEG or PNG."); return; }
    onChange(compressed);
  };

  return (
    <div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
      {imgErr&&<div style={{color:"var(--red)",fontSize:12,marginBottom:6}}>{imgErr}</div>}

      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>

        <Btn sm onClick={addCat} disabled={!newCat.trim()}><Ico n="plus" s={12} col="var(--on-accent)"/>Add</Btn>

// ─── SEARCHABLE ITEM PICKER ──────────────────────────────────────────────────
// `exclude` is the ids already claimed by the other slots of the same checkout.
// The status filter below only sees committed state, so without this two slots
// in one unsubmitted form could both take the same unit and it would go out twice.
const ItemPicker = ({items, value, onChange, categories, exclude}) => {
  const [q, setQ] = useState("");
  const [cat, setCat] = useState("All");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const inputRef = useRef(null);
  // Addressed by id, not name: split units share a name and differ only by id and
  // label, so a name could never say which physical unit was being taken.
  const selected = items.find(i=>String(i.id)===String(value));
  // Excluded: consumables (they get a Use button), anything Broken or in
  // Maintenance, and whatever the other slots of this same checkout already hold.
  // An item somebody currently has is deliberately still offered — you may be
  // booking it for after it comes back, and rule 2 refuses the dates that collide.
  const taken = new Set((exclude||[]).filter(Boolean).map(String));
  const avail = items.filter(i=>canCheckOut(i) && !taken.has(String(i.id)));
  const filtered = avail.filter(i=>{
    const match = i.name.toLowerCase().includes(q.toLowerCase()) || i.loc?.toLowerCase().includes(q.toLowerCase()) || i.desc?.toLowerCase().includes(q.toLowerCase());
    return match && (cat==="All" || i.cat===cat);
  });
  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",handler);
    return()=>document.removeEventListener("mousedown",handler);
  },[]);
  useEffect(()=>{if(open&&inputRef.current)inputRef.current.focus();},[open]);
  const pick=(item)=>{onChange(item);setOpen(false);setQ("");};
  const ac = selected?getCatAccent(selected.cat,categories):"var(--dim)";
  return(
    <div ref={ref} style={{position:"relative"}}>
      <button type="button" onClick={()=>setOpen(o=>!o)} style={{width:"100%",background:"var(--bg3)",border:`1px solid ${open?"var(--cyan-m)":"var(--border)"}`,color:selected?"var(--text)":"var(--sub)",borderRadius:8,padding:"9px 12px",fontSize:14,fontFamily:"'Outfit',sans-serif",textAlign:"left",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,transition:"border-color .15s"}}>
        {selected?(
          <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:ac,flexShrink:0}}/>
            <span style={{fontWeight:600}}>{selected.name}</span>
            <span style={{color:"var(--dim)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace"}}>{selected.loc}</span>
            <Badge status={stockStatus(selected)||selected.status}/>
          </div>
        ):<span>Search or select an item...</span>}
        <span style={{color:"var(--dim)",fontSize:10,flexShrink:0}}>{open?"▲":"▼"}</span>
      </button>
      {open&&(
        <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"var(--bg2)",border:"1px solid var(--border-hi)",borderRadius:12,zIndex:50,boxShadow:"0 16px 48px rgba(0,0,0,.7)",animation:"fadeUp .18s ease",overflow:"hidden"}}>
          <div style={{padding:"12px 12px 8px",borderBottom:"1px solid var(--border)"}}>
            <div style={{position:"relative"}}>
              <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)"}}><Ico n="search" s={14} col="var(--dim)"/></span>
              <input ref={inputRef} placeholder="Type item name, location..." value={q} onChange={e=>setQ(e.target.value)} style={{width:"100%",background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"8px 10px 8px 32px",fontSize:13,outline:"none",fontFamily:"'Outfit',sans-serif"}}/>
              {q&&<button onClick={()=>setQ("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:0,display:"flex"}}><Ico n="x" s={13}/></button>}
            </div>
          </div>
          <div style={{display:"flex",gap:6,padding:"8px 12px",flexWrap:"wrap",borderBottom:"1px solid var(--border)"}}>
            {["All",...categories].map(c=>{
              const count = c==="All"?avail.length:avail.filter(i=>i.cat===c).length;
              if(count===0&&c!=="All")return null;
              const isSel = cat===c;
              const ac2=getCatAccent(c,categories);
              return(<button key={c} onClick={()=>setCat(c)} style={{background:isSel?(c==="All"?"var(--bg4)":`${ac2}18`):"var(--bg3)",color:isSel?(c==="All"?"var(--text)":ac2):"var(--sub)",border:`1px solid ${isSel?(c==="All"?"var(--border-hi)":ac2):"var(--border)"}`,borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'Outfit',sans-serif",display:"flex",alignItems:"center",gap:5,transition:"all .15s"}}>{c} <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,opacity:.7}}>{count}</span></button>);
            })}
          </div>
          <div style={{maxHeight:280,overflow:"auto"}}>
            {filtered.length===0?(
              <div style={{padding:"24px 16px",textAlign:"center",color:"var(--dim)",fontSize:13}}>No items match "{q}"</div>
            ):filtered.map(item=>{
              const itemAc=getCatAccent(item.cat,categories);const low=isLowStock(item);const isSel=String(item.id)===String(value);
              return(
                <div key={item.id} onClick={()=>pick(item)} className={isSel?"item-sel-row":"row-hover"} style={{padding:"10px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:12,borderBottom:"1px solid var(--border)",transition:"background .12s"}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:low?"var(--red)":itemAc,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,color:"var(--text)",marginBottom:1}}>{item.name}</div>
                    {/* The label ID is what separates split units — without it two
                        siblings render as identical rows and can't be told apart. */}
                    <div style={{color:"var(--dim)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{item.displayId?item.displayId+" · ":""}{item.cat} · {item.loc}</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:14,fontWeight:800,fontFamily:"'Roboto',sans-serif",color:low?"var(--red)":itemAc}}>{item.qty}</div>
                    <div style={{fontSize:10,color:"var(--dim)"}}>{item.unit}</div>
                  </div>
                  {(low||item.status==="In Use")&&<Badge status={stockStatus(item)||item.status}/>}
                  {/* Fixed-size box, always rendered — the tick used to appear out of
                      nowhere at the end of the row and shove the qty column sideways. */}
                  <span style={{width:18,height:18,borderRadius:5,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",
                                border:`1.5px solid ${isSel?"var(--cyan)":"var(--border-hi)"}`,background:isSel?"var(--cyan)":"transparent",transition:"all .12s"}}>
                    {isSel&&<Ico n="check" s={11} col="var(--on-accent)"/>}
                  </span>
                </div>
              );
            })}
          </div>
          <div style={{padding:"8px 14px",borderTop:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:"var(--dim)",fontSize:11}}>{filtered.length} item{filtered.length!==1?"s":""}</span>
            {value&&<button onClick={()=>{onChange("");setQ("");}} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",fontSize:11}}>Clear</button>}
          </div>
        </div>
      )}
    </div>
  );
};

// ─── CHECKOUT MODAL (multi-item) ─────────────────────────────────────────────
const CheckoutModal = ({items,onClose,onAdd,preItem="",userName="",userEmail="",categories,checkouts=[]}) => {
  const [coUser,setCoUser]=useState(userName);
  const [outDate,setOutDate]=useState(getToday());
  const [outTime,setOutTime]=useState(getNow());
  const [retDate,setRetDate]=useState("");
  const [retTime,setRetTime]=useState("");
  const [notes,setNotes]=useState("");
  const [groupEmails,setGroupEmails]=useState("");
  // Shared items are booked by the hour, so a checkout has to say whether it holds
  // the item for the whole day or only a window of it. All day is the default —
  // it is the stricter of the two, so nobody books a slot they didn't mean to free.
  const [allDay,setAllDay]=useState(true);
  const [fromTime,setFromTime]=useState("09:00");
  const [toTime,setToTime]=useState("17:00");
  // Slots carry the unit's id. preItem is an id too — a name cannot identify one
  // of several split units, which is how checking out one ended up moving them all.
  const [slots,setSlots]=useState(()=>{
    const pre=items.find(i=>String(i.id)===String(preItem)&&canCheckOut(i));
    return [{itemId:pre?pre.id:"",item:pre?pre.name:"",qty:1}];
  });
  const addSlot=()=>setSlots(p=>[...p,{itemId:"",item:"",qty:1}]);
  const removeSlot=i=>setSlots(p=>p.filter((_,j)=>j!==i));
  const updSlot=(i,patch)=>setSlots(p=>p.map((s,j)=>j===i?{...s,...patch}:s));
  const valid=slots.filter(s=>s.itemId);
  const hasOutOfStock=valid.some(s=>{const it=items.find(i=>String(i.id)===String(s.itemId));return it&&(it.qty??0)<=0;});
  const out=fmtDatetime(outDate,outTime);
  const ret=fmtDatetime(retDate,retTime);
  // A window only means something for an item several people share. A sole-use item
  // is held for the whole span whatever the clock says, so asking would be a lie.
  const sharedSel=valid.filter(sl=>items.find(i=>String(i.id)===String(sl.itemId))?.shared);
  const askWindow=sharedSel.length>0;
  const win=(askWindow&&!allDay)?{fromTime,toTime}:{fromTime:"",toTime:""};
  // Backwards dates and a backwards window are the same class of mistake, so they
  // are refused by the same test the backend uses. Named for the message it shows.
  const rangeErr=badRange({out,ret,...win});
  // Only complain about the return date once the person has actually picked one.
  const badWindow=retDate.trim()?rangeErr:"";
  // Rule 2 — a shared item can be booked again, but not over someone else's slot.
  // Rule 2 — an active booking owns its slot, whether or not the item is shared.
  // This used to cover only shared items, mirroring a backend rule that has since
  // been widened: a sole-use item was kept exclusive by being hidden from the
  // picker, which could not tell one date from another.
  const clashes=valid.map(sl=>{
    const sel=items.find(i=>String(i.id)===String(sl.itemId));
    const mine={out,ret,...(sel?.shared?win:{fromTime:"",toTime:""})};
    const hit=checkouts.find(c=>blocksSlot(c)&&sameBooked(c,{itemId:sl.itemId,item:sl.item})&&bookingsClash(mine,c));
    return hit?{item:sl.item,hit}:null;
  }).filter(Boolean);
  // Pending requests don't block, they just mean you are not the only one asking.
  // Sole-use items count here too — nothing is In Use, so the picker can't tell.
  const rivals=valid.flatMap(sl=>{
    const mine={itemId:sl.itemId,item:sl.item,out,ret,...(items.find(i=>String(i.id)===String(sl.itemId))?.shared?win:{fromTime:"",toTime:""})};
    return checkouts.filter(c=>isPending(c)&&sameBooked(c,mine)&&bookingsClash(c,mine)).map(c=>({item:sl.item,hit:c}));
  });
  // Rule 3 — over a week is an admin's call, whatever the item; and so is anything
  // that would step over someone already waiting.
  const longHold=!!ret&&bookingDays(out,ret)>MAX_DAYS_WITHOUT_APPROVAL;
  const willWait=longHold||rivals.length>0;
  const tooFar=leadTooFar(out);
  const canSubmit=coUser.trim()&&valid.length>0&&retDate.trim()&&!hasOutOfStock&&!clashes.length&&!badWindow&&!tooFar;
  const submit=()=>{
    if(!canSubmit)return;
    const ts=uid();
    valid.forEach((sl,i)=>{
      const sel=items.find(it=>String(it.id)===String(sl.itemId));
      onAdd({id:ts+i,itemId:sl.itemId,item:sl.item,user:coUser.trim(),out,ret,qty:sel?.shared?1:Math.min(sl.qty,sel?.qty||1),notes,groupEmails:groupEmails.trim(),
             status:willWait?CO_PENDING:"Active",...(sel?.shared?win:{fromTime:"",toTime:""})});
    });
    onClose();
  };
  const timeInputStyle={background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 10px",color:"var(--text)",fontSize:14,outline:"none",width:"100%",fontFamily:"'Roboto',sans-serif",boxSizing:"border-box"};
  return(
    <Modal onClose={onClose} title="Check Out Items" mw={660} dirty={valid.length>0||retDate.trim()!==""||notes.trim()!==""||groupEmails.trim()!==""}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Fld label="Person *"><Inp placeholder="Your name" value={coUser} onChange={e=>setCoUser(e.target.value)}/></Fld>
          <Fld label="Notes (optional)"><Inp placeholder="Experiment, purpose…" value={notes} onChange={e=>setNotes(e.target.value)}/></Fld>
          <Fld label="Checkout Date" hint={`At most ${MAX_LEAD_DAYS} days ahead`}><Inp type="date" max={leadLimitDate()} value={outDate} onChange={e=>setOutDate(e.target.value)}/></Fld>
          <Fld label="Checkout Time"><input type="time" value={outTime} onChange={e=>setOutTime(e.target.value)} style={timeInputStyle}/></Fld>
          <Fld label="Return By (date) *"><Inp type="date" value={retDate} onChange={e=>setRetDate(e.target.value)}/></Fld>
          <Fld label="Return By (time)"><input type="time" value={retTime} onChange={e=>setRetTime(e.target.value)} style={timeInputStyle}/></Fld>
          <div style={{gridColumn:"1/-1"}}>
            <Fld label="Group members (optional)" hint={"Others who can also return these items — comma-separated "+LAB.signin_hint+" sign-in addresses"}>
              <Inp placeholder="jdoe1@jh.edu, asmith3@jh.edu" value={groupEmails} onChange={e=>setGroupEmails(e.target.value)}/>
            </Fld>
          </div>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>Items to Check Out ({valid.length})</span>
            <Btn sm v="ghost" onClick={addSlot}><Ico n="plus" s={12}/>Add Another</Btn>
          </div>
          {slots.map((sl,i)=>{
            const sel=items.find(it=>String(it.id)===String(sl.itemId));
            const maxQ=sel?.qty??0;
            const outOfStock=sel&&maxQ<=0;
            return(
              <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                <div style={{flex:1}}><ItemPicker items={items} value={sl.itemId} exclude={slots.filter((_,j)=>j!==i).map(s=>s.itemId)} onChange={it=>updSlot(i,{itemId:it.id,item:it.name})} categories={categories}/></div>
                {/* No quantity on a shared item. Several people hold one at once by
                    booking different hours, so a number here reads as capacity —
                    "3 of them are free" — which is not what it means and not what
                    rule 2 counts. A thing you can lend is one row with one label;
                    that is what Track each unit individually is for. */}
                {outOfStock
                  ?<span style={{fontSize:11,color:"var(--red)",fontWeight:700,whiteSpace:"nowrap"}}>Out of stock</span>
                  :sel?.shared
                    ?<span style={{fontSize:11,color:"var(--dim)",whiteSpace:"nowrap",fontFamily:"'IBM Plex Mono',monospace"}}>shared</span>
                    :<input type="number" min={1} max={maxQ} value={sl.qty} title={`Max ${maxQ}`} onChange={e=>updSlot(i,{qty:Math.min(maxQ,Math.max(1,parseInt(e.target.value)||1))})} style={{width:60,background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 8px",textAlign:"center",fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:15,color:"var(--text)",outline:"none"}}/>}
                {slots.length>1&&<button onClick={()=>removeSlot(i)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:4,display:"flex",flexShrink:0}}><Ico n="x" s={14}/></button>}
              </div>
            );
          })}
        </div>
        {askWindow&&(
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px"}}>
            <div style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",marginBottom:9}}>

            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <Btn sm v={allDay?"primary":"ghost"} onClick={()=>setAllDay(true)}>All day</Btn>

            </div>

                <span style={{color:"var(--dim)",fontSize:13}}>to</span>

            )}
          </div>
        )}
        {badWindow&&(
          <div style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            {badWindow}.
          </div>
        )}
        {tooFar&&(
          <div style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            Bookings can start at most {MAX_LEAD_DAYS} days from now — on or before <b>{leadLimitDate()}</b>. Reaching further out would hold the slot against everyone else until an admin got to it.
          </div>
        )}
        {clashes.map((cl,i)=>(
          <div key={i} style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            <b>{cl.item}</b> is already booked then — {cl.hit.user}, {windowLabel(cl.hit)}, {cl.hit.out} to {cl.hit.ret}
            {cl.hit.status===CO_PENDING&&" (awaiting approval)"}. Pick a slot that doesn't overlap.
          </div>
        ))}
        {rivals.length>0&&(
          <div style={{background:"var(--bg2)",border:`1px solid ${mix("--cyan",35)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            <div style={{fontWeight:700,marginBottom:5,display:"flex",alignItems:"center",gap:7}}>
              <Ico n="clock" s={14} col="var(--cyan)"/>
              {rivals.length===1?"Someone else has asked for this too":`${rivals.length} other people have asked for this too`}
            </div>
            {rivals.map((r,i)=>(
              <div key={i} style={{color:"var(--sub)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",marginTop:3}}>
                {r.hit.user} · {r.item} · {r.hit.out} to {r.hit.ret} · {windowLabel(r.hit)}
              </div>
            ))}
            <div style={{color:"var(--dim)",fontSize:12,marginTop:7}}>
              {longHold
                ? "An admin will see the requests side by side and pick between them."
                : "Because somebody is already waiting, this goes in as a request too rather than taking the slot from under them. An admin picks between them."}
            </div>
          </div>
        )}
        {longHold&&(
          <div style={{background:"var(--amber-d)",border:`1px solid ${mix("--amber",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            That's {Math.ceil(bookingDays(out,ret))} days. Holds longer than {MAX_DAYS_WITHOUT_APPROVAL} need an admin to approve them, so this goes in as a request — the item stays available to everyone until it is approved.
          </div>

        <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>

        </div>
      </div>
    </Modal>
  );
};

// ─── EDIT A REQUEST THAT IS STILL WAITING ────────────────────────────────────
// The usual reason to open this is that the app has just said your slot collides
// with someone else's. Cancelling and retyping the whole thing to move it by two
// hours would be silly, so the dates, the window and the group are editable in
// place. The item and the person are not — changing those makes it a new request.
const EditRequestModal = ({co,items,checkouts,onClose,onSave}) => {
  const [outDate,setOutDate]=useState(getDatePart(co.out)||getToday());
  const [outTime,setOutTime]=useState(String(co.out||"").split(" ")[1]||"09:00");
  const [retDate,setRetDate]=useState(getDatePart(co.ret)||"");
  const [retTime,setRetTime]=useState(String(co.ret||"").split(" ")[1]||"");
  const [allDay,setAllDay]=useState(!hasWindow(co));
  const [fromTime,setFromTime]=useState(co.fromTime||"09:00");
  const [toTime,setToTime]=useState(co.toTime||"17:00");
  const [groupEmails,setGroupEmails]=useState(co.groupEmails||"");

  const item=items.find(i=>String(i.id)===String(co.itemId));
  const askWindow=!!item?.shared;
  const win=(askWindow&&!allDay)?{fromTime,toTime}:{fromTime:"",toTime:""};
  const out=fmtDatetime(outDate,outTime);
  const ret=fmtDatetime(retDate,retTime);
  const draft={...co,out,ret,...win};
  const badWindow=retDate.trim()?badRange({out,ret,...win}):"";
  const blocker=blockerFor(draft,checkouts);
  const rivals=rivalsFor(draft,checkouts);
  const tooFar=leadTooFar(out);
  const days=ret?bookingDays(out,ret):0;
  const reason=ret?waitReason(draft,checkouts):"long";
  const stillPending=!!reason;
  const canSave=retDate.trim()&&!blocker&&!badWindow&&!tooFar;
  const timeInputStyle={background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 10px",color:"var(--text)",fontSize:14,outline:"none",width:"100%",fontFamily:"'Roboto',sans-serif",boxSizing:"border-box"};
  return(
    <Modal onClose={onClose} title="Edit Request" mw={600}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 13px"}}>
          <div style={{fontWeight:700,fontSize:14}}>{co.item}{Number(co.qty)>1&&<span style={{color:"var(--sub)",fontWeight:400,fontFamily:"'IBM Plex Mono',monospace",fontSize:12,marginLeft:6}}>×{Number(co.qty)}</span>}</div>
          <div style={{color:"var(--dim)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",marginTop:3}}>for {co.user} · waiting for approval</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Fld label="Checkout Date" hint={`At most ${MAX_LEAD_DAYS} days ahead`}><Inp type="date" max={leadLimitDate()} value={outDate} onChange={e=>setOutDate(e.target.value)}/></Fld>
          <Fld label="Checkout Time"><input type="time" value={outTime} onChange={e=>setOutTime(e.target.value)} style={timeInputStyle}/></Fld>
          <Fld label="Return By (date) *"><Inp type="date" value={retDate} onChange={e=>setRetDate(e.target.value)}/></Fld>
          <Fld label="Return By (time)"><input type="time" value={retTime} onChange={e=>setRetTime(e.target.value)} style={timeInputStyle}/></Fld>
          <div style={{gridColumn:"1/-1"}}>
            <Fld label="Group members (optional)" hint={"Others who can also return this — comma-separated "+LAB.signin_hint+" sign-in addresses"}>
              <Inp placeholder="jdoe1@jh.edu, asmith3@jh.edu" value={groupEmails} onChange={e=>setGroupEmails(e.target.value)}/>
            </Fld>
          </div>
        </div>
        {askWindow&&(
          <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px"}}>
            <div style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",marginBottom:9}}>Shared item — when each day?</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <Btn sm v={allDay?"primary":"ghost"} onClick={()=>setAllDay(true)}>All day</Btn>
              <Btn sm v={allDay?"ghost":"primary"} onClick={()=>setAllDay(false)}>Same hours each day</Btn>
            </div>
            {!allDay&&(
              <div style={{display:"flex",gap:8,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
                <input type="time" value={fromTime} onChange={e=>setFromTime(e.target.value)} style={{...timeInputStyle,width:"auto"}}/>
                <span style={{color:"var(--dim)",fontSize:13}}>to</span>
                <input type="time" value={toTime} onChange={e=>setToTime(e.target.value)} style={{...timeInputStyle,width:"auto"}}/>
                <span style={{color:"var(--dim)",fontSize:12}}>every day from {outDate} to {retDate||"…"}</span>
              </div>
            )}
          </div>
        )}
        {badWindow&&(
          <div style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            {badWindow}.
          </div>
        )}
        {tooFar&&(
          <div style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,color:"var(--text)",lineHeight:1.5}}>
            Bookings can start at most {MAX_LEAD_DAYS} days from now — on or before <b>{leadLimitDate()}</b>. Reaching further out would hold the slot against everyone else until an admin got to it.
          </div>
        )}
        {blocker&&(
          <div style={{background:"var(--red-d)",border:`1px solid ${mix("--red",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,lineHeight:1.5}}>
            That slot is taken — {blocker.user}, {windowLabel(blocker)}, {blocker.out} to {blocker.ret}. Pick a time that doesn't overlap.
          </div>
        )}
        {rivals.length>0&&!blocker&&(
          <div style={{background:"var(--bg2)",border:`1px solid ${mix("--cyan",35)}`,borderRadius:10,padding:"11px 14px",fontSize:13,lineHeight:1.5}}>
            <div style={{fontWeight:700,marginBottom:5}}>{rivals.length===1?"One other person has asked for this slot":`${rivals.length} other people have asked for this slot`}</div>
            {rivals.map(r=>(
              <div key={r.id} style={{color:"var(--sub)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",marginTop:3}}>{r.user} · {r.out} to {r.ret} · {windowLabel(r)}</div>
            ))}
          </div>
        )}
        <div style={{background:stillPending?"var(--amber-d)":"var(--green-d)",border:`1px solid ${mix(stillPending?"--amber":"--green",30)}`,borderRadius:10,padding:"11px 14px",fontSize:13,lineHeight:1.5}}>
          {!ret
            ? "Set a return date."
            : reason==="long"
              ? `${Math.ceil(days)} days — still over ${MAX_DAYS_WITHOUT_APPROVAL}, so it stays a request.`
              : reason==="queue"
                ? `${Math.max(1,Math.ceil(days))} day${Math.ceil(days)>1?"s":""} — short enough on its own, but ${rivals.length===1?"someone else is":`${rivals.length} others are`} already waiting for this slot, so it stays a request.`
                : `${Math.max(1,Math.ceil(days))} day${Math.ceil(days)>1?"s":""} — under ${MAX_DAYS_WITHOUT_APPROVAL} and clear of everyone else, so saving this checks the item out straight away. No approval needed.`}
        </div>
        <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={()=>{if(canSave){onSave(co.id,{out,ret,...win,groupEmails:groupEmails.trim()});onClose();}}} disabled={!canSave}>
            <Ico n="check" s={14} col="var(--on-accent)"/>{stillPending?"Save Request":"Save & Check Out"}
          </Btn>
        </div>
      </div>
    </Modal>
  );
};
