// ─── PER-UNIT FIELDS FOR A SPLIT ─────────────────────────────────────────────
// Unit 1 is the form above, not a separate thing — so its location is shown but
// not editable. Two inputs for one value is how they end up disagreeing, and it
// left the top Location field looking like it applied to nothing in particular.
// The rest inherit it unless overridden, which is what makes identical units
// free to skip.
// startIndex offsets the labels so this can also number units appended to an
// existing group; lockFirst is for the split forms, where unit 1 is the form above.
const SplitUnitFields = ({n, baseId, units, setUnits, baseLoc, startIndex=0, lockFirst=false}) => {
  const patch=(i,k)=>e=>{const a=[...units];a[i]={...(a[i]||{}),[k]:e.target.value};setUnits(a);};
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:8}}>
      {Array.from({length:n},(_,i)=>(
        <div key={i} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 10px"}}>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:700,color:"var(--cyan)",letterSpacing:"0.05em",marginBottom:6}}>{subIdOf(baseId,startIndex+i+1)}</div>
          <Fld label="Serial/Product No.">
            <Inp placeholder="e.g. SN-001" value={units[i]?.serial||""} onChange={patch(i,"serial")}/>
          </Fld>
          <Fld label="Location" hint={lockFirst&&i===0?"set in the form above":undefined}>
            {lockFirst&&i===0
              ? <Inp value={baseLoc||"—"} disabled style={{color:"var(--dim)",cursor:"not-allowed"}}/>
              : <Inp placeholder={baseLoc||"same as above"} value={units[i]?.loc||""} onChange={patch(i,"loc")}/>}
          </Fld>
        </div>
      ))}
    </div>
  );
};

// ─── USE A CONSUMABLE ────────────────────────────────────────────────────────
// Replaces a window.prompt(). A native dialog can't be styled or validated, gives
// no sense of what's left, and blocks the page while it is open.
const UseModal = ({item,onClose,onUse}) => {
  const max=Number(item.qty)||0;
  const [n,setN]=useState("1");
  const parsed=parseInt(n);
  const ok=max>0&&!isNaN(parsed)&&parsed>0;
  const v=Math.min(max,Math.max(1,parsed||1));
  return(
    <Modal onClose={onClose} title={`Use ${item.name}`} mw={400}>
      <Fld label={`How many ${item.unit||"units"}?`} hint={`${max} ${item.unit||"units"} in stock`}>
        <Inp type="number" min="1" max={max} value={n} onChange={e=>setN(e.target.value)} autoFocus/>
      </Fld>
      {ok&&<div style={{color:"var(--sub)",fontSize:12,marginTop:-6}}>Leaves {max-v} {item.unit||"units"} in stock.</div>}
      <div style={{borderTop:"1px solid var(--border)",marginTop:16,paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancel</Btn>
        <Btn disabled={!ok} onClick={()=>{onUse(item.id,v);onClose();}}><Ico n="check" s={14} col="var(--on-accent)"/>Use {ok?v:""}</Btn>
      </div>
    </Modal>
  );
};

// ─── REPORT A SUPPLY AS RUNNING LOW ──────────────────────────────────────────
// For items with no counted quantity there is nothing to deduct, so the only
// useful action is telling whoever restocks.
const NotifyModal = ({item,onClose,onNotify}) => {
  const [note,setNote]=useState("");
  return(
    <Modal onClose={onClose} title={`${item.name} — running low`} mw={430}>
      <div style={{color:"var(--sub)",fontSize:13,marginBottom:14,lineHeight:1.55}}>
        Sends a Slack notice to whoever restocks. This item's quantity isn't counted, so there is nothing to deduct — just say it's getting low.
      </div>
      <Fld label="Note (optional)" hint="e.g. about half a box left, need the 4mm size">
        <Inp placeholder="Anything useful for restocking" value={note} onChange={e=>setNote(e.target.value)} autoFocus/>
      </Fld>
      <div style={{borderTop:"1px solid var(--border)",marginTop:16,paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={()=>{onNotify(item,note.trim());onClose();}}><Ico n="alert" s={14} col="var(--on-accent)"/>Send notice</Btn>
      </div>
    </Modal>
  );
};

// ─── ADD ITEM MODAL ──────────────────────────────────────────────────────────
const AddItemModal = ({onClose,onAdd,categories,allItems,onShowLabel}) => {
  const [f,setF]=useState({name:"",cat:categories[0]||"Other",qty:"",unit:"units",loc:"",desc:"",minQty:"0",img:"",serial:"",shared:false,consumable:false,untracked:false});
  const [displayId,setDisplayId]=useState(()=>genDisplayId(categories[0]||"Other",allItems));
  // Splitting is the default for anything trackable, so this is an opt-OUT.
  const [splitOff,setSplitOff]=useState(false);
  const [units,setUnits]=useState([]);   // per-unit {serial, loc}
  const [advanced,setAdvanced]=useState(false);
  const [submitting,setSubmitting]=useState(false);
  const [warnNoLoc,setWarnNoLoc]=useState(false);
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const chk=k=>e=>setF(p=>({...p,[k]:e.target.checked}));
  const onCatChange=e=>{setF(p=>({...p,cat:e.target.value}));setDisplayId(genDisplayId(e.target.value,allItems));};
  const CHKBOX=(label,key)=><label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f[key]} onChange={chk(key)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>{label}</label>;
  const n=+f.qty||0;
  // A consumable is a pile you draw from, so it stays one row — you don't put a
  // sticker on each cable tie. Everything else is tracked per unit, which is what
  // makes "one of the two is out" expressible at all, so qty>1 splits by default.
  const canSplit=n>1&&!isConsumableCat(f.cat);
  const splitUnits=canSplit&&!splitOff;
  // Keep serials array in sync with qty when split mode is on
  useEffect(()=>{
    if(splitUnits&&n>0) setUnits(u=>Array.from({length:n},(_,i)=>u[i]||{serial:"",loc:""}));
  },[n,splitUnits]);
  // Duplicate detection: flag existing items sharing a meaningful keyword with the typed name
  const STOP_WORDS=new Set(["the","for","and","or","of","in","on","to","a","an","at","by","is","it","its","be","as","up","do","if","so","but","not","are","was","has","had","that","with","from","this","into","have","than","then","they","when","also","each","set","per","lot","pack","box","kit","new","pcs","qty","use","via","vs","type","size","mod","gen"]);
  const dupWords=f.name.toLowerCase().split(/\s+/).filter(w=>w.length>=3&&!STOP_WORDS.has(w));
  const dupCheck=f.name.length>=3&&dupWords.length>0
    ?allItems.filter(i=>dupWords.some(w=>(i.name||"").toLowerCase().includes(w)))
    :[];
  const submit=async()=>{
    if(!f.name||!f.qty||submitting)return;
    if(!f.loc.trim()&&!warnNoLoc){setWarnNoLoc(true);return;}
    setWarnNoLoc(false);
    setSubmitting(true);
    const {untracked, ...formFields} = f;   // untracked is a UI flag; it lives in the data as an empty qty
    const base={...formFields,minQty:isNaN(+f.minQty)?0:+f.minQty,status:"Available",usedBy:[],
      // Whichever flag the category hides is forced off, so a value set before
      // the category changed cannot survive as an invisible setting.
      shared:isConsumableCat(f.cat)?false:!!f.shared, consumable:isConsumableCat(f.cat)?!!f.consumable:false};
    try{
      if(splitUnits){
        // A blank per-unit field means "same as above" — that is what keeps the
        // extra forms cheap to skip when the units really are identical.
        const results=await Promise.all(Array.from({length:n},(_,u)=>onAdd({...base,id:uid(),qty:1,
          serial:String(units[u]?.serial||"").trim(),
          loc:u===0?base.loc:(String(units[u]?.loc||"").trim()||base.loc),   // unit 1 is the form above
          displayId:subIdOf(displayId,u+1)})));
        // Every unit gets its own sticker, so the label screen needs every ID —
        // and the server-confirmed ones, not a range recomputed from the first.
        // A unit that failed to save has no ID and must not appear as a sticker
        // to write, which is why this filters rather than counting.
        const ids=results.filter(Boolean);
        if(ids.length&&onShowLabel) onShowLabel({name:base.name,ids});
      } else {
        const finalId=await onAdd({...base,id:uid(),qty:f.untracked?"":n,displayId:f.consumable?"":displayId});
        // A consumable has no sticker to print, so skip the label screen.
        if(finalId&&onShowLabel&&!f.consumable) onShowLabel({name:base.name,ids:[finalId]});
      }
    } finally {
      setSubmitting(false);
      onClose();
    }
  };
  return(
    <Modal onClose={onClose} title="Add Item" dirty={f.name.trim()!==""||f.qty!==""} saving={submitting}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}>
          <Fld label="Item Name"><Inp placeholder="e.g. UR5 Robot Arm" value={f.name} onChange={s("name")}/></Fld>
          {dupCheck.length>0&&(
            <div style={{marginTop:6,background:"var(--amber-d)",border:"1px solid color-mix(in srgb, var(--amber) 38%, transparent)",borderRadius:7,padding:"8px 12px",fontSize:12,color:"var(--amber)"}}>
              <strong>Possible duplicate{dupCheck.length>1?"s":""} already in inventory:</strong>
              <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:6}}>
                {dupCheck.slice(0,5).map(i=>(
                  <span key={i.id} style={{background:"rgba(245,166,35,0.12)",border:"1px solid color-mix(in srgb, var(--amber) 30%, transparent)",borderRadius:5,padding:"1px 7px",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>
                    {i.name} <span style={{color:"var(--sub)"}}>({i.displayId||"no ID"}, qty {i.qty})</span>
                  </span>
                ))}
                {dupCheck.length>5&&<span style={{color:"var(--sub)",fontSize:11}}>+{dupCheck.length-5} more</span>}
              </div>
            </div>
          )}
        </div>
        <Fld label="Category"><Sel value={f.cat} onChange={onCatChange}>{categories.map(c=><option key={c}>{c}</option>)}</Sel></Fld>
        {/* No label for a consumable: nothing gets a sticker, so an ID here would
            be a number nobody prints and nobody maintains. */}
        {f.consumable ? null : advanced ? (
          <Fld label="Label ID" hint="Print on physical sticker"><Inp value={displayId} onChange={e=>setDisplayId(e.target.value)}/></Fld>
        ) : (
          <div style={{marginBottom:14}}>
            <div style={{color:"var(--sub)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:5,fontFamily:"'IBM Plex Mono',monospace"}}>Label ID <span style={{fontWeight:400,textTransform:"none",letterSpacing:0,color:"var(--dim)"}}>(preview — confirmed after saving)</span></div>
            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:15,fontWeight:700,color:"var(--cyan)",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",letterSpacing:"0.05em"}}>{displayId}</div>
          </div>
        )}
        <Fld label="Quantity">
          {f.untracked
            ? <Inp value="Not tracked" disabled style={{color:"var(--dim)",cursor:"not-allowed"}}/>
            : <Inp type="number" min="0" placeholder="0" value={f.qty} onChange={s("qty")}/>}
        </Fld>
        <Fld label="Unit"><Sel value={f.unit} onChange={s("unit")}>{["units","pcs","boxes","bottles","sets","rolls","kg","L","m"].map(u=><option key={u}>{u}</option>)}</Sel></Fld>
        <div style={{gridColumn:"1/-1"}}>
          <Fld label="Location"><Inp placeholder="Room 3A / Workbench 2 / Shelf C1" value={f.loc} onChange={e=>{s("loc")(e);setWarnNoLoc(false);}} style={warnNoLoc&&!f.loc.trim()?{borderColor:"var(--amber)"}:{}}/></Fld>
          {warnNoLoc&&!f.loc.trim()&&<div style={{marginTop:-10,marginBottom:8,fontSize:11,color:"var(--amber)"}}>⚠ No location set — this item will be hard to find later. Press Add Item again to skip.</div>}
        </div>
        <div style={{gridColumn:"1/-1",display:"flex",gap:20,flexWrap:"wrap",padding:"4px 0"}}>{isConsumableCat(f.cat)?(<>{CHKBOX("Consumable — deduct qty, no checkout needed","consumable")}<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={!!f.untracked} onChange={e=>{const on=e.target.checked;setF(p=>({...p,untracked:on,consumable:on?true:p.consumable,qty:on?"":p.qty}));}} style={{accentColor:"var(--cyan)",width:14,height:14}}/>Quantity not tracked — just notify when it runs low</label></>):CHKBOX("Shared — multiple users simultaneously","shared")}</div>
        <div style={{gridColumn:"1/-1",marginBottom:4}}>
          <button onClick={()=>setAdvanced(v=>!v)} style={{background:"none",border:"none",color:"var(--dim)",fontSize:12,cursor:"pointer",padding:"2px 0",display:"flex",alignItems:"center",gap:4}}>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transform:advanced?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}><polyline points="6 9 12 15 18 9"/></svg>
            {advanced?"Hide advanced fields":"Advanced (serial, min stock, tags, image, split units)"}
          </button>
        </div>
        {advanced&&(
          <Fld label="Min Stock Alert"><Inp type="number" min="0" placeholder="0" value={f.minQty} onChange={s("minQty")}/></Fld>
        )}
        {advanced&&!splitUnits&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Serial/Product No."><Inp placeholder="e.g. SN-2024-001 or product number" value={f.serial} onChange={s("serial")}/></Fld></div>
        )}
        {advanced&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Tags / Specs" hint="Press Enter or , to add — e.g. M3×8, stainless, pack of 50"><TagInput tags={f.desc?f.desc.split(",").map(t=>t.trim()).filter(Boolean):[]} onChange={ts=>setF(p=>({...p,desc:ts.join(", ")}))} placeholder="Type a tag and press Enter…"/></Fld></div>
        )}
        {/* Out of Advanced on purpose: for anything trackable this is the default
            path now, so hiding it behind a disclosure meant the common case took
            an extra click and the per-unit fields were easy to miss entirely. */}
        {canSplit&&(
          <div style={{gridColumn:"1/-1",background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 14px"}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--cyan)"}}>
              <input type="checkbox" checked={splitUnits} onChange={e=>setSplitOff(!e.target.checked)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>
              <strong>Track each unit individually</strong><span style={{color:"var(--sub)",fontWeight:400}}> — {n} separate labels, statuses and checkout histories</span>
            </label>
            {splitUnits&&(
              <div style={{marginTop:10}}>
                <div style={{fontSize:11,color:"var(--sub)",fontFamily:"'IBM Plex Mono',monospace",marginBottom:8,lineHeight:1.6}}>
                  Creates {n} items:{" "}
                  {Array.from({length:Math.min(n,3)},(_,i)=>subIdOf(displayId,i+1)).join(", ")}
                  {n>3?` … ${subIdOf(displayId,n)}`:""}<br/>
                  Leave a field blank to use the value from the form above.
                </div>
                <SplitUnitFields n={n} baseId={displayId} units={units} setUnits={setUnits} baseLoc={f.loc} lockFirst/>
              </div>
            )}
          </div>
        )}
        {advanced&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Image"><ImageUpload value={f.img} onChange={v=>setF(p=>({...p,img:v}))}/></Fld></div>
        )}
      </div>
      <div style={{borderTop:"1px solid var(--border)",marginTop:4,paddingTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit} disabled={!f.name||(!f.untracked&&!f.qty)||submitting}><Ico n="plus" s={14} col="var(--on-accent)"/>{submitting?"Adding…":(splitUnits?`Create ${n} Items`:"Add Item")}</Btn>
      </div>
    </Modal>
  );
};

// ─── EDIT ITEM MODAL ─────────────────────────────────────────────────────────
const EditItemModal = ({item,onClose,onSave,onDelete,onAdd,categories,isAdmin}) => {
  const [f,setF]=useState({name:item.name,cat:item.cat,qty:String(item.qty),unit:item.unit,loc:item.loc||"",desc:item.desc||"",minQty:String(item.minQty??0),img:item.img||"",status:item.status,serial:item.serial||"",shared:item.shared||false,consumable:item.consumable||false,displayId:item.displayId||"",untracked:isUntracked(item)});
  const [changed,setChanged]=useState(false);
  const s=k=>e=>{setF(p=>({...p,[k]:e.target.value}));setChanged(true);};
  const chk=k=>e=>{setF(p=>({...p,[k]:e.target.checked}));setChanged(true);};
  // The label follows the category's prefix — but only an admin may move a label,
  // so for anyone else the category changes and the sticker stays as it is. It used
  // to be recomputed for everybody, and the server then dropped it: the screen said
  // SV-004 while the sheet said RM-001, with a success toast over the top.
  const onCatChange=e=>{setChanged(true);const nc=e.target.value;setF(p=>{
    if(!isAdmin) return {...p,cat:nc};
    const np=catPrefix(nc);const d=parseDisplayId(p.displayId);
    return{...p,cat:nc,displayId:d?(d.sub!==null?subIdOf(mainId(np,d.num),d.sub):mainId(np,d.num)):p.displayId};});};
  const [confirmDel,setConfirmDel]=useState(false);
  // Same opt-out shape as Add: raising the quantity of something trackable means
  // that many tracked units, here as much as there.
  const [splitOff,setSplitOff]=useState(false);
  const [units,setUnits]=useState([]);
  const CHKBOX=(label,key)=><label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f[key]} onChange={chk(key)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>{label}</label>;
  const n=+f.qty||0;
  // Splitting relabels the base row (TH-001 becomes TH-001-01) as well as creating
  // the siblings, and only an admin may move a label — so a member's split used to
  // half-apply, leaving an unsplit base row that no longer grouped with its units.
  const canSplit=isAdmin&&n>1&&!isConsumableCat(f.cat)&&!isSubItem(f.displayId);
  const splitUnits=canSplit&&!splitOff;
  const baseId=getBaseId(f.displayId);
  useEffect(()=>{
    if(splitUnits&&n>0) setUnits(u=>Array.from({length:n},(_,i)=>u[i]||{serial:"",loc:""}));
  },[n,splitUnits]);

  const handleSplit=()=>{
    const base={...item,...f,minQty:isNaN(+f.minQty)?0:+f.minQty,
      shared:isConsumableCat(f.cat)?false:!!f.shared, consumable:isConsumableCat(f.cat)?!!f.consumable:false};
    onSave({...base,qty:1,displayId:subIdOf(baseId,1),serial:String(units[0]?.serial||f.serial||"").trim()});
    for(let u=2;u<=n;u++) onAdd({...base,id:uid(),qty:1,status:"Available",usedBy:[],
      serial:String(units[u-1]?.serial||"").trim(),
      loc:String(units[u-1]?.loc||"").trim()||base.loc,
      displayId:subIdOf(baseId,u)});
    onClose();
  };
  return(
    <Modal onClose={onClose} title="Edit Item" mw={560} dirty={changed}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}><Fld label="Item Name"><Inp value={f.name} onChange={s("name")}/></Fld></div>
        <Fld label="Category"><Sel value={f.cat} onChange={onCatChange}>{categories.map(c=><option key={c}>{c}</option>)}</Sel></Fld>
        {isAdmin
          ? <Fld label="Status (Admin only)" hint={item.status==="In Use"?"Someone has it — Return is what frees it":"In Use is set by checking out, not here"}>
              <Sel value={f.status} onChange={s("status")}>
                {/* In Use is derived from the bookings that are live right now, and
                    syncItemStatuses() would put it back the next morning — so it is
                    not offered as a choice. Maintenance and Broken are the real
                    overrides, and an item can go into either while somebody has it. */}
                {(item.status==="In Use"?["In Use","Maintenance","Broken"]:["Available","Maintenance","Broken"]).map(st=><option key={st}>{st}</option>)}
              </Sel></Fld>
          : <Fld label="Status" hint="Set by checking out and returning; an admin can override it"><Inp value={f.status} disabled style={{opacity:.55,cursor:"not-allowed"}}/></Fld>}
        <Fld label="Quantity" hint={isSubItem(f.displayId)?"one tracked unit":undefined}>
          {isSubItem(f.displayId)
            ? <Inp value="1" disabled style={{color:"var(--dim)",cursor:"not-allowed"}}/>
            : f.untracked
              ? <Inp value="Not tracked" disabled style={{color:"var(--dim)",cursor:"not-allowed"}}/>
              : <Inp type="number" min="0" value={f.qty} onChange={s("qty")}/>}
        </Fld>
        <Fld label="Unit"><Sel value={f.unit} onChange={s("unit")}>{["units","pcs","boxes","bottles","sets","racks","rolls","kg","L","m"].map(u=><option key={u}>{u}</option>)}</Sel></Fld>
        <Fld label="Min Stock Alert"><Inp type="number" min="0" value={f.minQty} onChange={s("minQty")}/></Fld>
        <Fld label="Location"><Inp value={f.loc} onChange={s("loc")}/></Fld>
        {!f.consumable&&(isAdmin
          ? <Fld label="Label ID (Admin only)" hint="ID on physical sticker"><Inp value={f.displayId} onChange={s("displayId")}/></Fld>
          : <Fld label="Label ID" hint="Printed on the sticker — ask an admin to change it"><Inp value={f.displayId} disabled style={{opacity:.55,cursor:"not-allowed"}}/></Fld>)}
        <div style={{gridColumn:"1/-1"}}><Fld label="Serial/Product No."><Inp placeholder="e.g. SN-2024-001 or product number" value={f.serial} onChange={s("serial")}/></Fld></div>
        <div style={{gridColumn:"1/-1"}}><Fld label="Tags / Specs" hint="Press Enter or , to add — e.g. M3×8, stainless, pack of 50"><TagInput tags={f.desc?f.desc.split(",").map(t=>t.trim()).filter(Boolean):[]} onChange={ts=>{setF(p=>({...p,desc:ts.join(", ")}));setChanged(true);}}/></Fld></div>
        {/* Shared and Consumable change how every booking rule treats the item, so
            they are an admin's to set. A member sees what it is, not a control. */}
        <div style={{gridColumn:"1/-1",display:"flex",gap:20,flexWrap:"wrap",padding:"4px 0"}}>{isAdmin
          ? (isConsumableCat(f.cat)?(<>{CHKBOX("Consumable — deduct qty, no checkout needed","consumable")}<label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={!!f.untracked} onChange={e=>{const on=e.target.checked;setF(p=>({...p,untracked:on,consumable:on?true:p.consumable,qty:on?"":p.qty}));}} style={{accentColor:"var(--cyan)",width:14,height:14}}/>Quantity not tracked — just notify when it runs low</label></>):CHKBOX("Shared — multiple users simultaneously","shared"))
          : <span style={{fontSize:12,color:"var(--dim)"}}>{isConsumableCat(f.cat)?(f.consumable?"Consumable — an admin sets this":"Not a consumable — an admin sets this"):(f.shared?"Shared — an admin sets this":"Sole use — an admin sets this")}</span>}</div>
        {canSplit&&(
          <div style={{gridColumn:"1/-1",background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 14px"}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--cyan)"}}>
              <input type="checkbox" checked={splitUnits} onChange={e=>setSplitOff(!e.target.checked)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>
              <strong>Track each unit individually</strong><span style={{color:"var(--sub)",fontWeight:400}}> — {n} separate labels, statuses and checkout histories</span>
            </label>
            {splitUnits&&(
              <div style={{marginTop:10}}>
                <div style={{fontSize:11,color:"var(--sub)",fontFamily:"'IBM Plex Mono',monospace",marginBottom:8,lineHeight:1.6}}>
                  This item becomes {subIdOf(baseId,1)}; {n-1} more {n-1===1?"is":"are"} created, through {subIdOf(baseId,n)}.<br/>
                  Leave a field blank to use the value from the form above.
                </div>
                <SplitUnitFields n={n} baseId={baseId} units={units} setUnits={setUnits} baseLoc={f.loc} lockFirst/>
              </div>
            )}
          </div>
        )}
        <div style={{gridColumn:"1/-1"}}><Fld label="Image"><ImageUpload value={f.img} onChange={v=>setF(p=>({...p,img:v}))}/></Fld></div>
      </div>
      <div style={{borderTop:"1px solid var(--border)",marginTop:4,paddingTop:16,display:"flex",gap:10,justifyContent:"space-between"}}>
        <div>
          {isAdmin && (!confirmDel ? (
            <Btn v="danger" onClick={()=>setConfirmDel(true)}><Ico n="trash" s={14} col="var(--red)"/>Delete Item</Btn>
          ) : (
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <span style={{color:"var(--red)",fontSize:12}}>Are you sure?</span>
              <Btn v="danger" sm onClick={()=>{onDelete(item.id);onClose();}}>Yes, delete</Btn>
              <Btn v="ghost" sm onClick={()=>setConfirmDel(false)}>Cancel</Btn>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          {/* Send only the fields this form owns — never {...item}. `item` is the
              snapshot from when the modal opened, so spreading it reverted anything
              that changed in the meantime. Returning an item set it back to
              Available; saving an edit then flipped it to "In Use" again while
              leaving usedBy empty, which is the inconsistent state that showed up.
              status ships only when the dropdown was actually touched, so an
              untouched form can no longer re-assert a stale lifecycle value.
              handleUpdateItem and the backend both merge by key, so omitted
              fields keep whatever the current value is. */}
          <Btn onClick={()=>{if(!f.name)return; if(splitUnits){handleSplit();return;} if(f.qty||f.untracked){
            const patch={id:item.id,name:f.name,cat:f.cat,unit:f.unit,loc:f.loc,desc:f.desc,img:f.img,serial:f.serial,
                         qty:f.untracked?"":+f.qty,minQty:isNaN(+f.minQty)?0:+f.minQty};
            // Only an admin may move these, so only an admin sends them. Sending
            // them anyway had the server drop them while this screen kept showing
            // the values it had just invented.
            if(isAdmin){
              patch.displayId=f.consumable?"":f.displayId;
              patch.shared=isConsumableCat(f.cat)?false:!!f.shared;
              patch.consumable=isConsumableCat(f.cat)?!!f.consumable:false;
              if(f.status!==item.status) patch.status=f.status;
            }
            onSave(patch);onClose();
          }}} disabled={!f.name||(!f.untracked&&!f.qty)}><Ico n={splitUnits?"layers":"check"} s={14} col="var(--on-accent)"/>{splitUnits?`Split into ${n} units`:"Save Changes"}</Btn>
        </div>
      </div>
    </Modal>
  );
};

          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f.consumable} onChange={chk("consumable")} style={{accentColor:"var(--cyan)"}}/>Consumable</label>
        </div>

      <div style={{borderTop:"1px solid var(--border)",marginTop:16,paddingTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>

        <Btn onClick={()=>{if(f.name){onConfirm({...f,displayId});onClose();}}} disabled={!f.name}><Ico n="plus" s={14} col="var(--on-accent)"/>Add to Inventory</Btn>

// ─── ORDER REQUEST MODAL (multi-item) ────────────────────────────────────────
const OrderModal = ({onClose,onAddMany,userName="",userEmail="",categories}) => {
  const UNITS = ["units","pcs","boxes","bottles","sets","rolls","kg","L","m"];
  const [store,setStore]       = useState("");
  const [urgency,setUrgency]   = useState("Normal");
  const [dateNeeded,setDate]   = useState(getToday());
  const [reason,setReason]     = useState("");
  const [items,setItems]       = useState([{name:"",qty:"",unit:"units",cat:categories[0]||"Other",price:"",link:""}]);

  const addItem = () => setItems(p=>[...p,{name:"",qty:"",unit:"units",cat:categories[0]||"Other",price:"",link:""}]);
  const removeItem = i => setItems(p=>p.filter((_,j)=>j!==i));
  const upd = (i,field,val) => setItems(p=>p.map((it,j)=>j===i?{...it,[field]:val}:it));

  // safeUrl, not just non-empty: the row already shows "must start with https://"
  // in red, but the item still counted as valid and Submit stayed enabled — and
  // the order list renders the link through safeUrl too, so a rejected one simply
  // disappeared and the order arrived with no link at all.
  const validItems = items.filter(it=>it.name.trim()&&it.qty&&safeUrl(it.link));
  const canSubmit  = store.trim() && validItems.length>0;

  const submit = () => {
    if(!canSubmit) return;
    onAddMany(validItems.map((it,i)=>({
      id: uid(), item:it.name.trim(), qty:+it.qty, unit:it.unit, cat:it.cat, price:it.price,
      store:store.trim(), link:it.link.trim(), urgency, date:dateNeeded, reason:reason.trim(),
      requestedBy:userName, requestedByEmail:userEmail, status:"Pending"
    })));
    onClose();
  };

  const urgColors={Urgent:"var(--red)",High:"var(--amber)",Normal:"var(--blue)",Low:"var(--sub)"};

  return(
    <Modal onClose={onClose} title="🛒 Request Order" mw={680} dirty={store.trim()!==""||items.some(it=>it.name.trim()!=="")}>
      {/* ── Store + Link (required) ── */}
      <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
        <div style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",marginBottom:10}}>Store Info</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Fld label="Store / Supplier *" hint="e.g. Amazon, McMaster, DigiKey">
            <Inp placeholder="Amazon, McMaster, DigiKey…" value={store} onChange={e=>setStore(e.target.value)}
              style={{borderColor:store.trim()?"var(--border)":"var(--amber)"}}/>
          </Fld>
          <Fld label="Urgency">
            <Sel value={urgency} onChange={e=>setUrgency(e.target.value)}>
              {["Low","Normal","High","Urgent"].map(u=><option key={u}>{u}</option>)}
            </Sel>
          </Fld>
          <Fld label="Date Needed By"><Inp type="date" value={dateNeeded} onChange={e=>setDate(e.target.value)}/></Fld>
          <div style={{gridColumn:"1/-1"}}>
            <Fld label="Reason / Notes"><Inp placeholder="Why do we need this? Which project/experiment?" value={reason} onChange={e=>setReason(e.target.value)}/></Fld>
          </div>
        </div>
      </div>

      {/* ── Item List ── */}
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>
            Items * <span style={{color:"var(--dim)",fontWeight:400,textTransform:"none",letterSpacing:0}}>({validItems.length} valid)</span>
          </span>
          <Btn sm v="ghost" onClick={addItem}><Ico n="plus" s={12}/>Add Item</Btn>
        </div>
        <div style={{color:"var(--dim)",fontSize:11,marginBottom:8}}>Enter <strong style={{color:"var(--sub)"}}>purchase qty &amp; unit</strong> — e.g. 2 boxes, not 200 stickers. You'll set inventory units when the order arrives.</div>
        {items.map((it,i)=>(
          <div key={i} style={{background:"var(--bg2)",border:`1px solid ${it.name.trim()&&it.qty?"var(--border)":"var(--border)"}`,borderRadius:10,padding:"10px 12px",marginBottom:8,animation:"fadeIn .2s ease"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
              <div style={{flex:3,minWidth:0}}>
                <Inp placeholder={`Item name / part # ${i===0?"(required)":"(optional)"}`} value={it.name} onChange={e=>upd(i,"name",e.target.value)}/>
              </div>
              <div style={{width:72}}>
                <Inp type="number" placeholder="Qty" value={it.qty} onChange={e=>upd(i,"qty",e.target.value)} style={{textAlign:"center"}}/>
              </div>
              <div style={{width:88}}>
                <Sel value={it.unit} onChange={e=>upd(i,"unit",e.target.value)} style={{padding:"9px 6px",fontSize:12}}>
                  {UNITS.map(u=><option key={u}>{u}</option>)}
                </Sel>
              </div>
              {items.length>1&&(
                <button onClick={()=>removeItem(i)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:4,display:"flex",flexShrink:0}}><Ico n="x" s={14}/></button>
              )}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:8}}>
              <Sel value={it.cat} onChange={e=>upd(i,"cat",e.target.value)} style={{padding:"7px 8px",fontSize:12}}>
                {categories.map(c=><option key={c}>{c}</option>)}
              </Sel>
              <Inp placeholder="Unit price (e.g. 12.99)" value={it.price} onChange={e=>upd(i,"price",e.target.value)} title="Enter the price per unit, not total"/>
              <div style={{display:"flex",flexDirection:"column",gap:3,flex:1}}>
                <Inp placeholder="Purchase link (required) https://…" value={it.link} onChange={e=>upd(i,"link",e.target.value)}
                  style={{borderColor:it.link.trim()&&!safeUrl(it.link)?"var(--red)":it.link.trim()?"var(--border)":"var(--amber)"}}/>
                {it.link.trim()&&!safeUrl(it.link)?(
                  <span style={{fontSize:10,color:"var(--red)",lineHeight:1.4}}>⚠ Link must start with https:// or http://</span>
                ):it.link.includes("amazon.com")&&it.link.length>60?(
                  <span style={{fontSize:10,color:"var(--amber)",lineHeight:1.4}}>💡 Amazon tip: use <strong>Share → Copy link</strong> on the product page for a short URL like <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>a.co/d/…</span> instead of the full address bar URL.</span>
                ):it.link.length>60?(
                  <span style={{fontSize:10,color:"var(--amber)",lineHeight:1.4}}>💡 Long URL — please shorten it with <a href="https://bitly.com" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>Bitly</a>, <a href="https://cutt.ly" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>Cuttly</a>, or <a href="https://tinyurl.com" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>TinyURL</a>.</span>
                ):null}
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:10,justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{background:urgColors[urgency]+"22",color:urgColors[urgency],border:`1px solid ${urgColors[urgency]}44`,borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>{urgency}</span>
          <span style={{color:"var(--dim)",fontSize:12}}>{validItems.length} item{validItems.length!==1?"s":""} · {store||"no store yet"}</span>
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={submit} disabled={!canSubmit}><Ico n="cart" s={14} col="var(--on-accent)"/>Submit {validItems.length>1?`${validItems.length} Requests`:"Request"}</Btn>
        </div>
      </div>
    </Modal>
  );
};

        <span style={{color:"var(--purple)",fontSize:11,fontWeight:700}}>TRACKED UNITS · {group.qty} total</span>
        <span style={{color:"var(--sub)",fontSize:11}}>{group.cat}</span>
        {/* Units can sit in different places, so list what is actually there.
            The group's own `loc` is just the first unit's and hid the rest. */}
        {(()=>{const locs=[...new Set((group._items||[]).map(u=>String(u.loc||"").trim()).filter(Boolean))];
          return locs.length?<span style={{color:"var(--dim)",fontSize:11}}>📍 {locs.join(" · ")}</span>:null;})()}
      </div>
      {group.desc&&<div style={{margin:"0 0 12px"}}><DescChips desc={group.desc}/></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"55vh",overflowY:"auto"}}>
        {group._items.map((unit,i)=>{
          const inUse=toArr(unit.usedBy).length>0;
          // Match on itemId. Matching on name picked whichever sibling came first,

              </div>
              <div style={{flex:1}}>
                <Badge status={inUse?"In Use":"Available"}/>
                {inUse&&<span style={{marginLeft:8,fontSize:12,color:"var(--sub)"}}>→ {toArr(unit.usedBy).join(", ")}</span>}
                {activeCheckout&&activeCheckout.ret&&<div style={{fontSize:11,color:"var(--dim)",marginTop:3}}>Due: {activeCheckout.ret}</div>}
              </div>

                {inUse&&activeCheckout&&(
                  <Btn v="ghost" sm onClick={()=>{onReturn(activeCheckout.id);onClose();}}>Return</Btn>

                  <Btn sm onClick={()=>{onClose();onQuickCheckout(unit.id);}}>Check Out</Btn>

                <Btn v="ghost" sm onClick={()=>{if(editLocked){return;}onClose();onEdit(unit);}} disabled={editLocked} style={editLocked?{opacity:0.4,cursor:"not-allowed"}:{}}>
                  <Ico n={editLocked?"lock":"edit"} s={13}/>{editLocked?"":"Edit"}
                </Btn>
              </div>

          );

      </div>

        <div style={{marginTop:12,background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 12px"}}>

// reads as a card and the tint follows the surface token in dark mode.

            so the glow never rendered — and a glow is wrong on a light surface. */}

// ─── PAGINATION ──────────────────────────────────────────────────────────────

// ─── CALENDAR ────────────────────────────────────────────────────────────────
// Delivery is Spirit Blue rather than green: beside the red of "overdue", green
// measured ΔE 5.1 under deuteranopia — below the floor. See the palette note in
// <style>. These four were validated as a set, so don't re-point one in isolation.
// A booking is one thing that lasts a while, so it gets one colour for its whole
// length rather than a different one at each end. Blue is in use, amber is
// waiting on an admin, red is overdue, grey is finished and kept only as history.
const CAL_EC={pkg:{bg:"var(--spirit-d)",col:"var(--spirit)"},act:{bg:"var(--blue-d)",col:"var(--blue)"},
              pend:{bg:"var(--amber-d)",col:"var(--amber)"},odd:{bg:"var(--red-d)",col:"var(--red)"},
              done:{bg:"var(--bg3)",col:"var(--sub)"}};
const CAL_LBL={pkg:"Delivery",act:"In Use",pend:"Awaiting approval",odd:"OVERDUE",done:"Returned"};
const calKind=c=>isOverdue(c)?"odd":c.status===CO_PENDING?"pend":c.status==="Active"?"act":"done";
// Every date a booking covers, so a hold draws as a bar instead of two
// disconnected marks at its ends. Guarded — a corrupt ret must not spin forever.
const dsOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayList=(a,b)=>{
  if(!a)return[];
  const[ay,am,ad]=a.split("-").map(Number); const d=new Date(ay,am-1,ad);
  const e=b?(()=>{const[by,bm,bd]=b.split("-").map(Number);return new Date(by,bm-1,bd);})():new Date(ay,am-1,ad);
  const out=[]; let guard=0;
  while(d<=e&&guard++<400){out.push(dsOf(d));d.setDate(d.getDate()+1);}
  // Truncated. The caller marks the final entry `last` and prints the return time
  // beside it, which would be a lie about a day more than a year short of the end.
  if(d<=e) out.truncated=true;
  return out;
};
// What to print on one day of a booking. A daily window says the same thing every
// day; an all-day hold only has something to say at its ends.
const spanTime=(c,first,last)=>
  hasWindow(c) ? `${c.fromTime}\u2013${c.toTime}`
  : first&&last ? [getTimePart(c.out),getTimePart(c.ret)].filter(Boolean).join("\u2013")
  : first ? (getTimePart(c.out)?"from "+getTimePart(c.out):"")
  : last  ? (getTimePart(c.ret)?"until "+getTimePart(c.ret):"")
  : "";
// Mini chip for month grid cells and all-day strip — fixed width, clips text
const CalChip=({e,full=false})=>{
  const ec=CAL_EC[e.t];
  if(full) return(
    <div style={{background:ec.bg,color:ec.col,borderLeft:`3px solid ${ec.col}`,borderRadius:6,padding:"7px 10px",marginBottom:5}}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:2}}>
        <span style={{fontSize:10,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",flexShrink:0}}>{CAL_LBL[e.t]}</span>
        {e.time&&<span style={{fontSize:11,fontFamily:"'IBM Plex Mono',monospace",opacity:.75,flexShrink:0}}>{e.time}</span>}
      </div>
      <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.l}</div>
      {e.user&&<div style={{fontSize:11,opacity:.7,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.user}</div>}
    </div>
  );
  return(

const LoginPage = ({onSignIn, notice=""}) => {
  // `notice` is why the app signed you out — LabInventory cannot reach this
  // component's own error state, and used to try.
  const [error, setError] = useState(notice);
  const [msalReady, setMsalReady] = useState(false);
  const [busy, setBusy] = useState(false);

  useEffect(()=>{
    let alive = true;
    Promise.resolve(window.msalReady || Promise.reject(new Error("MSAL script did not load")))
      .then(()=>{ if (alive) setMsalReady(true); })
      .catch(()=>{ if (alive) setError("Could not load Microsoft sign-in. Check your connection and refresh."); });
    return ()=>{ alive = false; };
  }, []);

  const signIn = async () => {
    setError(""); setBusy(true);

// ─── PHYSICAL LABEL ID ───────────────────────────────────────────────────────
function catPrefix(cat) {
  // Use stored custom prefix if available
  try { const m=JSON.parse(localStorage.getItem("labtrack_catprefixes")||"{}"); if(m[cat]) return m[cat]; } catch {}
  // Auto: initials of each word, e.g. "Robots & Motors"→"RM", "Other"→"OTHE"
  const words=(cat||"GEN").split(/[\s&\/\-_]+/).filter(Boolean);
  return (words.length===1 ? words[0].slice(0,4) : words.map(w=>w[0]).join("")).toUpperCase()||"GEN";
}
// ─── LABEL IDS ────────────────────────────────────────────────────────────────
// PREFIX-NNN, and a split unit appends -NN:  RM-001,  RM-001-01
// Keep these two widths in sync with google-apps-script.js, which is what actually
// assigns the numbers — the client only previews them.
const LABEL_DIGITS = 3;      // main number
const LABEL_SUB_DIGITS = 2;  // split-unit suffix

// The prefix is lazy so a prefix containing a hyphen still parses, and the sub
// group is optional — which is why this can't be a single width-based regex any
// more: at three digits, /^.+-\d{3}$/ matches "RM-001" and would read every plain
// item as a split unit.
function parseDisplayId(displayId) {
  const m = String(displayId||"").match(/^(.*?)-(\d+)(?:-(\d+))?$/);
  if (!m) return null;
  return { prefix:m[1], num:parseInt(m[2],10), sub:m[3]===undefined?null:parseInt(m[3],10) };
}
function mainId(prefix, num) { return `${prefix}-${String(num).padStart(LABEL_DIGITS,"0")}`; }
function subIdOf(baseId, n)  { return `${baseId}-${String(n).padStart(LABEL_SUB_DIGITS,"0")}`; }

function genDisplayId(cat, allItems) {
  const prefix = catPrefix(cat);
  // Counted per prefix: the first Sensors & Vision item is SV-001 even when
  // Robots & Motors is already at RM-004. A single shared counter made the number
  // meaningless — it only said how many items existed in total.
  const maxNum = Math.max(0,...(allItems||[])
    .map(i=>parseDisplayId(i.displayId))
    .filter(p=>p&&p.prefix===prefix)
    .map(p=>p.num));
  return mainId(prefix, maxNum+1);
}
function isSubItem(displayId) {
  const p = parseDisplayId(displayId);
  return !!p && p.sub !== null;
}
function getBaseId(displayId) {
  const p = parseDisplayId(displayId);
  return p && p.sub !== null ? mainId(p.prefix, p.num) : String(displayId||"");
}

// ─── PURCHASE TEXT GENERATOR ──────────────────────────────────────────────────
function generateEmailText(orders) {
  const fmtP = p => {
    if(!p && p!==0) return null;
    const n = typeof p==="number" ? p : parseFloat(String(p).replace(/[^0-9.]/g,""));
    return isNaN(n) ? null : "$"+n.toFixed(2);
  };
  const calcTotal = (price,qty) => {
    const p = typeof price==="number" ? price : parseFloat(String(price||"").replace(/[^0-9.]/g,""));
    const q = parseFloat(qty)||0;
    return (!isNaN(p)&&q) ? p*q : null;
  };
  const lines = orders.map(o=>{
    const qty = o.qty||"";
    const price = fmtP(o.price);
    const meta = [`Quantity: ${qty}`, ...(price?[`Price/Item: ${price}`]:[])].join(", ");
    return `- ${qty} ${o.item}  ${o.link||""}  (${meta})`;
  });
  const grand = orders.reduce((a,o)=>{const t=calcTotal(o.price,o.qty);return t!==null?a+t:a;},0);
  return lines.join("\n") + (grand>0 ? `\n\nGrand Total: $${grand.toFixed(2)}` : "");
}


// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error("LabTrack render error:",e,info);}
  render(){
    if(this.state.err){
      return React.createElement("div",{style:{textAlign:"center",padding:"60px 20px"}},
        React.createElement("div",{style:{color:"var(--red)",fontSize:16,fontWeight:700,marginBottom:8}},"Something went wrong rendering the item list"),
        React.createElement("div",{style:{color:"var(--dim)",fontSize:12,marginBottom:16,fontFamily:"'IBM Plex Mono',monospace"}},String(this.state.err?.message||"")),
        React.createElement("button",{onClick:()=>this.setState({err:null}),style:{background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"7px 18px",cursor:"pointer",fontSize:13}},"Retry")
      );
    }
    return this.props.children;
  }
}

                       padding:"12px 14px",fontSize:13.5,lineHeight:1.6,color:"var(--sub)"}}>

            the address has to be issued by the lab's system, to you.
          </div>
        </Fld>
      ) : (
        <Fld label="Your personal address">
          <div style={{display:"flex",gap:8}}>
            <Inp id="ics-url" readOnly value={url} onFocus={e=>e.target.select()}
                 style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:12.5}}/>

      <How app="Google Calendar" steps={<>Left sidebar → <strong>Other calendars</strong> → <strong>+</strong> → <strong>From URL</strong> → paste → Add.</>}/>
      <How app="Outlook" steps={<>Calendar → <strong>Add calendar</strong> → <strong>Subscribe from web</strong> → paste → name it → Import.</>}/>
      <How app="Apple Calendar" steps={<>File → <strong>New Calendar Subscription</strong> → paste → Subscribe.</>}/>

      <p style={{margin:"16px 0 0",fontSize:13,lineHeight:1.55,color:"var(--sub)"}}>
        One catch worth knowing: your calendar app decides how often to check, and Google in
        particular can take several hours. Come back here when you need to know whether something
        is free <em>right now</em>.
      </p>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginTop:20,paddingTop:16,borderTop:"1px solid var(--border)"}}>
        {preview ? <span/> : confirming ? (

            <span style={{fontSize:13,color:"var(--red)"}}>The address above stops working immediately.</span>
            <Btn sm v="danger" onClick={()=>{setConfirming(false);onRotate();}} disabled={busy}>Replace it</Btn>

        )}

};
