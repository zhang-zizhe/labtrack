                              <span style={{background:sc.bg,color:sc.col,border:`1px solid ${sc.col}30`,padding:"2px 9px",borderRadius:20,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{o.status}</span>
                              <span style={{background:uc.bg,color:uc.col,border:`1px solid ${uc.col}30`,padding:"2px 8px",borderRadius:20,fontSize:10,fontWeight:600,fontFamily:"'IBM Plex Mono',monospace"}}>{o.urgency}</span>
                              {o.cat&&<span style={{color:getCatAccent(o.cat,categories),fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{o.cat}</span>}
                            </div>
                            <div style={{color:"var(--sub)",fontSize:12,marginBottom:4}}>
                              <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>{o.qty} {o.unit}</span>
                              {o.price&&<span> · {o.price}</span>}
                              {o.store&&<span> · <strong style={{color:"var(--text)"}}>{o.store}</strong></span>}
                              {o.requestedBy&&<span> · by <strong>{o.requestedBy}</strong></span>}
                              {o.date&&<span> · need by {o.date}</span>}
                            </div>
                            {o.reason&&<div style={{color:"var(--dim)",fontSize:12,fontStyle:"italic",marginBottom:4}}>{o.reason}</div>}
                            {safeUrl(o.link)&&<a href={safeUrl(o.link)} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{color:"var(--cyan)",fontSize:12,display:"inline-flex",alignItems:"center",gap:4}}><Ico n="link" s={11} col="var(--cyan)"/>Purchase link</a>}
                          </div>
                          <div style={{display:"flex",gap:6,flexShrink:0,flexWrap:"wrap"}} onClick={e=>e.stopPropagation()}>
                            {(effectiveRole==="admin"||(user?.email===o.requestedByEmail&&o.status==="Pending"))&&<Btn sm v="ghost" onClick={()=>{if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}setEditOrder(o);}} style={editLocked?{opacity:0.45,cursor:"not-allowed"}:{}}><Ico n={editLocked?"lock":"edit"} s={12}/>{editLocked?"":"Edit"}</Btn>}
                            {effectiveRole==="admin"&&ns&&(
                              <Btn sm v={ns==="Received"?"success":"ghost"} onClick={()=>{
                                if(ns==="Received"){ handleOrderReceived(o); }
                                else { handleUpdateOrderStatus(o.id,ns); }
                              }}>
                                {ns==="Received"?<><Ico n="check" s={12} col="var(--green)"/>{nsLabel}</>:<>{nsLabel}</>}
                              </Btn>
                            )}
                            {effectiveRole==="admin"&&o.status==="Pending"&&<Btn sm v="danger" onClick={()=>handleUpdateOrderStatus(o.id,"Rejected")}>Reject</Btn>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              {ordersPageCount>1&&(
                <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:8,marginTop:16}}>
                  <button onClick={()=>setOrdersPage(p=>Math.max(0,p-1))} disabled={ordersPage===0} style={{background:"var(--bg2)",border:"1px solid var(--border)",color:ordersPage===0?"var(--dim)":"var(--text)",borderRadius:8,padding:"5px 12px",cursor:ordersPage===0?"default":"pointer",fontSize:13}}>‹</button>
                  {Array.from({length:ordersPageCount},(_,i)=>(
                    <button key={i} onClick={()=>setOrdersPage(i)} style={{background:ordersPage===i?"var(--cyan-d)":"var(--bg2)",color:ordersPage===i?"var(--cyan)":"var(--sub)",border:`1px solid ${ordersPage===i?"var(--cyan-m)":"var(--border)"}`,borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12,fontWeight:600,minWidth:32}}>{i+1}</button>
                  ))}
                  <button onClick={()=>setOrdersPage(p=>Math.min(ordersPageCount-1,p+1))} disabled={ordersPage===ordersPageCount-1} style={{background:"var(--bg2)",border:"1px solid var(--border)",color:ordersPage===ordersPageCount-1?"var(--dim)":"var(--text)",borderRadius:8,padding:"5px 12px",cursor:ordersPage===ordersPageCount-1?"default":"pointer",fontSize:13}}>›</button>
                </div>
              )}
            </div>

            {/* Completed Orders */}
            {receivedOrders.length>0&&(
              <div style={{marginBottom:28}}>
                <h3 style={{fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:15,marginBottom:12,color:"var(--text)"}}>Completed Orders</h3>

                    return(
                      <div key={o.id} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                        <span style={{fontWeight:600,fontSize:13,color:"var(--text)",flex:1}}>{o.item}</span>
                        <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:"var(--dim)"}}>{o.qty} {o.unit}</span>
                        <span style={{background:sc2.bg,color:sc2.col,border:`1px solid ${sc2.col}30`,padding:"2px 9px",borderRadius:20,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{o.status}</span>
                        <Btn sm v="ghost" onClick={()=>handleDeleteOrder(o.id)}><Ico n="trash" s={12}/></Btn>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Delivery Log */}
            <div>
              <h3 style={{fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:15,marginBottom:12,color:"var(--text)"}}>Delivery Log</h3>

                <div style={{textAlign:"center",padding:"40px 20px",color:"var(--dim)",background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14}}>
                  <Ico n="truck" s={40} col="var(--bg4)"/>
                  <div style={{marginTop:12,fontSize:14,color:"var(--sub)"}}>No deliveries logged yet</div>
                </div>
              ):(
                <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
                  <div style={{overflow:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                      <thead><tr style={{borderBottom:"1px solid var(--border)"}}>{["Item","Qty","Supplier","Received By","Tracking","Date","Status"].map(h=><th key={h} className="sticky-th" style={{padding:"11px 16px",textAlign:"left",color:"var(--dim)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{h}</th>)}</tr></thead>
                      <tbody>{deliveries.map((d,i)=>(
                        <tr key={d.id} className="row-hover" style={{borderBottom:i<deliveries.length-1?"1px solid var(--border)":"none",transition:"background .15s"}}>
                          <td style={{padding:"11px 16px",color:"var(--text)",fontWeight:600}}>{d.item}</td>
                          <td style={{padding:"11px 16px",color:"var(--sub)",fontFamily:"'IBM Plex Mono',monospace"}}>{d.qty} {d.unit}</td>
                          <td style={{padding:"11px 16px",color:"var(--sub)"}}>{d.from||"—"}</td>
                          <td style={{padding:"11px 16px"}}>{d.receivedBy?<div style={{display:"flex",alignItems:"center",gap:7}}><MemberAvatar name={d.receivedBy} sz={24}/><span style={{color:"var(--sub)"}}>{d.receivedBy}</span></div>:<span style={{color:"var(--dim)"}}>—</span>}</td>
                          <td style={{padding:"11px 16px",color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>{d.tracking||"—"}</td>
                          <td style={{padding:"11px 16px",color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>{d.date}</td>
                          <td style={{padding:"11px 16px"}}><Badge status={d.status}/></td>
                        </tr>
                      ))}</tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ════════ USAGE TAB ════════ */}
        {tab==="usage"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <div>
                <h2 style={{margin:"0 0 3px",fontFamily:"'Roboto',sans-serif",fontSize:18,fontWeight:700}}>Item Usage</h2>
                <p style={{margin:0,color:"var(--sub)",fontSize:13}}>{activeOut.length} active · {overdues.length>0&&<span style={{color:"var(--red)",fontWeight:600}}>{overdues.length} overdue · </span>}{pendingCos.length>0&&<span style={{color:"var(--amber)",fontWeight:600}}>{pendingCos.length} awaiting approval · </span>}Slack notifies on checkout & return</p>
              </div>
              <div style={{display:"flex",gap:8}}>
                {selected.size>0&&(
                  <Btn v="success" onClick={()=>setConfirm({msg:`Return ${selected.size} selected item${selected.size>1?"s":""}?`,onConfirm:handleBulkReturn})}>
                    <Ico n="undo" s={14} col="var(--green)"/>Return {selected.size} selected
                  </Btn>
                )}
                <Btn onClick={()=>{setPreItem("");setModal("checkout");}}><Ico n="plus" s={14} col="var(--on-accent)"/>New Checkout</Btn>
              </div>
            </div>

            {activeOut.length===0 && checkouts.length===0 ? (
              <div style={{textAlign:"center",padding:"60px 20px",color:"var(--dim)",background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14}}>
                <Ico n="users" s={48} col="var(--bg4)"/>
                <div style={{marginTop:16,fontSize:16,color:"var(--sub)"}}>No checkouts yet</div>
                <div style={{fontSize:13,marginTop:4}}>Check out items to track who is using what</div>
              </div>
            ) : (
              <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(255px,1fr))",gap:14,marginBottom:28}}>
              {[...new Set(checkouts.filter(c=>c.status==="Active").map(c=>c.user))].map((m,idx)=>{
                const outs=checkouts.filter(c=>c.user===m&&c.status==="Active");
                const od=outs.filter(c=>isOverdue(c)).length;
                return(
                  <div key={m} style={{background:"var(--bg1)",border:`1px solid ${od?"color-mix(in srgb, var(--red) 30%, transparent)":"var(--border)"}`,borderRadius:14,padding:"16px 18px",animation:`fadeUp .3s ease ${idx*.05}s both`}}>
                    <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:12}}>
                      <MemberAvatar name={m} sz={40}/>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:14,fontFamily:"'Roboto',sans-serif"}}>{m}</div>
                        <div style={{color:od?"var(--red)":outs.length?"var(--blue)":"var(--dim)",fontSize:12}}>
                          {od?`${od} overdue!`:outs.length?`${outs.length} item${outs.length>1?"s":""} out`:"Nothing checked out"}
                        </div>
                      </div>
                    </div>
                    {outs.map(c=>{
                      const od2=isOverdue(c);
                      return(
                        <div key={c.id} style={{background:od2?"var(--red-d)":"var(--bg2)",border:`1px solid ${od2?"color-mix(in srgb, var(--red) 30%, transparent)":"var(--border)"}`,borderRadius:8,padding:"8px 11px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
                          <div style={{minWidth:0}}>
                            <div style={{color:"var(--text)",fontSize:13,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.item}</div>
                            <div style={{color:od2?"var(--red)":"var(--dim)",fontSize:10,fontFamily:"'IBM Plex Mono',monospace",marginTop:2}}>{od2?"OVERDUE":"Return"} {c.ret||"—"}{hasWindow(c)&&<span style={{color:"var(--cyan)"}}> · {windowLabel(c)}</span>}</div>
                            {c.notes&&<div style={{color:"var(--sub)",fontSize:11,marginTop:3,fontStyle:"italic"}}>{c.notes}</div>}
                          </div>
                          {canReturn(c)&&<Btn v="ghost" sm onClick={()=>setConfirm({msg:`Return "${c.item}" from ${c.user}?`,onConfirm:()=>handleReturn(c.id)})}><Ico n="undo" s={11}/></Btn>}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>

            {pendingCos.length>0&&(
              <div style={{background:"var(--bg1)",border:`1px solid ${mix("--amber",30)}`,borderRadius:14,overflow:"hidden",marginBottom:28}}>
                <div style={{padding:"13px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:9,flexWrap:"wrap"}}>
                  <Ico n="clock" s={15} col="var(--amber)"/>
                  <span style={{fontWeight:700,fontFamily:"'Roboto',sans-serif",fontSize:15}}>Waiting for approval</span>
                  <span style={{color:"var(--dim)",fontSize:12}}>Longer than {MAX_DAYS_WITHOUT_APPROVAL} days, or queued behind someone who is · nothing is reserved until approved</span>

                {Object.entries(pendingByItem).map(([k,reqs],gi)=>{
                  const contested=reqs.length>1&&reqs.some(a=>reqs.some(b=>a.id!==b.id&&bookingsClash(a,b)));
                  return(
                  <div key={k} style={{borderTop:gi?"1px solid var(--border)":"none"}}>
                    <div style={{padding:"10px 18px 2px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:13}}>{reqs[0].item}</span>
                      {contested&&(
                        <span style={{background:"var(--amber-d)",border:`1px solid ${mix("--amber",35)}`,color:"var(--amber)",borderRadius:20,padding:"1px 9px",fontSize:10,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>
                          {reqs.length} requests · overlapping
                        </span>
                      )}

                      const blocker=blockerFor(c,checkouts);

                            <div style={{color:"var(--red)",fontSize:11,marginTop:4}}>

                            </div>

                        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

                          )}
                          {effectiveRole==="admin"?(
                            <>
                              <Btn sm v="success" disabled={!!blocker} onClick={()=>setConfirm({msg:`Approve "${c.item}" for ${c.user}, ${Math.ceil(bookingDays(c.out,c.ret))} days?`+(contested?` The other ${reqs.length-1} request${reqs.length>2?"s":""} for this slot will no longer be approvable — reject ${reqs.length>2?"them":"it"} afterwards.`:""),onConfirm:()=>handleDecideCheckout(c.id,true)})}><Ico n="check" s={12} col="var(--green)"/>Approve</Btn>
                              <Btn sm v="danger" onClick={()=>setConfirm({msg:`Reject the request for "${c.item}" from ${c.user}?`,onConfirm:()=>handleDecideCheckout(c.id,false)})}><Ico n="x" s={12} col="var(--red)"/>Reject</Btn>

                            <span style={{color:"var(--amber)",fontSize:12,fontWeight:600}}>Waiting on an admin</span>

                        </div>
                      </div>);

                  </div>);
                })}
              </div>
            )}

            <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
              <div style={{padding:"13px 18px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <span style={{fontWeight:700,fontFamily:"'Roboto',sans-serif",fontSize:15}}>All Records</span>
                <span style={{color:"var(--dim)",fontSize:11}}>{selected.size>0?<span style={{color:"var(--cyan)",fontFamily:"'IBM Plex Mono',monospace"}}>{selected.size} selected · </span>:""}Shift+click to select range</span>
              </div>
              <div style={{overflow:"auto",maxHeight:"65vh"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr style={{borderBottom:"1px solid var(--border)"}}>
                    <th className="sticky-th" style={{padding:"10px 16px",width:36}}/>
                    {["Item","Person","Checked Out","Return By","Status",""].map((h,i)=>(
                      <th key={i} className="sticky-th" style={{padding:"10px 16px",textAlign:"left",color:"var(--dim)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{h}</th>
                    ))}
                  </tr></thead>
                  <tbody>{checkouts.slice(0,checkoutLimit).map((c,i)=>{
                    const od=isOverdue(c);const isSel=selected.has(c.id);const canRet=canReturn(c);
                    const activeCheckouts=checkouts.filter(x=>x.status==="Active"&&canReturn(x));
                    const handleCoClick=(e)=>{
                      if(c.status!=="Active"||!canRet)return;
                      if(e.shiftKey&&lastSelCheckout.current!=null){
                        const ids=activeCheckouts.map(x=>x.id);
                        const a=ids.indexOf(lastSelCheckout.current),b=ids.indexOf(c.id);
                        const [lo,hi]=[Math.min(a,b),Math.max(a,b)];
                        const ns=new Set(selected);ids.slice(lo,hi+1).forEach(x=>ns.add(x));setSelected(ns);
                      } else {
                        const ns=new Set(selected);ns.has(c.id)?ns.delete(c.id):ns.add(c.id);setSelected(ns);
                        lastSelCheckout.current=c.id;
                      }
                    };
                    return(
                      <tr key={c.id} onClick={handleCoClick} className="row-hover" style={{borderBottom:i<checkouts.length-1?"1px solid var(--border)":"none",transition:"background .15s",background:od?"var(--red-d)":isSel?"var(--cyan-d)":undefined,cursor:(c.status==="Active"&&canRet)?"pointer":"default",userSelect:"none"}}>
                        <td style={{padding:"10px 16px"}}>{c.status==="Active"&&canRet&&<input type="checkbox" checked={isSel} onChange={handleCoClick} onClick={e=>e.stopPropagation()} style={{cursor:"pointer",accentColor:"var(--cyan)"}}/>}</td>
                        <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{c.item}{Number(c.qty)>1&&<span style={{color:"var(--sub)",fontWeight:400,fontFamily:"'IBM Plex Mono',monospace",fontSize:12,marginLeft:6}}>×{Number(c.qty)}</span>}</td>
                        <td style={{padding:"10px 16px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><MemberAvatar name={c.user} sz={26}/><span style={{color:"var(--sub)"}}>{c.user}</span></div></td>
                        <td style={{padding:"10px 16px",color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>{c.out}{hasWindow(c)&&<div style={{color:"var(--cyan)",marginTop:2}}>{windowLabel(c)}</div>}{c.notes&&<div style={{color:"var(--sub)",marginTop:2,fontStyle:"italic",fontFamily:"'Roboto',sans-serif"}}>{c.notes}</div>}</td>
                        <td style={{padding:"10px 16px",color:od?"var(--red)":"var(--dim)",fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:od?700:400}}>{c.ret||"—"}{od&&" !"}</td>
                        <td style={{padding:"10px 16px"}}><Badge status={od?"Overdue":c.status}/></td>
                        <td style={{padding:"10px 16px"}}>{c.status==="Active"&&canRet&&<Btn v="ghost" sm onClick={e=>{e.stopPropagation();setConfirm({msg:`Return "${c.item}" from ${c.user}?`,onConfirm:()=>handleReturn(c.id)});}}><Ico n="undo" s={12}/>Return</Btn>}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              </div>
              {checkouts.length>checkoutLimit&&(
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"12px 0",gap:12,borderTop:"1px solid var(--border)"}}>
                  <span style={{color:"var(--dim)",fontSize:12}}>Showing {checkoutLimit} of {checkouts.length} records</span>
                  <button onClick={()=>setCheckoutLimit(l=>l+30)} style={{background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"5px 16px",cursor:"pointer",fontSize:13,fontWeight:600}}>Load more</button>
                </div>
              )}
            </div>
              </>
            )}
          </div>
        )}

        {/* ════════ CALENDAR TAB ════════ */}
        {tab==="calendar"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,margin:"0 0 20px",flexWrap:"wrap"}}>
              <h2 style={{margin:0,fontFamily:"'Roboto',sans-serif",fontSize:18,fontWeight:700}}>Activity Calendar</h2>
              <Btn sm v="ghost" onClick={()=>openSubscribe(false)} disabled={icsBusy}>
                <Ico n="calendar" s={12}/>{icsBusy ? "Working…" : "Subscribe"}
              </Btn>
            </div>
            <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,padding:24}}>
              <CalView checkouts={checkouts} deliveries={deliveries}/>
            </div>
          </div>
        )}
      </main>
      )}

      {/* MODALS */}
      {modal==="subscribe" && <SubscribeModal url={icsUrl} busy={icsBusy}
        preview={!APP_CONFIG.apps_script_url || user?.token === "local"}
        onClose={()=>setModal(null)} onRotate={()=>openSubscribe(true)}/>}
      {modal==="delivery" && <DeliveryModal onClose={()=>setModal(null)} onAdd={handleDelivery} userName={user?.name||""}/>}
      {useItem && <UseModal item={useItem} onClose={()=>setUseItem(null)} onUse={handleUseConsumable}/>}
      {notifyItem && <NotifyModal item={notifyItem} onClose={()=>setNotifyItem(null)} onNotify={handleNotifyLowStock}/>}
      {editReq && <EditRequestModal co={editReq} items={items} checkouts={checkouts} onClose={()=>setEditReq(null)} onSave={handleUpdateRequest}/>}
        {modal==="checkout" && <CheckoutModal items={items} onClose={()=>setModal(null)} onAdd={handleCheckout} preItem={preItem} userName={user?.name||""} userEmail={user?.email||""} categories={categories} checkouts={checkouts}/>}
      {modal==="addItem" && <AddItemModal onClose={()=>setModal(null)} onAdd={handleAddItem} categories={categories} allItems={items} onShowLabel={setLabelItem}/>}
      {labelItem&&<LabelModal item={labelItem} onClose={()=>setLabelItem(null)} onAddAnother={()=>{setLabelItem(null);setModal("addItem");}}/>}
      {modal==="order" && <OrderModal onClose={()=>setModal(null)} onAddMany={handleAddOrderMany} userName={user?.name||""} userEmail={user?.email||""} categories={categories}/>}
      {modal==="manageCategories" && <ManageCategoriesModal categories={categories} onSave={handleSaveCategories} onClose={()=>setModal(null)}/>}
      {editItem && <EditItemModal item={editItem} onClose={()=>setEditItem(null)} onSave={handleUpdateItem} onDelete={handleDeleteItem} onAdd={handleAddItem} categories={categories} isAdmin={effectiveRole==="admin"}/>}
      {editOrder && <EditOrderModal order={editOrder} onClose={()=>setEditOrder(null)} onSave={handleUpdateOrder} isAdmin={effectiveRole==="admin"} categories={categories}/>}
      {modal==="emailText"&&<Modal onClose={()=>{setModal(null);setEmailText("");}} title="📧 Purchase Request Email Text" mw={700}>
        <p style={{color:"var(--sub)",fontSize:13,marginBottom:10}}>Select all and copy (Ctrl+A → Ctrl+C), then paste into your email.</p>
        <textarea readOnly value={emailText} onClick={e=>e.target.select()} style={{width:"100%",height:260,background:"var(--bg2)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"12px 14px",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",resize:"vertical",outline:"none",lineHeight:1.8,display:"block"}}/>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
          <Btn onClick={()=>{setModal(null);setEmailText("");}}>Done</Btn>
        </div>
      </Modal>}
      {pendingItem && <PendingItemModal order={pendingItem} allItems={items} categories={categories} onClose={()=>setPendingItem(null)} onConfirm={handleConfirmPendingItem}/>}
      {modal==="help" && <Modal onClose={()=>setModal(null)} title="LabTrack — Help & Guide" mw={640}>
        <div style={{display:"flex",flexDirection:"column",gap:20,fontSize:13}}>
          {[
            {icon:"box",title:"Inventory Tab",color:"var(--cyan)",items:["Add items with the + button. Fill in name, category, location, and quantity.","Set Min Stock to get a red Low Stock badge when qty drops to or below that number.","Shared items (e.g. toolboxes) stay Available when checked out — multiple people can use them simultaneously.","Consumable items (e.g. stickers, reagents) show a Use button on the card — enter the quantity used and it is deducted, no checkout involved. Consumables get no Label ID; nothing is stickered.","Each tracked item gets a Label ID (e.g. RM-001), numbered per category. Print it on a sticker and attach it to the item. Configure prefixes in Settings → Manage Categories.","Supplies you don\u2019t count (zip ties, tape) can be added with \u2018Quantity not tracked\u2019 — they show a Notify button instead, which pings whoever restocks.","When adding multiple cameras, laptops, or robots, check 'Track each unit individually' to create separate items with sub-IDs (e.g. CE-042-01, CE-042-002), each with its own serial number.","Click any item card to see full details, checkout history, and quick actions."]},
            {icon:"tag",title:"Usage / Checkout Tab",color:"var(--blue)",items:["Use Check Out to assign a non-consumable, non-shared item to a person. Enter qty, dates, and optional notes.","Shared items can be checked out by multiple people at the same time and remain Available.","Consumable items do not appear in the checkout list — use the Use button on the card instead.","Mark items Returned when done. Overdue checkouts are highlighted in red.","Only the person who created the checkout, listed group members, or admins can return an item.","Group members: when checking out, optionally add teammates' emails (comma-separated) so they can also return the item.","Bulk Return lets you return multiple items at once."]},
            {icon:"cart",title:"Order Requests Tab",color:"var(--amber)",items:["Submit purchase requests with store, item, link, qty, and price.","Only the person who submitted an order (or an admin) can edit it.","Select multiple orders with checkboxes → Copy Text generates a bullet-list (qty · item · link · price) with grand total — ready to paste into an email or message. Save to Sheet writes the same summary as a table to your Google Sheet.","Admins can move orders through: Pending → Approved → Ordered → Received.","When marked Received, a staging form opens — fill in location, label ID, and serial number before it is added to inventory.","Deliveries are automatically logged when an order is marked Received."]},
            {icon:"calendar",title:"Calendar Tab",color:"var(--purple)",items:["Month and week views. A booking draws as a bar across every day it covers, not two marks at its ends.","Colours: Spirit Blue = delivery, blue = in use, amber = awaiting approval, red = overdue, grey = returned.","A daily window (13:00–16:00) is drawn at those hours on every day of the hold; an all-day hold across several days sits in the week view's all-day strip.","Every booking is visible to everyone, requests included — a request waiting for an admin draws in amber, so you can see the slot somebody has asked for before you ask for it too.","Click any day to see everything on it. Today returns you to now; switching between Month and Week keeps your place."]},
            {icon:"layers",title:"Item Statuses",color:"var(--sub)",items:["🟢 Available — ready to use","🔵 In Use — checked out by one or more people","🟡 Maintenance — temporarily out of service","🔴 Broken — damaged or needs repair","⚠️ Low Stock — qty is at or below the Min Stock threshold (shown as a badge)"]},
            {icon:"lock",title:"The Edit Lock",color:"var(--red)",items:["The lab starts read-only. Click the 🔒 in the header, or Unlock in the red banner, to make changes — it guards against fat fingers, not against people.","Everyone can add and edit items; the lock is per-browser and resets on reload.","When a non-admin unlocks, it is recorded in the AuditLog tab."]},
            {icon:"clock",title:"Booking Rules",color:"var(--cyan)",items:["A shared item is booked either all day or for the same window every day; a sole-use item is held for the whole span.","An active booking owns its slot — you cannot book across one.","A hold longer than 7 days needs an admin's approval, and so does one that overlaps a request already waiting, so a short booking cannot jump the queue.","Asking reserves nothing: several people may queue for the same slot and an admin picks. You can edit or withdraw your own request while it waits.","A booking may not start more than 31 days from now, and the return date has to be after the checkout date."]},
            {icon:"settings",title:"Settings (Admin only)",color:"var(--orange)",items:["Manage Categories — add, remove, or rename categories; set label ID prefix per category (e.g. RM for Robots & Motors). There is no Settings tab in the app; everything else lives in the Google Sheet.","Admins and members lists — edit the Settings tab of the Google Sheet (a JSON array of @jh.edu sign-in addresses, not @jhu.edu). An admin is always a member.","Slack notifications — set slack_mode in that same tab: all | important | digest | off.","Your Microsoft token expires after ~1 hour and renews silently in the background. If you see a red banner at the top, click Sign In Again."]},
          ].map(s=>(
            <div key={s.title}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><Ico n={s.icon} s={16} col={s.color}/><strong style={{color:s.color,fontFamily:"'Roboto',sans-serif"}}>{s.title}</strong></div>
              <ul style={{margin:0,paddingLeft:20,color:"var(--sub)",lineHeight:1.9}}>{s.items.map((it,i)=><li key={i}>{it}</li>)}</ul>
            </div>
          ))}
        </div>
      </Modal>}
      {detail && <ItemDetail item={detail} checkouts={checkouts} onClose={()=>setDetail(null)} onReturn={handleReturn} onQuickCheckout={handleQuickCheckout} onUse={setUseItem} onNotify={setNotifyItem} onEdit={handleEditItem} categories={categories} editLocked={editLocked}/>}
      {groupDetail && <GroupDetail group={groupDetail} checkouts={checkouts} onClose={()=>setGroupDetail(null)} onEdit={handleEditItem} onQuickCheckout={handleQuickCheckout} onReturn={handleReturn} editLocked={editLocked} categories={categories} onAddUnit={async (newUnit)=>{const fid=await handleAddItem(newUnit);setGroupDetail(p=>p?{...p,qty:(p.qty||0)+1,_items:[...(p._items||[]),{...newUnit,displayId:fid||newUnit.displayId}]}:p);}}/>}
      {confirm && <ConfirmModal msg={confirm.msg} onConfirm={confirm.onConfirm} onClose={()=>setConfirm(null)}/>}

      {/* marginTop:auto puts it on the floor of the window when a new lab has
          almost nothing in it yet, and after the content once it does. */}
      <Credit style={{marginTop:"auto",paddingTop:28,paddingBottom:22,paddingLeft:24,paddingRight:24}}/>

      <ToastStack toasts={toasts} rm={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(LabInventory));
</script>
</body>
</html>
