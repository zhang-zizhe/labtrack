<script>
// ─── PER-DEPLOYMENT CONFIG ───────────────────────────────────────────────────
// Everything that differs between one lab's deployment and another lives in
// this block. Standing LabTrack up for a new lab means editing here, creating
// its own backend, and registering its origin as a redirect URI — nothing else
// in this file is lab-specific.
window.LAB_CONFIG = {
  lab_name:    "Alliance AI Lab",
  institution: "Johns Hopkins University",
  signin_hint: "@jh.edu",          // shown on the login page; UPN domain, not the mail alias

  // This lab's own Apps Script deployment. Empty = no backend, so the app runs
  // entirely out of localStorage — which is what you want before the Sheet exists.
  apps_script_url: "",

  // Set to a random string to skip sign-in and talk to the backend directly;
  // must match DEV_NO_AUTH_KEY in google-apps-script.js. The value is visible in
  // page source, so this is for localhost against a scratch Sheet only — never a
  // deployment holding real inventory. A red banner shows while it is on.
  dev_key: "",
};

// Microsoft Entra ID (Azure AD) — Johns Hopkins tenant.
// Keep client_id in sync with ENTRA_CLIENT_ID in google-apps-script.js: the
// backend checks that the token was minted for this exact app, so a mismatch
// makes every request come back Unauthorized.
//
// This is the Alliance lab's own registration, separate from the Figueroa one.
// Sharing a client_id would mean either lab's token satisfied the other's aud
// check, and Alliance users would see "Figueroa Lab Inventory" when signing in.
window.ENTRA_CONFIG = {
  tenant_id: "9fa4f438-b1e6-473b-803f-86f8aedf0dec",  // Johns Hopkins
  client_id: "06d4df0f-39e8-4c3a-aa24-8e76a45d1aa3",  // LabTrack — Alliance AI Lab
  scopes: ["openid", "profile", "email"],
};
</script>
<script type="module">
// MSAL v3+ ships ESM only (Microsoft retired their own CDN), so it is imported
// as a module and handed to the Babel-compiled app below via window.msalReady.
import { PublicClientApplication } from "https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.18.0/+esm";
window.msalReady = (async () => {
  const app = new PublicClientApplication({
    auth: {
      clientId: window.ENTRA_CONFIG.client_id,
      // Tenant-specific authority: Microsoft itself rejects non-JHU accounts,
      // before any token ever reaches us.
      authority: "https://login.microsoftonline.com/" + window.ENTRA_CONFIG.tenant_id,
      redirectUri: location.origin + location.pathname,
    },
    cache: { cacheLocation: "localStorage" },
  });
  await app.initialize();
  window.msalApp = app;
  return app;
})();
window.msalReady.catch(e => console.error("[MSAL] init failed:", e));
</script>

const getNow = () => { const n=new Date(); return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0"); };
const getDatePart = dt => dt ? String(dt).split(" ")[0] : "";
const getTimePart = dt => dt ? (String(dt).split(" ")[1]||"") : "";
const fmtDatetime = (d, t) => d ? (t ? `${d} ${t}` : d) : "";
const getTodayParts = () => {
  const d = new Date();
  return { d: d.getDate(), m: d.getMonth(), y: d.getFullYear() };
};

// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Only allow http/https URLs — blocks javascript: and data: XSS vectors

// Decode a JWT payload for display only — never for authorization decisions.
// The Apps Script backend verifies the signature and every claim.
const decodeJwt = (t) => {
  try {
    let b = String(t).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return JSON.parse(atob(b));
  } catch { return null; }
};

// JHU sign-in names are <JHED>@jh.edu, which lands in preferred_username.
// The `email` claim is optional in Entra and is often the @jhu.edu alias instead,
// so preferred_username is the one that must match the Settings sheet lists.
const userFromAuthResult = (r) => {
  const c = decodeJwt(r.idToken) || {};
  const email = String(c.preferred_username || c.upn || c.email || (r.account && r.account.username) || "").trim().toLowerCase();
  return {
    token: r.idToken,
    name: c.name || (r.account && r.account.name) || email,
    email,
    homeAccountId: (r.account && r.account.homeAccountId) || "",
  };
};

// ─── IMAGE COMPRESSION ──────────────────────────────────────────────────────
const compressImage = (file) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > 400) { h = Math.round(h * 400 / w); w = 400; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
});

// ─── BACKEND API ──────────────────────────────────────────────────────────────
const API = {
  async fetchAll(token) {
    if (!APP_CONFIG.apps_script_url) return null;
    try {
      const url = APP_CONFIG.apps_script_url + "?token=" + encodeURIComponent(token);
      const r = await fetch(url, { redirect: "follow" });
      const text = await r.text();
      try { return JSON.parse(text); } catch { console.error("[API] Not JSON:", text.slice(0, 500)); return null; }
    } catch(e) { console.error("[API] fetchAll error:", e); return null; }
  },
  async post(token, action, payload) {
    if (!APP_CONFIG.apps_script_url) return null;
    try {
      const body = JSON.stringify({ token, action, ...payload });
      const r = await fetch(APP_CONFIG.apps_script_url, {
        method: "POST", body: body, redirect: "follow",
      });
      const text = await r.text();
      try { return JSON.parse(text); } catch { return { ok: true }; }
    } catch(e) { console.error("[API] post error:", e); return null; }
  }
};

// ─── MODAL SHELL ─────────────────────────────────────────────────────────────
const Modal = ({onClose,title,mw=560,children,noPad,dirty=false,saving=false}) => {
  const mdTarget=useRef(null);
  const [warnClose,setWarnClose]=useState(false);
  const warnTimer=useRef(null);
  const handleBdMD=e=>{mdTarget.current=e.target;};
  const handleBdClick=e=>{
    if(saving) return; // never close while a save is in flight
    if(e.target!==e.currentTarget||mdTarget.current!==e.currentTarget)return;
    if(dirty&&!warnClose){
      setWarnClose(true);
      clearTimeout(warnTimer.current);
      warnTimer.current=setTimeout(()=>setWarnClose(false),3000);
      return;
    }
    clearTimeout(warnTimer.current);
    onClose();
  };
  return(
    <div onMouseDown={handleBdMD} onClick={handleBdClick} style={{position:"fixed",inset:0,background:"rgba(7,9,15,.88)",backdropFilter:"blur(7px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--bg1)",border:"1px solid var(--border-hi)",borderRadius:16,width:"100%",maxWidth:mw,maxHeight:"94vh",overflow:"hidden",display:"flex",flexDirection:"column",boxShadow:"0 32px 80px rgba(0,0,0,.8),0 0 0 1px rgba(0,212,200,.05)",animation:"fadeUp .22s ease"}}>
        {saving&&<div style={{background:"var(--bg3)",borderBottom:"1px solid var(--border)",padding:"8px 20px",display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--sub)",flexShrink:0}}>
          <div style={{width:13,height:13,border:"2px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite",flexShrink:0}}/>
          Saving to Google Sheets — please wait…
        </div>}
        {!saving&&warnClose&&<div style={{background:"var(--amber-d)",borderBottom:"1px solid #f5a62340",padding:"8px 20px",display:"flex",alignItems:"center",gap:8,fontSize:12,color:"var(--amber)",flexShrink:0}}>⚠ Click outside again to discard unsaved changes</div>}
        {title!==false&&(
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 24px 16px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
            <h2 style={{margin:0,color:"var(--text)",fontSize:17,fontFamily:"'Roboto',sans-serif",fontWeight:700}}>{title}</h2>
            {saving
              ? <div style={{width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:16,height:16,border:"2px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/></div>
              : <button onClick={onClose} className="ibtn" style={{background:"var(--bg2)",border:"1px solid var(--border)",color:"var(--sub)",borderRadius:8,padding:"5px 9px",cursor:"pointer",display:"flex",alignItems:"center",transition:"all .15s"}}><Ico n="x" s={14}/></button>}
          </div>
        )}
        <div style={{overflow:"auto",flex:1,padding:noPad?"0":"24px"}}>{children}</div>
      </div>
    </div>
  );
};

// ─── TAG INPUT ───────────────────────────────────────────────────────────────
const TagInput = ({tags,onChange,placeholder=""}) => {
  const [inp,setInp]=useState("");
  const inpRef=useRef(null);
  const add=()=>{const t=inp.trim();if(t&&!tags.includes(t))onChange([...tags,t]);setInp("");};
  const remove=i=>onChange(tags.filter((_,j)=>j!==i));
  const onKeyDown=e=>{
    if(e.key==="Enter"||e.key===","){e.preventDefault();add();}
    if(e.key==="Backspace"&&!inp&&tags.length>0){e.preventDefault();remove(tags.length-1);}
  };
  return(
    <div onClick={()=>inpRef.current?.focus()} style={{display:"flex",flexWrap:"wrap",gap:4,padding:"5px 8px",border:"1px solid var(--border)",borderRadius:8,background:"var(--bg2)",cursor:"text",minHeight:38,alignItems:"center"}}>
      {tags.map((t,i)=>(
        <span key={i} style={{background:"var(--bg3)",border:"1px solid var(--border-hi)",borderRadius:5,padding:"2px 7px",fontSize:11,display:"inline-flex",alignItems:"center",gap:3,color:"var(--text)",lineHeight:1.4}}>
          {t}
          <span onMouseDown={e=>{e.preventDefault();remove(i);}} style={{cursor:"pointer",color:"var(--dim)",fontSize:14,lineHeight:1,userSelect:"none",marginLeft:2}}>×</span>
        </span>
      ))}
      <input ref={inpRef} value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={onKeyDown} onBlur={add}
        placeholder={tags.length===0?placeholder:""}
        style={{flex:1,minWidth:80,background:"transparent",border:"none",outline:"none",color:"var(--text)",fontSize:13,padding:"2px 4px"}}/>
    </div>
  );
};
// Renders a comma-separated desc string as chips (if it looks like tags) or plain text
const DescChips = ({desc}) => {
  if(!desc)return <span style={{color:"var(--dim)",fontSize:13}}>No description.</span>;
  const tags=desc.split(",").map(t=>t.trim()).filter(Boolean);
  if(tags.length<=1&&desc.length>40)return <p style={{color:"var(--sub)",fontSize:13,lineHeight:1.6,margin:0}}>{desc}</p>;
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
      {tags.map((t,i)=><span key={i} style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:5,padding:"2px 9px",fontSize:11,color:"var(--sub)"}}>{t}</span>)}
    </div>
  );
};

// ─── IMAGE UPLOAD WIDGET ─────────────────────────────────────────────────────
const ImageUpload = ({value, onChange}) => {
  const fileRef = useRef(null);
  const cameraRef = useRef(null);
  const [showUrl, setShowUrl] = useState(false);
  const [urlVal, setUrlVal] = useState(value && !value.startsWith("data:") ? value : "");
  const preview = value || "";

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const compressed = await compressImage(file);
    onChange(compressed);
  };

  return (
    <div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
      <input ref={cameraRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleFile}/>
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        {preview && <img src={preview} alt="Preview" style={{width:80,height:80,objectFit:"cover",borderRadius:10,border:"1px solid var(--border)"}}/>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={{display:"flex",gap:6}}>
            <Btn sm v="ghost" onClick={()=>fileRef.current?.click()}><Ico n="upload" s={12}/>Upload Photo</Btn>
            <Btn sm v="ghost" onClick={()=>cameraRef.current?.click()}><Ico n="camera" s={12}/>Take Photo</Btn>
          </div>
          {!showUrl ? (
            <button onClick={()=>setShowUrl(true)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",fontSize:11,textAlign:"left",padding:0}}>Or paste URL...</button>
          ) : (
            <div style={{display:"flex",gap:4,alignItems:"center"}}>
              <Inp placeholder="https://..." value={urlVal} onChange={e=>{setUrlVal(e.target.value);onChange(e.target.value);}} style={{fontSize:12,padding:"5px 8px",width:200}}/>
              <button onClick={()=>{setShowUrl(false);}} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:0,display:"flex"}}><Ico n="x" s={13}/></button>
            </div>
          )}
          {preview && <button onClick={()=>{onChange("");setUrlVal("");}} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",fontSize:11,textAlign:"left",padding:0}}>Remove image</button>}
        </div>
      </div>
    </div>
  );
};

// ─── MANAGE CATEGORIES MODAL ─────────────────────────────────────────────────
const ManageCategoriesModal = ({categories, onSave, onClose}) => {
  const [cats, setCats] = useState([...categories]);
  const [prefixes, setPrefixes] = useState(()=>{try{return JSON.parse(localStorage.getItem("labtrack_catprefixes")||"{}");}catch{return {};}});
  const [newCat, setNewCat] = useState("");
  const autoP = c => {const words=c.split(/[\s&\/\-_]+/).filter(Boolean);return(words.length===1?words[0].slice(0,4):words.map(w=>w[0]).join("")).toUpperCase()||"GEN";};
  const addCat = () => {const t=newCat.trim();if(t&&!cats.includes(t)){setCats([...cats,t]);setNewCat("");}};
  const removeCat = (c) => setCats(cats.filter(x=>x!==c));
  const saveAll = () => {localStorage.setItem("labtrack_catprefixes",JSON.stringify(prefixes));onSave(cats);onClose();};
  return (
    <Modal onClose={onClose} title="Manage Categories" mw={460}>
      <div style={{color:"var(--dim)",fontSize:12,marginBottom:10}}>Optionally set a custom prefix per category — auto-generated from initials if left blank. Label IDs look like <span style={{color:"var(--cyan)",fontFamily:"'IBM Plex Mono',monospace"}}>RM-000001</span>, <span style={{color:"var(--cyan)",fontFamily:"'IBM Plex Mono',monospace"}}>SV-000042</span>.</div>

        <span style={{color:"var(--dim)",fontSize:11,fontWeight:600}}>CATEGORY</span>
        <span style={{color:"var(--dim)",fontSize:11,fontWeight:600,textAlign:"center",width:72}}>PREFIX</span>
        <span style={{color:"var(--dim)",fontSize:11,fontWeight:600,textAlign:"center",width:80}}>PREVIEW</span>
        <span style={{width:20}}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16,maxHeight:300,overflow:"auto"}}>
        {cats.map(c=>(
          <div key={c} style={{display:"grid",gridTemplateColumns:"1fr auto auto auto",alignItems:"center",gap:6,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"6px 10px"}}>
            <span style={{fontSize:14,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c}</span>
            <input value={prefixes[c]||""} placeholder={autoP(c)} title="Custom prefix (letters only). Leave blank to auto-generate." onChange={e=>setPrefixes(p=>({...p,[c]:e.target.value.replace(/[^a-zA-Z]/g,"").toUpperCase().slice(0,5)}))} style={{width:72,background:"var(--bg0)",border:"1px solid var(--border)",borderRadius:6,padding:"3px 6px",color:"var(--cyan)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",textAlign:"center"}}/>
            <span style={{color:"var(--sub)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",width:80,textAlign:"center"}}>{(prefixes[c]||autoP(c))+"-000001"}</span>
            <button onClick={()=>removeCat(c)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:0,display:"flex"}}><Ico n="x" s={14}/></button>
          </div>
        ))}
        {cats.length===0 && <div style={{color:"var(--dim)",fontSize:13,textAlign:"center",padding:16}}>No categories yet</div>}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <Inp placeholder="New category name..." value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addCat();}} style={{flex:1}}/>

    const match = i.name.toLowerCase().includes(q.toLowerCase()) || i.loc?.toLowerCase().includes(q.toLowerCase()) || i.desc?.toLowerCase().includes(q.toLowerCase());

};

// ─── CHECKOUT MODAL (multi-item) ─────────────────────────────────────────────
const CheckoutModal = ({items,onClose,onAdd,preItem="",userName="",userEmail="",categories}) => {
  const [coUser,setCoUser]=useState(userName);
  const [outDate,setOutDate]=useState(getToday());
  const [outTime,setOutTime]=useState(getNow());
  const [retDate,setRetDate]=useState("");
  const [retTime,setRetTime]=useState("");
  const [notes,setNotes]=useState("");
  const [groupEmails,setGroupEmails]=useState("");
  const [slots,setSlots]=useState([{item:preItem,qty:1}]);
  const addSlot=()=>setSlots(p=>[...p,{item:"",qty:1}]);
  const removeSlot=i=>setSlots(p=>p.filter((_,j)=>j!==i));
  const updSlot=(i,k,v)=>setSlots(p=>p.map((s,j)=>j===i?{...s,[k]:v}:s));
  const valid=slots.filter(s=>s.item);
  const hasOutOfStock=valid.some(s=>{const it=items.find(i=>i.name===s.item);return it&&(it.qty??0)<=0;});
  const canSubmit=coUser.trim()&&valid.length>0&&retDate.trim()&&!hasOutOfStock;
  const submit=()=>{
    if(!canSubmit)return;
    const ts=uid();
    const out=fmtDatetime(outDate,outTime);
    const ret=fmtDatetime(retDate,retTime);
    valid.forEach((sl,i)=>{
      const sel=items.find(it=>it.name===sl.item);
      onAdd({id:ts+i,item:sl.item,user:coUser.trim(),out,ret,qty:Math.min(sl.qty,sel?.qty||1),notes,groupEmails:groupEmails.trim(),status:"Active"});
    });
    onClose();
  };
  const timeInputStyle={background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 10px",color:"var(--text)",fontSize:14,outline:"none",width:"100%",fontFamily:"'Roboto',sans-serif",boxSizing:"border-box"};
  return(
    <Modal onClose={onClose} title="Check Out Items" mw={660}>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Fld label="Person *"><Inp placeholder="Your name" value={coUser} onChange={e=>setCoUser(e.target.value)}/></Fld>
          <Fld label="Notes (optional)"><Inp placeholder="Experiment, purpose…" value={notes} onChange={e=>setNotes(e.target.value)}/></Fld>
          <Fld label="Checkout Date"><Inp type="date" value={outDate} onChange={e=>setOutDate(e.target.value)}/></Fld>
          <Fld label="Checkout Time"><input type="time" value={outTime} onChange={e=>setOutTime(e.target.value)} style={timeInputStyle}/></Fld>
          <Fld label="Return By (date) *"><Inp type="date" value={retDate} onChange={e=>setRetDate(e.target.value)}/></Fld>
          <Fld label="Return By (time)"><input type="time" value={retTime} onChange={e=>setRetTime(e.target.value)} style={timeInputStyle}/></Fld>
          <div style={{gridColumn:"1/-1"}}>
            <Fld label="Group members (optional)" hint={"Others who can also return these items — comma-separated "+LAB.signin_hint+" sign-in addresses"}>
              <Inp placeholder="jdoe1@jh.edu, asmith3@jh.edu" value={groupEmails} onChange={e=>setGroupEmails(e.target.value)}/>
            </Fld>
          </div>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <span style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>Items to Check Out ({valid.length})</span>
            <Btn sm v="ghost" onClick={addSlot}><Ico n="plus" s={12}/>Add Another</Btn>
          </div>
          {slots.map((sl,i)=>{
            const sel=items.find(it=>it.name===sl.item);
            const maxQ=sel?.qty??0;
            const outOfStock=sel&&maxQ<=0;
            return(
              <div key={i} style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                <div style={{flex:1}}><ItemPicker items={items} value={sl.item} onChange={v=>updSlot(i,"item",v)} categories={categories}/></div>
                {outOfStock
                  ?<span style={{fontSize:11,color:"var(--red)",fontWeight:700,whiteSpace:"nowrap"}}>Out of stock</span>
                  :<input type="number" min={1} max={maxQ} value={sl.qty} title={`Max ${maxQ}`} onChange={e=>updSlot(i,"qty",Math.min(maxQ,Math.max(1,parseInt(e.target.value)||1)))} style={{width:60,background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:8,padding:"9px 8px",textAlign:"center",fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:15,color:"var(--text)",outline:"none"}}/>}
                {slots.length>1&&<button onClick={()=>removeSlot(i)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:4,display:"flex",flexShrink:0}}><Ico n="x" s={14}/></button>}
              </div>
            );
          })}
        </div>
        <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:10,justifyContent:"flex-end"}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={submit} disabled={!canSubmit}><Ico n="check" s={14} col="#000"/>Confirm Checkout{valid.length>1?` (${valid.length} items)`:""}</Btn>
        </div>
      </div>
    </Modal>
  );
};

// ─── ADD ITEM MODAL ──────────────────────────────────────────────────────────
const AddItemModal = ({onClose,onAdd,categories,allItems,onShowLabel}) => {
  const [f,setF]=useState({name:"",cat:categories[0]||"Other",qty:"",unit:"units",loc:"",desc:"",minQty:"0",img:"",serial:"",shared:false,consumable:false});
  const [displayId,setDisplayId]=useState(()=>genDisplayId(categories[0]||"Other",allItems));
  const [splitUnits,setSplitUnits]=useState(false);
  const [serials,setSerials]=useState([]);
  const [advanced,setAdvanced]=useState(false);
  const [submitting,setSubmitting]=useState(false);
  const [warnNoLoc,setWarnNoLoc]=useState(false);
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const chk=k=>e=>setF(p=>({...p,[k]:e.target.checked}));
  const onCatChange=e=>{setF(p=>({...p,cat:e.target.value}));setDisplayId(genDisplayId(e.target.value,allItems));};
  const CHKBOX=(label,key)=><label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f[key]} onChange={chk(key)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>{label}</label>;
  const n=+f.qty||0;
  const canSplit=n>1&&!f.consumable;
  // Keep serials array in sync with qty when split mode is on
  useEffect(()=>{
    if(splitUnits&&n>0) setSerials(s=>Array.from({length:n},(_,i)=>s[i]||""));
  },[n,splitUnits]);
  // Duplicate detection: flag existing items sharing a meaningful keyword with the typed name
  const STOP_WORDS=new Set(["the","for","and","or","of","in","on","to","a","an","at","by","is","it","its","be","as","up","do","if","so","but","not","are","was","has","had","that","with","from","this","into","have","than","then","they","when","also","each","set","per","lot","pack","box","kit","new","pcs","qty","use","via","vs","type","size","mod","gen"]);
  const dupWords=f.name.toLowerCase().split(/\s+/).filter(w=>w.length>=3&&!STOP_WORDS.has(w));
  const dupCheck=f.name.length>=3&&dupWords.length>0
    ?allItems.filter(i=>dupWords.some(w=>(i.name||"").toLowerCase().includes(w)))
    :[];
  const submit=async()=>{
    if(!f.name||!f.qty||submitting)return;
    if(!f.loc.trim()&&!warnNoLoc){setWarnNoLoc(true);return;}
    setWarnNoLoc(false);
    setSubmitting(true);
    const base={...f,minQty:isNaN(+f.minQty)?0:+f.minQty,status:"Available",usedBy:[]};
    try{
      if(splitUnits&&canSplit){
        const results=await Promise.all(Array.from({length:n},(_,u)=>onAdd({...base,id:uid(),qty:1,serial:serials[u]||"",displayId:`${displayId}-${String(u+1).padStart(3,"0")}`})));
        const firstId=results[0]; // server-confirmed ID of first unit
        if(firstId&&onShowLabel) onShowLabel({name:base.name,displayId:firstId,baseId:firstId.replace(/-\d{3}$/,""),count:results.filter(Boolean).length});
      } else {
        const finalId=await onAdd({...base,id:uid(),qty:n,displayId});
        if(finalId&&onShowLabel) onShowLabel({name:base.name,displayId:finalId,count:1});
      }
    } finally {
      setSubmitting(false);
      onClose();
    }
  };
  return(
    <Modal onClose={onClose} title="Add Item" dirty={f.name.trim()!==""||f.qty!==""} saving={submitting}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}>
          <Fld label="Item Name"><Inp placeholder="e.g. UR5 Robot Arm" value={f.name} onChange={s("name")}/></Fld>
          {dupCheck.length>0&&(
            <div style={{marginTop:6,background:"var(--amber-d)",border:"1px solid #f5a62340",borderRadius:7,padding:"8px 12px",fontSize:12,color:"var(--amber)"}}>
              <strong>Possible duplicate{dupCheck.length>1?"s":""} already in inventory:</strong>
              <div style={{marginTop:4,display:"flex",flexWrap:"wrap",gap:6}}>
                {dupCheck.slice(0,5).map(i=>(
                  <span key={i.id} style={{background:"rgba(245,166,35,0.12)",border:"1px solid #f5a62330",borderRadius:5,padding:"1px 7px",fontFamily:"'IBM Plex Mono',monospace",fontSize:11}}>
                    {i.name} <span style={{color:"var(--sub)"}}>({i.displayId||"no ID"}, qty {i.qty})</span>
                  </span>
                ))}
                {dupCheck.length>5&&<span style={{color:"var(--sub)",fontSize:11}}>+{dupCheck.length-5} more</span>}
              </div>
            </div>
          )}
        </div>
        <Fld label="Category"><Sel value={f.cat} onChange={onCatChange}>{categories.map(c=><option key={c}>{c}</option>)}</Sel></Fld>
        {advanced ? (
          <Fld label="Label ID" hint="Print on physical sticker"><Inp value={displayId} onChange={e=>setDisplayId(e.target.value)}/></Fld>
        ) : (
          <div style={{marginBottom:14}}>
            <div style={{color:"var(--sub)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:5,fontFamily:"'IBM Plex Mono',monospace"}}>Label ID <span style={{fontWeight:400,textTransform:"none",letterSpacing:0,color:"var(--dim)"}}>(preview — confirmed after saving)</span></div>
            <div style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:15,fontWeight:700,color:"var(--cyan)",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",letterSpacing:"0.05em"}}>{displayId}</div>
          </div>
        )}
        <Fld label="Quantity"><Inp type="number" min="0" placeholder="0" value={f.qty} onChange={s("qty")}/></Fld>
        <Fld label="Unit"><Sel value={f.unit} onChange={s("unit")}>{["units","pcs","boxes","bottles","sets","rolls","kg","L","m"].map(u=><option key={u}>{u}</option>)}</Sel></Fld>
        <div style={{gridColumn:"1/-1"}}>
          <Fld label="Location"><Inp placeholder="Room 3A / Workbench 2 / Shelf C1" value={f.loc} onChange={e=>{s("loc")(e);setWarnNoLoc(false);}} style={warnNoLoc&&!f.loc.trim()?{borderColor:"var(--amber)"}:{}}/></Fld>
          {warnNoLoc&&!f.loc.trim()&&<div style={{marginTop:-10,marginBottom:8,fontSize:11,color:"var(--amber)"}}>⚠ No location set — this item will be hard to find later. Press Add Item again to skip.</div>}
        </div>
        <div style={{gridColumn:"1/-1",display:"flex",gap:20,flexWrap:"wrap",padding:"4px 0"}}>{CHKBOX("Shared — multiple users simultaneously","shared")}{CHKBOX("Consumable — deduct qty, no checkout needed","consumable")}</div>
        <div style={{gridColumn:"1/-1",marginBottom:4}}>
          <button onClick={()=>setAdvanced(v=>!v)} style={{background:"none",border:"none",color:"var(--dim)",fontSize:12,cursor:"pointer",padding:"2px 0",display:"flex",alignItems:"center",gap:4}}>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" style={{transform:advanced?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}><polyline points="6 9 12 15 18 9"/></svg>
            {advanced?"Hide advanced fields":"Advanced (serial, min stock, tags, image, split units)"}
          </button>
        </div>
        {advanced&&(
          <Fld label="Min Stock Alert"><Inp type="number" min="0" placeholder="0" value={f.minQty} onChange={s("minQty")}/></Fld>
        )}
        {advanced&&!(splitUnits&&canSplit)&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Serial/Product No."><Inp placeholder="e.g. SN-2024-001 or product number" value={f.serial} onChange={s("serial")}/></Fld></div>
        )}
        {advanced&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Tags / Specs" hint="Press Enter or , to add — e.g. M3×8, stainless, pack of 50"><TagInput tags={f.desc?f.desc.split(",").map(t=>t.trim()).filter(Boolean):[]} onChange={ts=>setF(p=>({...p,desc:ts.join(", ")}))} placeholder="Type a tag and press Enter…"/></Fld></div>
        )}
        {advanced&&canSplit&&(
          <div style={{gridColumn:"1/-1",background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 14px"}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--cyan)"}}>
              <input type="checkbox" checked={splitUnits} onChange={e=>setSplitUnits(e.target.checked)} style={{accentColor:"var(--cyan)",width:14,height:14}}/>
              <strong>Track each unit individually</strong><span style={{color:"var(--sub)",fontWeight:400}}> — for cameras, robots, laptops</span>
            </label>
            {splitUnits&&(
              <div style={{marginTop:8}}>
                <div style={{fontSize:11,color:"var(--sub)",fontFamily:"'IBM Plex Mono',monospace",marginBottom:8,lineHeight:1.6}}>
                  Creates {n} items:{" "}
                  {Array.from({length:Math.min(n,3)},(_,i)=>`${displayId}-${String(i+1).padStart(3,"0")}`).join(", ")}
                  {n>3?` … ${displayId}-${String(n).padStart(3,"0")}`:""}<br/>
                  Each gets its own sticker, status, and checkout history.
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:6}}>
                  {Array.from({length:n},(_,i)=>(
                    <Fld key={i} label={`Serial/Product No. — unit ${String(i+1).padStart(3,"0")}`}>
                      <Inp placeholder="e.g. SN-001" value={serials[i]||""} onChange={e=>{const a=[...serials];a[i]=e.target.value;setSerials(a);}}/>
                    </Fld>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}
        {advanced&&(
          <div style={{gridColumn:"1/-1"}}><Fld label="Image"><ImageUpload value={f.img} onChange={v=>setF(p=>({...p,img:v}))}/></Fld></div>
        )}
      </div>
      <div style={{borderTop:"1px solid var(--border)",marginTop:4,paddingTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit} disabled={!f.name||!f.qty||submitting}><Ico n="plus" s={14} col="#000"/>{submitting?"Adding…":(splitUnits&&canSplit?`Create ${n} Items`:"Add Item")}</Btn>
      </div>
    </Modal>
  );
};

        <div style={{gridColumn:"1/-1"}}><Fld label="Serial/Product No."><Inp placeholder="e.g. SN-2024-001 or product number" value={f.serial} onChange={s("serial")}/></Fld></div>
        <div style={{gridColumn:"1/-1"}}><Fld label="Tags / Specs" hint="Press Enter or , to add — e.g. M3×8, stainless, pack of 50"><TagInput tags={f.desc?f.desc.split(",").map(t=>t.trim()).filter(Boolean):[]} onChange={ts=>{setF(p=>({...p,desc:ts.join(", ")}));setChanged(true);}}/></Fld></div>
        <div style={{gridColumn:"1/-1",display:"flex",gap:20,flexWrap:"wrap",padding:"4px 0"}}>{CHKBOX("Shared — multiple users simultaneously","shared")}{CHKBOX("Consumable — deduct qty, no checkout needed","consumable")}</div>
        {canSplit&&(
          <div style={{gridColumn:"1/-1",background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 14px"}}>
            {!splitConfirm?(
              <button onClick={()=>setSplitConfirm(true)} style={{background:"none",border:"none",color:"var(--cyan)",fontSize:13,cursor:"pointer",padding:0,textAlign:"left"}}>
                <Ico n="layers" s={12} col="var(--cyan)"/> Split into {n} individual units ({baseId}-001 … -{String(n).padStart(3,"0")})
              </button>
            ):(
              <div>
                <div style={{fontSize:12,color:"var(--sub)",marginBottom:8}}>
                  Creates {n} items: <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>{baseId}-001</span> → <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>{baseId}-{String(n).padStart(3,"0")}</span>. This item becomes <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>{baseId}-001</span> with qty 1.
                </div>
                <div style={{display:"flex",gap:8}}>
                  <Btn sm onClick={handleSplit}><Ico n="check" s={12} col="#000"/>Confirm Split</Btn>
                  <Btn v="ghost" sm onClick={()=>setSplitConfirm(false)}>Cancel</Btn>
                </div>
              </div>
            )}
          </div>
        )}
        <div style={{gridColumn:"1/-1"}}><Fld label="Image"><ImageUpload value={f.img} onChange={v=>setF(p=>({...p,img:v}))}/></Fld></div>
      </div>
      <div style={{borderTop:"1px solid var(--border)",marginTop:4,paddingTop:16,display:"flex",gap:10,justifyContent:"space-between"}}>
        <div>
          {isAdmin && (!confirmDel ? (
            <Btn v="danger" onClick={()=>setConfirmDel(true)}><Ico n="trash" s={14} col="var(--red)"/>Delete Item</Btn>
          ) : (
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <span style={{color:"var(--red)",fontSize:12}}>Are you sure?</span>
              <Btn v="danger" sm onClick={()=>{onDelete(item.id);onClose();}}>Yes, delete</Btn>
              <Btn v="ghost" sm onClick={()=>setConfirmDel(false)}>Cancel</Btn>
            </div>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={()=>{if(f.name&&f.qty){onSave({...item,...f,qty:+f.qty,minQty:isNaN(+f.minQty)?0:+f.minQty,shared:f.shared,consumable:f.consumable,displayId:f.displayId});onClose();}}} disabled={!f.name||!f.qty}><Ico n="check" s={14} col="#000"/>Save Changes</Btn>
        </div>
      </div>
    </Modal>
  );
};

// ─── PENDING ITEM STAGING MODAL (delivery → inventory) ───────────────────────
const PendingItemModal = ({order,allItems,categories,onClose,onConfirm}) => {
  const [f,setF]=useState({name:order.item||"",cat:order.cat||categories[0]||"Other",qty:String(order.qty||""),unit:order.unit||"units",loc:"",desc:"",minQty:"0",serial:"",shared:false,consumable:false,img:""});
  const [displayId,setDisplayId]=useState(()=>genDisplayId(order.cat||categories[0]||"Other",allItems));
  const s=k=>e=>setF(p=>({...p,[k]:e.target.value}));
  const chk=k=>e=>setF(p=>({...p,[k]:e.target.checked}));

  return(
    <Modal onClose={onClose} title="📦 Add Received Item to Inventory" mw={560}>
      <p style={{color:"var(--sub)",fontSize:13,marginBottom:10}}>Order received! Fill in the missing details before it goes into inventory.</p>
      <div style={{background:"var(--amber-d)",border:"1px solid #f5a62330",borderRadius:8,padding:"9px 12px",marginBottom:14,fontSize:12,color:"var(--amber)"}}>
        <strong>Order qty:</strong> {order.qty} {order.unit} — adjust Qty &amp; Unit below to reflect what's actually going into inventory.
        <span style={{color:"var(--sub)",fontStyle:"italic"}}> e.g. ordered 1 box → inventory qty 100, unit pcs</span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{gridColumn:"1/-1"}}><Fld label="Item Name"><Inp value={f.name} onChange={s("name")}/></Fld></div>
        <Fld label="Category"><Sel value={f.cat} onChange={onCatChange}>{categories.map(c=><option key={c}>{c}</option>)}</Sel></Fld>
        <Fld label="Label ID" hint="Print on physical sticker"><Inp value={displayId} onChange={e=>setDisplayId(e.target.value)}/></Fld>
        <Fld label="Inventory Qty" hint="How many individual units are going in?"><Inp type="number" min="0" value={f.qty} onChange={s("qty")}/></Fld>
        <Fld label="Inventory Unit" hint="Unit for each individual item"><Sel value={f.unit} onChange={s("unit")}>{["units","pcs","boxes","bottles","sets","rolls","kg","L","m"].map(u=><option key={u}>{u}</option>)}</Sel></Fld>
        <Fld label="Min Stock Alert"><Inp type="number" min="0" value={f.minQty} onChange={s("minQty")}/></Fld>
        <div style={{gridColumn:"1/-1"}}><Fld label="Location" hint="Required — where will this live?"><Inp placeholder="e.g. Room 3A / Shelf C1" value={f.loc} onChange={s("loc")}/></Fld></div>
        <div style={{gridColumn:"1/-1"}}><Fld label="Serial/Product No."><Inp placeholder="e.g. SN-2024-001 or product number" value={f.serial} onChange={s("serial")}/></Fld></div>
        <div style={{gridColumn:"1/-1"}}><Fld label="Notes"><Inp value={f.desc} onChange={s("desc")}/></Fld></div>
        <div style={{gridColumn:"1/-1",display:"flex",gap:20,flexWrap:"wrap",padding:"4px 0"}}>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f.shared} onChange={chk("shared")} style={{accentColor:"var(--cyan)"}}/>Shared resource</label>
          <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,color:"var(--sub)"}}><input type="checkbox" checked={f.consumable} onChange={chk("consumable")} style={{accentColor:"var(--cyan)"}}/>Consumable</label>
        </div>
      </div>
      <div style={{borderTop:"1px solid var(--border)",marginTop:16,paddingTop:16,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn v="ghost" onClick={onClose}>Skip (add later)</Btn>
        <Btn onClick={()=>{if(f.name){onConfirm({...f,displayId});onClose();}}} disabled={!f.name}><Ico n="plus" s={14} col="#000"/>Add to Inventory</Btn>
      </div>
    </Modal>
  );
};

// ─── ORDER REQUEST MODAL (multi-item) ────────────────────────────────────────
const OrderModal = ({onClose,onAddMany,userName="",userEmail="",categories}) => {
  const UNITS = ["units","pcs","boxes","bottles","sets","rolls","kg","L","m"];
  const [store,setStore]       = useState("");
  const [urgency,setUrgency]   = useState("Normal");
  const [dateNeeded,setDate]   = useState(getToday());
  const [reason,setReason]     = useState("");
  const [items,setItems]       = useState([{name:"",qty:"",unit:"units",cat:categories[0]||"Other",price:"",link:""}]);

  const addItem = () => setItems(p=>[...p,{name:"",qty:"",unit:"units",cat:categories[0]||"Other",price:"",link:""}]);
  const removeItem = i => setItems(p=>p.filter((_,j)=>j!==i));
  const upd = (i,field,val) => setItems(p=>p.map((it,j)=>j===i?{...it,[field]:val}:it));

  const validItems = items.filter(it=>it.name.trim()&&it.qty&&it.link.trim());
  const canSubmit  = store.trim() && validItems.length>0;

  const submit = () => {
    if(!canSubmit) return;
    onAddMany(validItems.map((it,i)=>({
      id: uid(), item:it.name.trim(), qty:+it.qty, unit:it.unit, cat:it.cat, price:it.price,
      store:store.trim(), link:it.link.trim(), urgency, date:dateNeeded, reason:reason.trim(),
      requestedBy:userName, requestedByEmail:userEmail, status:"Pending"
    })));
    onClose();
  };

  const urgColors={Urgent:"var(--red)",High:"var(--amber)",Normal:"var(--blue)",Low:"var(--sub)"};

  return(
    <Modal onClose={onClose} title="🛒 Request Order" mw={680} dirty={store.trim()!==""||items.some(it=>it.name.trim()!=="")}>
      {/* ── Store + Link (required) ── */}
      <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"14px 16px",marginBottom:14}}>
        <div style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",marginBottom:10}}>Store Info</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <Fld label="Store / Supplier *" hint="e.g. Amazon, McMaster, DigiKey">
            <Inp placeholder="Amazon, McMaster, DigiKey…" value={store} onChange={e=>setStore(e.target.value)}
              style={{borderColor:store.trim()?"var(--border)":"var(--amber)"}}/>
          </Fld>
          <Fld label="Urgency">
            <Sel value={urgency} onChange={e=>setUrgency(e.target.value)}>
              {["Low","Normal","High","Urgent"].map(u=><option key={u}>{u}</option>)}
            </Sel>
          </Fld>
          <Fld label="Date Needed By"><Inp type="date" value={dateNeeded} onChange={e=>setDate(e.target.value)}/></Fld>
          <div style={{gridColumn:"1/-1"}}>
            <Fld label="Reason / Notes"><Inp placeholder="Why do we need this? Which project/experiment?" value={reason} onChange={e=>setReason(e.target.value)}/></Fld>
          </div>
        </div>
      </div>

      {/* ── Item List ── */}
      <div style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{color:"var(--sub)",fontSize:11,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>
            Items * <span style={{color:"var(--dim)",fontWeight:400,textTransform:"none",letterSpacing:0}}>({validItems.length} valid)</span>
          </span>
          <Btn sm v="ghost" onClick={addItem}><Ico n="plus" s={12}/>Add Item</Btn>
        </div>
        <div style={{color:"var(--dim)",fontSize:11,marginBottom:8}}>Enter <strong style={{color:"var(--sub)"}}>purchase qty &amp; unit</strong> — e.g. 2 boxes, not 200 stickers. You'll set inventory units when the order arrives.</div>
        {items.map((it,i)=>(
          <div key={i} style={{background:"var(--bg2)",border:`1px solid ${it.name.trim()&&it.qty?"var(--border)":"var(--border)"}`,borderRadius:10,padding:"10px 12px",marginBottom:8,animation:"fadeIn .2s ease"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
              <div style={{flex:3,minWidth:0}}>
                <Inp placeholder={`Item name / part # ${i===0?"(required)":"(optional)"}`} value={it.name} onChange={e=>upd(i,"name",e.target.value)}/>
              </div>
              <div style={{width:72}}>
                <Inp type="number" placeholder="Qty" value={it.qty} onChange={e=>upd(i,"qty",e.target.value)} style={{textAlign:"center"}}/>
              </div>
              <div style={{width:88}}>
                <Sel value={it.unit} onChange={e=>upd(i,"unit",e.target.value)} style={{padding:"9px 6px",fontSize:12}}>
                  {UNITS.map(u=><option key={u}>{u}</option>)}
                </Sel>
              </div>
              {items.length>1&&(
                <button onClick={()=>removeItem(i)} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:4,display:"flex",flexShrink:0}}><Ico n="x" s={14}/></button>
              )}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 2fr",gap:8}}>
              <Sel value={it.cat} onChange={e=>upd(i,"cat",e.target.value)} style={{padding:"7px 8px",fontSize:12}}>
                {categories.map(c=><option key={c}>{c}</option>)}
              </Sel>
              <Inp placeholder="Unit price (e.g. 12.99)" value={it.price} onChange={e=>upd(i,"price",e.target.value)} title="Enter the price per unit, not total"/>
              <div style={{display:"flex",flexDirection:"column",gap:3,flex:1}}>
                <Inp placeholder="Purchase link (required) https://…" value={it.link} onChange={e=>upd(i,"link",e.target.value)}
                  style={{borderColor:it.link.trim()&&!safeUrl(it.link)?"var(--red)":it.link.trim()?"var(--border)":"var(--amber)"}}/>
                {it.link.trim()&&!safeUrl(it.link)?(
                  <span style={{fontSize:10,color:"var(--red)",lineHeight:1.4}}>⚠ Link must start with https:// or http://</span>
                ):it.link.includes("amazon.com")&&it.link.length>60?(
                  <span style={{fontSize:10,color:"var(--amber)",lineHeight:1.4}}>💡 Amazon tip: use <strong>Share → Copy link</strong> on the product page for a short URL like <span style={{fontFamily:"'IBM Plex Mono',monospace"}}>a.co/d/…</span> instead of the full address bar URL.</span>
                ):it.link.length>60?(
                  <span style={{fontSize:10,color:"var(--amber)",lineHeight:1.4}}>💡 Long URL — please shorten it with <a href="https://bitly.com" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>Bitly</a>, <a href="https://cutt.ly" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>Cuttly</a>, or <a href="https://tinyurl.com" target="_blank" rel="noopener noreferrer" style={{color:"var(--cyan)"}}>TinyURL</a>.</span>
                ):null}
              </div>
            </div>
          </div>
        ))}
      </div>

      <div style={{borderTop:"1px solid var(--border)",paddingTop:14,display:"flex",gap:10,justifyContent:"space-between",alignItems:"center"}}>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <span style={{background:urgColors[urgency]+"22",color:urgColors[urgency],border:`1px solid ${urgColors[urgency]}44`,borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>{urgency}</span>
          <span style={{color:"var(--dim)",fontSize:12}}>{validItems.length} item{validItems.length!==1?"s":""} · {store||"no store yet"}</span>
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn v="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={submit} disabled={!canSubmit}><Ico n="cart" s={14} col="#000"/>Submit {validItems.length>1?`${validItems.length} Requests`:"Request"}</Btn>
        </div>
      </div>
    </Modal>
  );
};

// ─── CONFIRM MODAL ───────────────────────────────────────────────────────────
const ConfirmModal = ({msg,onConfirm,onClose}) => (
  <Modal onClose={onClose} title="Confirm Action" mw={400}>
    <p style={{color:"var(--sub)",fontSize:14,lineHeight:1.6,marginBottom:20}}>{msg}</p>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <Btn v="ghost" onClick={onClose}>Cancel</Btn>
      <Btn v="danger" onClick={()=>{onConfirm();onClose();}}>Confirm</Btn>
    </div>
  </Modal>
);

// ─── GROUP DETAIL MODAL ─────────────────────────────────────────────────────
const GroupDetail = ({group,checkouts,onClose,onEdit,onQuickCheckout,onReturn,editLocked,categories,onAddUnit}) => {
  const [addingUnit,setAddingUnit] = React.useState(false);
  const [newSerial,setNewSerial] = React.useState("");
  const ac = getCatAccent(group.cat,categories||[]);
  const handleAddUnit = () => {
    const maxIdx = Math.max(0,...group._items.map(u=>{const m=String(u.displayId||"").match(/-(\d{3})$/);return m?parseInt(m[1]):0;}));
    const nextDisplayId = `${group._baseId}-${String(maxIdx+1).padStart(3,"0")}`;
    onAddUnit({id:uid(),name:group.name,cat:group.cat,qty:1,unit:group.unit||"units",loc:group.loc||"",desc:group.desc||"",minQty:group.minQty||0,img:group.img||"",status:"Available",usedBy:[],serial:newSerial.trim(),displayId:nextDisplayId,shared:group.shared||false,consumable:false});
    setNewSerial(""); setAddingUnit(false);
  };
  return(
    <Modal onClose={onClose} title={`📦 ${group.name}`} mw={640}>
      <div style={{marginBottom:12,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:4,padding:"2px 8px",color:"var(--cyan)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace",letterSpacing:"0.05em"}}>{group.displayId}</span>
        <span style={{color:"var(--purple)",fontSize:11,fontWeight:700}}>TRACKED UNITS · {group.qty} total</span>
        <span style={{color:"var(--sub)",fontSize:11}}>{group.cat}</span>
        {group.loc&&<span style={{color:"var(--dim)",fontSize:11}}>📍 {group.loc}</span>}
      </div>
      {group.desc&&<div style={{margin:"0 0 12px"}}><DescChips desc={group.desc}/></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:"55vh",overflowY:"auto"}}>
        {group._items.map((unit,i)=>{
          const inUse=toArr(unit.usedBy).length>0;
          const activeCheckout=checkouts.find(c=>c.item===unit.name&&c.status==="Active"&&(!c.displayId||c.displayId===unit.displayId));
          return(
            <div key={unit.id} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
              <div style={{minWidth:120}}>
                <div style={{fontFamily:"'IBM Plex Mono',monospace",color:"var(--cyan)",fontSize:12,fontWeight:700,letterSpacing:"0.05em"}}>{unit.displayId}</div>
                {unit.serial&&<div style={{color:"var(--dim)",fontSize:11,marginTop:2}}>S/N: {unit.serial}</div>}
              </div>
              <div style={{flex:1}}>
                <Badge status={inUse?"In Use":"Available"}/>
                {inUse&&<span style={{marginLeft:8,fontSize:12,color:"var(--sub)"}}>→ {toArr(unit.usedBy).join(", ")}</span>}
                {activeCheckout&&activeCheckout.ret&&<div style={{fontSize:11,color:"var(--dim)",marginTop:3}}>Due: {activeCheckout.ret}</div>}
              </div>
              <div style={{display:"flex",gap:6}}>
                {inUse&&activeCheckout&&(
                  <Btn v="ghost" sm onClick={()=>{onReturn(activeCheckout.id);onClose();}}>Return</Btn>
                )}
                {!inUse&&(
                  <Btn v="cyan" sm onClick={()=>{onClose();onQuickCheckout(unit.name);}}>Check Out</Btn>
                )}
                <Btn v="ghost" sm onClick={()=>{if(editLocked){return;}onClose();onEdit(unit);}} disabled={editLocked} style={editLocked?{opacity:0.4,cursor:"not-allowed"}:{}}>
                  <Ico n={editLocked?"lock":"edit"} s={13}/>{editLocked?"":"Edit"}
                </Btn>
              </div>
            </div>
          );
        })}
      </div>
      {!editLocked&&addingUnit&&(
        <div style={{marginTop:12,background:"var(--cyan-d)",border:"1px solid var(--cyan-m)",borderRadius:8,padding:"10px 12px",display:"flex",gap:8,alignItems:"center"}}>
          <span style={{color:"var(--cyan)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace",whiteSpace:"nowrap"}}>
            Next: {group._baseId}-{String(Math.max(0,...group._items.map(u=>{const m=String(u.displayId||"").match(/-(\d{3})$/);return m?parseInt(m[1]):0;}))+1).padStart(3,"0")}
          </span>
          <Inp placeholder="Serial / Product No. (optional)" value={newSerial} onChange={e=>setNewSerial(e.target.value)} style={{flex:1,padding:"6px 10px",fontSize:13}}/>
          <Btn sm onClick={handleAddUnit}><Ico n="check" s={12} col="#000"/>Add</Btn>
          <Btn v="ghost" sm onClick={()=>{setAddingUnit(false);setNewSerial("");}}>Cancel</Btn>
        </div>
      )}
      <div style={{marginTop:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        {!editLocked&&!addingUnit
          ?<Btn v="ghost" onClick={()=>setAddingUnit(true)}><Ico n="plus" s={14}/>Add Unit</Btn>
          :<div/>}
        <Btn v="ghost" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
};

};

// ─── PAGINATION ──────────────────────────────────────────────────────────────
const Pagination = ({total, page, setPage}) => {
  const totalPages = Math.ceil(total / ITEMS_PER_PAGE);
  if (totalPages <= 1) return null;
  const start = page * ITEMS_PER_PAGE + 1;
  const end = Math.min((page+1) * ITEMS_PER_PAGE, total);
  const pages = [];
  for (let i = 0; i < totalPages; i++) {
    if (i === 0 || i === totalPages-1 || Math.abs(i - page) <= 1) pages.push(i);
    else if (pages[pages.length-1] !== "...") pages.push("...");
  }
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:20,flexWrap:"wrap",gap:10}}>
      <span style={{color:"var(--dim)",fontSize:12}}>Showing {start}–{end} of {total} items</span>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>setPage(Math.max(0,page-1))} disabled={page===0} style={{background:"var(--bg3)",border:"1px solid var(--border)",color:page===0?"var(--dim)":"var(--text)",borderRadius:6,padding:"5px 10px",cursor:page===0?"default":"pointer",fontSize:13}}>
          <Ico n="chevL" s={14}/>
        </button>
        {pages.map((p,i)=>p==="..." ? (
          <span key={`d${i}`} style={{color:"var(--dim)",padding:"0 4px"}}>...</span>
        ) : (
          <button key={p} onClick={()=>setPage(p)} style={{background:p===page?"var(--cyan)":"var(--bg3)",color:p===page?"#000":"var(--sub)",border:`1px solid ${p===page?"var(--cyan)":"var(--border)"}`,borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12,fontWeight:p===page?700:400,minWidth:32}}>{p+1}</button>
        ))}
        <button onClick={()=>setPage(Math.min(totalPages-1,page+1))} disabled={page===totalPages-1} style={{background:"var(--bg3)",border:"1px solid var(--border)",color:page===totalPages-1?"var(--dim)":"var(--text)",borderRadius:6,padding:"5px 10px",cursor:page===totalPages-1?"default":"pointer",fontSize:13}}>
          <Ico n="chevR" s={14}/>
        </button>
      </div>
    </div>
  );
};

// ─── CALENDAR ────────────────────────────────────────────────────────────────
const CAL_EC={pkg:{bg:"var(--green-d)",col:"var(--green)"},out:{bg:"var(--blue-d)",col:"var(--blue)"},ret:{bg:"var(--amber-d)",col:"var(--amber)"},odd:{bg:"var(--red-d)",col:"var(--red)"},act:{bg:"var(--blue-d)",col:"#6ab8ff"}};
const CAL_LBL={pkg:"Delivery",out:"Checked Out",ret:"Return Due",odd:"OVERDUE",act:"In Use"};
// Mini chip for month grid cells and all-day strip — fixed width, clips text
const CalChip=({e,full=false})=>{
  const ec=CAL_EC[e.t];
  if(full) return(
    <div style={{background:ec.bg,color:ec.col,borderLeft:`3px solid ${ec.col}`,borderRadius:6,padding:"7px 10px",marginBottom:5}}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:2}}>
        <span style={{fontSize:10,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace",flexShrink:0}}>{CAL_LBL[e.t]}</span>
        {e.time&&<span style={{fontSize:11,fontFamily:"'IBM Plex Mono',monospace",opacity:.75,flexShrink:0}}>{e.time}</span>}
      </div>
      <div style={{fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.l}</div>
      {e.user&&<div style={{fontSize:11,opacity:.7,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.user}</div>}
    </div>
  );
  return(
    <div title={`${e.l}${e.user?" — "+e.user:""}`} style={{background:ec.bg,color:ec.col,borderLeft:`2px solid ${ec.col}`,borderRadius:3,padding:"2px 5px",marginBottom:2,overflow:"hidden",fontSize:9,lineHeight:1.4,minWidth:0}}>
      <div style={{display:"flex",gap:3,overflow:"hidden",minWidth:0}}>
        {e.time&&<span style={{opacity:.75,whiteSpace:"nowrap",flexShrink:0}}>{e.time}</span>}
        <span style={{fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>{e.l}</span>
      </div>
      {e.user&&<div style={{opacity:.7,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.user}</div>}
    </div>
  );
};
const CalView=({checkouts,deliveries})=>{
  const now=new Date();
  const [yr,setYr]=useState(now.getFullYear());
  const [mo,setMo]=useState(now.getMonth());
  const [calMode,setCalMode]=useState("month");
  const [selDay,setSelDay]=useState(null);
  const [wkStart,setWkStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;});
  const [showPicker,setShowPicker]=useState(false);
  const [pickerYr,setPickerYr]=useState(now.getFullYear());
  const pickerRef=useRef(null);
  useEffect(()=>{
    if(!showPicker)return;
    const fn=e=>{if(pickerRef.current&&!pickerRef.current.contains(e.target))setShowPicker(false);};
    document.addEventListener("mousedown",fn);
    return()=>document.removeEventListener("mousedown",fn);
  },[showPicker]);
  const [wkOvfDay,setWkOvfDay]=useState(null);
  const wkOvfRef=useRef(null);
  useEffect(()=>{
    if(!wkOvfDay)return;
    const fn=e=>{if(wkOvfRef.current&&!wkOvfRef.current.contains(e.target))setWkOvfDay(null);};
    document.addEventListener("mousedown",fn);
    return()=>document.removeEventListener("mousedown",fn);
  },[wkOvfDay]);
  const MNS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const HOURS=Array.from({length:15},(_,i)=>i+7); // 7am–9pm
  const ROW_H=56; // px per hour row
  const FHOUR=HOURS[0],LHOUR=HOURS[HOURS.length-1]+1; // 7, 22
  const todayStr=getToday();
  const goToday=()=>{const n=new Date();setYr(n.getFullYear());setMo(n.getMonth());const ws=new Date(n);ws.setDate(ws.getDate()-ws.getDay());ws.setHours(0,0,0,0);setWkStart(ws);};
  const prev=()=>calMode==="month"?(mo===0?(setMo(11),setYr(y=>y-1)):setMo(m=>m-1)):setWkStart(d=>{const nd=new Date(d);nd.setDate(nd.getDate()-7);return nd;});
  const next=()=>calMode==="month"?(mo===11?(setMo(0),setYr(y=>y+1)):setMo(m=>m+1)):setWkStart(d=>{const nd=new Date(d);nd.setDate(nd.getDate()+7);return nd;});
  const openPicker=()=>{setPickerYr(calMode==="month"?yr:wkStart.getFullYear());setShowPicker(v=>!v);};
  const pickMonth=(py,pm)=>{
    if(calMode==="month"){setYr(py);setMo(pm);}
    else{const d=new Date(py,pm,1);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWkStart(d);}
    setShowPicker(false);
  };
  const switchToWeek=()=>{
    if(selDay){const[sy,sm,sd]=selDay.split("-").map(Number);const d=new Date(sy,sm-1,sd);d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWkStart(d);}
    setCalMode("week");
  };
  const evtsFor=ds=>{
    const r=[];
    deliveries.forEach(x=>x.date===ds&&r.push({t:"pkg",l:x.item,time:"",user:""}));
    checkouts.forEach(x=>{
      if(getDatePart(x.out)===ds)r.push({t:"out",l:x.item,time:getTimePart(x.out),user:x.user});
      if(getDatePart(x.ret)===ds)r.push({t:isOverdue(x)?"odd":"ret",l:x.item,time:getTimePart(x.ret),user:x.user});
    });
    return r;
  };
  const wkDays=Array.from({length:7},(_,i)=>{const d=new Date(wkStart);d.setDate(d.getDate()+i);return d;});
  const wkStrs=wkDays.map(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`);
  const wkLabel=()=>{const s=wkDays[0],e=wkDays[6];return s.getMonth()===e.getMonth()?`${MNS[s.getMonth()].slice(0,3)} ${s.getDate()}–${e.getDate()}, ${s.getFullYear()}`:`${MNS[s.getMonth()].slice(0,3)} ${s.getDate()} – ${MNS[e.getMonth()].slice(0,3)} ${e.getDate()}, ${e.getFullYear()}`;};
  // All-day strip: deliveries + checkouts spanning the whole day (started before, not yet returned)
  const delivByDay=wkStrs.map(ds=>deliveries.filter(x=>x.date===ds).map(x=>({t:"pkg",l:x.item,time:"",user:""})));
  const spanByDay=wkStrs.map(ds=>checkouts.filter(x=>x.status==="Active"&&getDatePart(x.out)<ds&&getDatePart(x.ret)>=ds).map(x=>({t:"act",l:x.item,time:"",user:x.user})));
  // Duration blocks for week view: checkout→return block within a single day column
  const toH=t=>{if(!t)return null;const h=parseInt(t);return isNaN(h)?null:h;}; // parse hour from "HH:MM"
  const toM=t=>{if(!t)return 0;const m=parseInt((t.split(":")[1]||"0"));return isNaN(m)?0:m;};
  const wkBlocks=wkStrs.map(ds=>{
    const evs=[];
    checkouts.forEach(x=>{
      const oDs=getDatePart(x.out),rDs=getDatePart(x.ret);
      const oT=getTimePart(x.out)||"09:00",rT=getTimePart(x.ret)||"17:00";
      const oH=toH(oT.split(":")[0])||9,oM=toM(oT);
      const rH=toH(rT.split(":")[0])||17,rM=toM(rT);
      if(oDs===ds){
        // Checkout starts today: block from checkout time → return time (same day) or end of grid
        const sh=Math.max(oH,FHOUR),sm=oH<FHOUR?0:oM;
        const eh=rDs===ds?Math.min(rH,LHOUR):LHOUR,em=(rDs===ds&&rH<LHOUR)?rM:0;
        if(sh<LHOUR)evs.push({t:"out",l:x.item,user:x.user,sh,sm,eh,em,continues:rDs!==ds,id:x.id+"o"});
      } else if(rDs===ds){
        // Return day: block from top of grid → return time
        const eh=Math.min(rH,LHOUR),em=rH<LHOUR?rM:0;
        if(eh>FHOUR)evs.push({t:isOverdue(x)?"odd":"ret",l:x.item,user:x.user,sh:FHOUR,sm:0,eh,em,continues:false,id:x.id+"r"});
      }
    });
    // Greedy lane assignment for overlapping events
    const MAX_LANES=3;
    const sorted=[...evs].sort((a,b)=>(a.sh*60+a.sm)-(b.sh*60+b.sm));
    const lns=[];
    sorted.forEach(e=>{
      const li=lns.findIndex(ln=>(e.sh*60+e.sm)>=(ln[ln.length-1].eh*60+ln[ln.length-1].em));
      if(li<0){e.ln=lns.length;lns.push([e]);}else{e.ln=li;lns[li].push(e);}
    });
    const totalLns=Math.max(lns.length,1);
    const vis=sorted.filter(e=>e.ln<MAX_LANES);
    vis.forEach(e=>{e.nln=Math.min(totalLns,MAX_LANES);});
    return {vis,ovf:sorted.filter(e=>e.ln>=MAX_LANES)};
  });
  const evTop=e=>(e.sh-FHOUR)*ROW_H+(e.sm/60)*ROW_H;
  const evH=e=>Math.max((e.eh-e.sh)*ROW_H+((e.em-e.sm)/60)*ROW_H,24);
  const first=new Date(yr,mo,1).getDay(),total=new Date(yr,mo+1,0).getDate();
  const NB={background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:14,fontWeight:600};
  const MB=act=>({background:act?"var(--cyan-d)":"var(--bg3)",color:act?"var(--cyan)":"var(--dim)",border:`1px solid ${act?"#00d4c830":"var(--border)"}`,borderRadius:7,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"});
  const DAYS_S=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const GW=48;
  const totalH=HOURS.length*ROW_H;
  return(
    <div>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={prev} style={NB}>←</button>
          <div ref={pickerRef} style={{position:"relative"}}>
            <button onClick={openPicker} style={{fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:18,minWidth:calMode==="month"?150:210,textAlign:"center",background:"transparent",border:"1px solid transparent",borderRadius:8,padding:"5px 10px",cursor:"pointer",color:"var(--text)",transition:"border-color .15s",":hover":{borderColor:"var(--border)"}}}>
              {calMode==="month"?`${MNS[mo]} ${yr}`:wkLabel()} <span style={{fontSize:12,opacity:.5}}>▾</span>
            </button>
            {showPicker&&(
              <div style={{position:"absolute",top:"calc(100% + 6px)",left:"50%",transform:"translateX(-50%)",zIndex:200,background:"var(--bg2)",border:"1px solid var(--border-hi)",borderRadius:12,padding:"14px 12px",boxShadow:"0 8px 28px rgba(0,0,0,0.5)",width:220}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                  <button onClick={()=>setPickerYr(y=>y-1)} style={{...NB,padding:"3px 10px",fontSize:13}}>←</button>
                  <span style={{fontWeight:800,fontSize:16,fontFamily:"'Roboto',sans-serif"}}>{pickerYr}</span>
                  <button onClick={()=>setPickerYr(y=>y+1)} style={{...NB,padding:"3px 10px",fontSize:13}}>→</button>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4}}>
                  {MNS.map((mn,mi)=>{
                    const isAct=calMode==="month"?mi===mo&&pickerYr===yr:false;
                    return(<button key={mi} onClick={()=>pickMonth(pickerYr,mi)} style={{background:isAct?"var(--cyan-d)":"var(--bg3)",color:isAct?"var(--cyan)":"var(--text)",border:`1px solid ${isAct?"var(--cyan)":"var(--border)"}`,borderRadius:7,padding:"7px 2px",cursor:"pointer",fontSize:11,fontWeight:700}}>{mn.slice(0,3)}</button>);
                  })}
                </div>
              </div>
            )}
          </div>
          <button onClick={next} style={NB}>→</button>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={goToday} style={MB(false)}>Today</button>
          <button onClick={()=>setCalMode("month")} style={MB(calMode==="month")}>Month</button>
          <button onClick={switchToWeek} style={MB(calMode==="week")}>Week</button>
        </div>
      </div>

      {calMode==="month"?(
        /* ── Month view ── */
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:4}}>
            {DAYS_S.map(d=><div key={d} style={{textAlign:"center",color:"var(--dim)",fontSize:10,fontWeight:700,padding:"4px 0",fontFamily:"'IBM Plex Mono',monospace"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
            {Array.from({length:first}).map((_,i)=><div key={`e${i}`}/>)}
            {Array.from({length:total}).map((_,i)=>{
              const d=i+1,ds=`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
              const isT=ds===todayStr,isSel=selDay===ds,ev=evtsFor(ds);
              return(
                <div key={d} onClick={()=>setSelDay(isSel?null:ds)} style={{background:isT?"var(--cyan-d)":isSel?"var(--bg3)":"var(--bg2)",borderRadius:8,minHeight:72,border:`1px solid ${isT?"var(--cyan)":isSel?"var(--border-hi)":"var(--border)"}`,padding:"5px 6px",cursor:"pointer",transition:"border-color .1s",overflow:"hidden"}}>
                  <div style={{color:isT?"var(--cyan)":"var(--dim)",fontSize:10,fontWeight:isT?800:500,fontFamily:"'IBM Plex Mono',monospace",marginBottom:3}}>{d}</div>
                  {ev.slice(0,2).map((e,j)=><CalChip key={j} e={e}/>)}
                  {ev.length>2&&<div style={{color:"var(--dim)",fontSize:8,fontWeight:700}}>+{ev.length-2}</div>}
                </div>
              );
            })}
          </div>
          {selDay&&(()=>{
            const ev=evtsFor(selDay);if(!ev.length)return null;
            const [sy,sm,sd]=selDay.split("-").map(Number);
            return(
              <div style={{marginTop:12,background:"var(--bg2)",border:"1px solid var(--border-hi)",borderRadius:10,padding:"14px 16px"}}>
                <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:"var(--text)",fontFamily:"'Roboto',sans-serif"}}>{MNS[sm-1]} {sd}, {sy}</div>
                {ev.map((e,i)=><CalChip key={i} e={e} full/>)}
              </div>
            );
          })()}
        </div>
      ):(
        /* ── Week view: absolute-positioned duration blocks ── */
        <div style={{border:"1px solid var(--border)",borderRadius:10,overflow:"hidden"}}>
          {/* Day headers */}
          <div style={{display:"flex",background:"var(--bg2)",borderBottom:"1px solid var(--border)"}}>
            <div style={{width:GW,flexShrink:0,borderRight:"1px solid var(--border)"}}/>
            {wkDays.map((day,i)=>{const ds=wkStrs[i],isT=ds===todayStr,ovfCnt=wkBlocks[i].ovf.length;return(
              <div key={i} style={{flex:1,textAlign:"center",padding:"8px 4px",borderLeft:i>0?"1px solid var(--border)":"none",position:"relative"}}>
                <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",color:"var(--dim)",fontFamily:"'IBM Plex Mono',monospace"}}>{DAYS_S[day.getDay()]}</div>
                <div style={{fontFamily:"'Roboto',sans-serif",fontWeight:900,fontSize:20,width:30,height:30,borderRadius:"50%",background:isT?"var(--cyan)":"transparent",color:isT?"#000":"var(--text)",display:"flex",alignItems:"center",justifyContent:"center",margin:"3px auto 0"}}>{day.getDate()}</div>
                {ovfCnt>0&&(
                  <div ref={wkOvfDay===ds?wkOvfRef:null} style={{display:"inline-block",position:"relative"}}>
                    <button onClick={()=>setWkOvfDay(p=>p===ds?null:ds)} style={{marginTop:3,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--dim)",borderRadius:10,padding:"1px 6px",cursor:"pointer",fontSize:9,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>+{ovfCnt} more</button>
                    {wkOvfDay===ds&&(
                      <div style={{position:"absolute",top:"calc(100% + 4px)",left:"50%",transform:"translateX(-50%)",zIndex:200,background:"var(--bg2)",border:"1px solid var(--border-hi)",borderRadius:10,padding:"10px",width:200,boxShadow:"0 6px 20px rgba(0,0,0,0.5)",textAlign:"left"}}>
                        <div style={{fontSize:10,fontWeight:700,color:"var(--dim)",marginBottom:6,fontFamily:"'IBM Plex Mono',monospace"}}>Hidden events</div>
                        {wkBlocks[i].ovf.map((e,j)=><CalChip key={j} e={e} full/>)}
                      </div>
                    )}
                  </div>
                )}
              </div>
            );})}
          </div>
          {/* All-day strip */}
          {(delivByDay.some(d=>d.length>0)||spanByDay.some(s=>s.length>0))&&(

// ─── PHYSICAL LABEL ID ───────────────────────────────────────────────────────
function catPrefix(cat) {
  // Use stored custom prefix if available
  try { const m=JSON.parse(localStorage.getItem("labtrack_catprefixes")||"{}"); if(m[cat]) return m[cat]; } catch {}
  // Auto: initials of each word, e.g. "Robots & Motors"→"RM", "Other"→"OTHE"
  const words=(cat||"GEN").split(/[\s&\/\-_]+/).filter(Boolean);
  return (words.length===1 ? words[0].slice(0,4) : words.map(w=>w[0]).join("")).toUpperCase()||"GEN";
}
function genDisplayId(cat, allItems) {
  const prefix = catPrefix(cat);
  // Global sequential 6-digit counter. The regex ignores any sub-ID suffix
  // (e.g. captures 000042 from "CE-000042-001" so split units don't corrupt the counter)
  const maxNum = Math.max(0,...(allItems||[]).map(i=>{const m=String(i.displayId||"").match(/(\d{6})(?:-\d+)?$/);return m?parseInt(m[1]):0;}));
  return `${prefix}-${String(maxNum+1).padStart(6,"0")}`;
}
function isSubItem(displayId) {
  return /^.+-\d{3}$/.test(String(displayId||""));
}
function getBaseId(displayId) {
  return String(displayId||"").replace(/-\d{3}$/, "");
}

// ─── PURCHASE TEXT GENERATOR ──────────────────────────────────────────────────
function generateEmailText(orders) {
  const fmtP = p => {
    if(!p && p!==0) return null;
    const n = typeof p==="number" ? p : parseFloat(String(p).replace(/[^0-9.]/g,""));
    return isNaN(n) ? null : "$"+n.toFixed(2);
  };
  const calcTotal = (price,qty) => {
    const p = typeof price==="number" ? price : parseFloat(String(price||"").replace(/[^0-9.]/g,""));
    const q = parseFloat(qty)||0;
    return (!isNaN(p)&&q) ? p*q : null;
  };
  const lines = orders.map(o=>{
    const qty = o.qty||"";
    const price = fmtP(o.price);
    const meta = [`Quantity: ${qty}`, ...(price?[`Price/Item: ${price}`]:[])].join(", ");
    return `- ${qty} ${o.item}  ${o.link||""}  (${meta})`;
  });
  const grand = orders.reduce((a,o)=>{const t=calcTotal(o.price,o.qty);return t!==null?a+t:a;},0);
  return lines.join("\n") + (grand>0 ? `\n\nGrand Total: $${grand.toFixed(2)}` : "");
}


// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,info){console.error("LabTrack render error:",e,info);}
  render(){
    if(this.state.err){
      return React.createElement("div",{style:{textAlign:"center",padding:"60px 20px"}},
        React.createElement("div",{style:{color:"var(--red)",fontSize:16,fontWeight:700,marginBottom:8}},"Something went wrong rendering the item list"),
        React.createElement("div",{style:{color:"var(--dim)",fontSize:12,marginBottom:16,fontFamily:"'IBM Plex Mono',monospace"}},String(this.state.err?.message||"")),
        React.createElement("button",{onClick:()=>this.setState({err:null}),style:{background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"7px 18px",cursor:"pointer",fontSize:13}},"Retry")
      );
    }
    return this.props.children;
  }
}
