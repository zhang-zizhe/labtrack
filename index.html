  // Restore session + theme
  useEffect(()=>{
    try {
      const saved = localStorage.getItem("labtrack_user");
      if (saved) {
        const u = JSON.parse(saved);
        setUser(u);
        tokenRef.current = u.token || null;
        if (u.token === "local") setUserRole(u.role === "admin" ? "admin" : "member");
        // The stored token is almost always expired by now; MSAL holds the
        // refresh token. If its cache was cleared, drop back to the login page.
        if (u.token && !isBypassToken(u.token)) {
          Promise.resolve(window.msalReady).then(app => {
            if (app.getAllAccounts().length === 0) {
              setUser(null); tokenRef.current = null;
              localStorage.removeItem("labtrack_user");
            }
          }).catch(()=>{});
        }
      } else if (DEV_MODE) {
        // Skip the login page and talk to the backend directly. Only works while
        // DEV_NO_AUTH_KEY is set to the same value in google-apps-script.js.
        // Name and email here are display-only placeholders; the backend
        // substitutes DEV_NO_AUTH_EMAIL as the identity it actually authorizes.
        const devUser = { token: "dev:" + LAB.dev_key, name: "Dev Mode", email: "dev@localhost" };
        setUser(devUser);
        tokenRef.current = devUser.token;
      }
      localStorage.removeItem("labtrack_categories"); // no longer cached; server is source of truth
      // Key renamed from labtrack_dark deliberately. The old effect wrote "true"
      // on first render, so every browser that ever opened the dark-default build
      // has a stored preference it never actually chose — reading it would pin
      // those users to dark forever. The old key is left to rot.
      localStorage.removeItem("labtrack_dark");
      const theme = localStorage.getItem("labtrack_theme");
      if (theme === "dark" || theme === "light") {
        const isDark = theme === "dark";
        setDarkMode(isDark);
        document.documentElement.classList.toggle("dark", isDark);
      }
    } catch {}
    setLoading(false);
  },[]);

  // Apply light/dark mode
  useEffect(()=>{
    document.documentElement.classList.toggle("dark", darkMode);
    localStorage.setItem("labtrack_theme", darkMode ? "dark" : "light");
  },[darkMode]);

  // Fetch data from backend when signed in
  useEffect(()=>{
    if (!user || dataLoaded) return;
    if (!APP_CONFIG.apps_script_url || user.token === "local") {
      try {
        const saved = localStorage.getItem(dataKey(user));
        const d = saved ? JSON.parse(saved) : null;
        // Nothing stored, or stored-but-empty: hand the previewer a lab to look at
        // rather than an empty grid. Clearing everything gets it back.
        const bare = !d || (!(d.items||[]).length && !(d.checkouts||[]).length &&
                            !(d.orders||[]).length && !(d.deliveries||[]).length);
        const src = (bare && user.token === "local") ? demoData() : (d || {});
        setItems(src.items || []);
        setDeliv(src.deliveries || []);
        setCheckouts(src.checkouts || []);
        setOrders(src.orders || []);
      } catch {}
      setDataLoaded(true);
      return;
    }
    setFetchingData(true);
    (async ()=>{
      const data = await API.fetchAll(await getFreshToken());
      if (data && data.error === "NotMember") {
        setUser(null);
        localStorage.removeItem("labtrack_user");
        setSignedOutBecause("Your account (" + (user.email||"") + ") is not authorized to access this lab's system. Contact a lab admin to be added.");
        setDataLoaded(true); setFetchingData(false); return;
      }
      if (data && data.error === "Unauthorized") {
        setSessionExpired(true);
      }
      if (data && data.error) {
        console.error("[LabTrack] Backend error:", data.error, data.detail);
        try {
          const saved = localStorage.getItem(dataKey(user));
          if (saved) {
            const d = JSON.parse(saved);
            if (d.items) setItems(d.items);
            if (d.deliveries) setDeliv(d.deliveries);
            if (d.checkouts) setCheckouts(d.checkouts);
            if (d.orders) setOrders(d.orders);
          }
        } catch {}
      } else if (data && data.items) {
        setItems(data.items);
        setDeliv(data.deliveries || []);
        setCheckouts(data.checkouts || []);
        setOrders(data.orders || []);
        // Load categories from settings
        if (data.settings && data.settings.categories) {
          try {
            const serverCats = JSON.parse(data.settings.categories);
            if (Array.isArray(serverCats) && serverCats.length > 0) {
              setCategories(serverCats);
            }
          } catch {}
        }
        // catPrefix() reads this cache; the lab's copy is authoritative.
        if (data.settings && data.settings.cat_prefixes) {
          try {
            const p = JSON.parse(data.settings.cat_prefixes);
            if (p && typeof p === "object") localStorage.setItem("labtrack_catprefixes", JSON.stringify(p));
          } catch {}
        }
        if (data.userRole) setUserRole(data.userRole);
        if (data.settings && data.settings.last_backup) setLastBackup(data.settings.last_backup);
      }
      setDataLoaded(true);
      setFetchingData(false);
    })();
  },[user]);

  // Save data locally as fallback
  useEffect(()=>{
    if (!dataLoaded) return;
    localStorage.setItem(dataKey(user), JSON.stringify({items, deliveries, checkouts, orders}));
  },[items, deliveries, checkouts, orders, dataLoaded, user]);

  // Auto-refresh: poll every 30s for changes from other users
  useEffect(()=>{
    if (!user || !dataLoaded || !APP_CONFIG.apps_script_url || user.token === "local") return;
    const interval = setInterval(async ()=>{
      try {
        const data = await API.fetchAll(await getFreshToken());
        if (data && !data.error && data.items) {
          const now = Date.now(); const GRACE = 60000;
          const lm = lastModified.current;
          if (now - lm.items     > GRACE) setItems(data.items.filter(i=>!deletedItemIds.current.has(String(i.id))));
          if (now - lm.deliveries > GRACE) setDeliv(data.deliveries || []);
          if (now - lm.checkouts  > GRACE) setCheckouts(data.checkouts || []);
          if (now - lm.orders     > GRACE) setOrders(data.orders || []);
          if (data.userRole) setUserRole(data.userRole);
          if (data.settings && data.settings.categories) {
            try {
              const sc = JSON.parse(data.settings.categories);
              if (Array.isArray(sc) && sc.length > 0) { setCategories(sc); }
            } catch {}
          }
        }
      } catch {}
    }, 30000);
    return () => clearInterval(interval);
  },[user, dataLoaded]);

  // Reset page/limit when filters change
  useEffect(()=>{ setPage(0); setInvLimit(ITEMS_PER_PAGE); },[search, catF, sortBy]);

  // Infinite scroll via scroll event on the correct container:
  // - list view: the inner table div (overflow:auto, maxHeight:65vh)
  // - grid view: window (page grows naturally as items are added)
  useEffect(()=>{
    const loadMore=()=>{
      if(scrollCooldown.current) return;
      scrollCooldown.current=true;
      setInvLimit(l=>l+ITEMS_PER_PAGE);
      setTimeout(()=>{scrollCooldown.current=false;},400);
    };
    if(view==="list"){
      const el=tableScrollRef.current;
      if(!el) return;
      const fn=()=>{if(el.scrollTop+el.clientHeight>=el.scrollHeight-150) loadMore();};
      el.addEventListener("scroll",fn,{passive:true});
      return ()=>el.removeEventListener("scroll",fn);
    } else {
      const fn=()=>{if(window.innerHeight+window.scrollY>=document.body.scrollHeight-300) loadMore();};
      window.addEventListener("scroll",fn,{passive:true});
      return ()=>window.removeEventListener("scroll",fn);
    }
  },[view]);

  const addToast=useCallback((type,msg,onClick)=>{
    const id=++tid.current;
    setToasts(t=>[...t,{id,type,msg,onClick}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),6000);
    return id;
  },[]);

  const handleSignIn = (u) => {
    tokenRef.current = u.token;
    setUser(u); setSessionExpired(false); setDataLoaded(false);
    // The role normally arrives from doGet, and the preview has no server to ask,
    // so it stayed "member" — leaving no way to delete anything you added by
    // mistake in your own sandbox. There is nothing to protect here: the data is
    // this browser's, and the backend rejects the "local" token outright.
    if (u.token === "local") setUserRole(u.role === "admin" ? "admin" : "member");
    localStorage.setItem("labtrack_user", JSON.stringify(u));
  };

  const handleSignOut = () => {
    tokenRef.current = null;
    setUser(null); setDataLoaded(false); setItems([]); setDeliv([]); setCheckouts([]); setOrders([]);
    localStorage.removeItem("labtrack_user");
    Promise.resolve(window.msalReady)
      .then(app => app.clearCache())   // drops MSAL's cached account + refresh token
      .catch(()=>{});
  };

  // Returns a non-expired ID token, renewing it through MSAL's refresh token
  // when needed. Replaces the old GSI timer: nothing is scheduled, the token is
  // simply refreshed on the next API call after it goes stale.
  const getFreshToken = async (interactive) => {
    if (!user) return null;
    if (isBypassToken(user.token)) return user.token;

    const cur = tokenRef.current;
    const claims = cur ? decodeJwt(cur) : null;
    if (claims && claims.exp && (claims.exp * 1000 - Date.now()) > 5 * 60 * 1000) return cur;

    try {
      const app = await window.msalReady;
      const accounts = app.getAllAccounts();
      const account = accounts.find(a => a.homeAccountId === user.homeAccountId) || accounts[0];
      if (!account) throw new Error("no cached account");
      const req = { scopes: MSAL_SCOPES(), account };
      const r = interactive ? await app.acquireTokenPopup(req) : await app.acquireTokenSilent(req);
      tokenRef.current = r.idToken;
      setSessionExpired(false);
      return r.idToken;
    } catch(e) {
      // Refresh token expired or revoked — show the banner and let the request
      // go out with the stale token so the server's rejection stays authoritative.
      console.error("[MSAL] token refresh failed:", e);
      setSessionExpired(true);
      return cur;
    }
  };

  const handleSaveCategories = async (newCats, newPrefixes) => {
    const prev = categories;
    setCategories(newCats);
    if (APP_CONFIG.apps_script_url && user?.token !== "local") {
      // The prefixes go with them. They were saved to localStorage alone, so the
      // admin's own machine and everyone else's produced two label series for one
      // category — and clearing site data started a third.
      if (newPrefixes) await postAction("saveSettings", { key: "cat_prefixes", value: JSON.stringify(newPrefixes) });
      // This was the one write that went round postAction, so it never surfaced a
      // refusal — an admin removed from the list since sign-in saw "Categories
      // updated" on a change that was refused, and kept seeing it until reload.
      const res = await postAction("saveSettings", { key: "categories", value: JSON.stringify(newCats) });
      if (!res || res.error) {
        setCategories(prev);
        addToast("error", (res && (res.detail || res.error)) || "Could not save categories — nothing was changed");
        return;
      }
    }
    addToast("success", "Categories updated");
  };

  // keyboard shortcuts
  useEffect(()=>{
    if (!user) return;
    const h=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
      if(e.key==="Escape"){setModal(null);setDetail(null);setConfirm(null);setLabelItem(null);}
      // Only when nothing is open. These swap `modal` outright, so pressing one
      // over a half-filled form unmounted it and threw the typing away — the
      // dirty guard never got a say, because nothing was being closed.
      if(modal||detail||confirm||labelItem||editOrder||useItem||notifyItem||editReq||pendingItem||editItem)return;
      if(e.key==="n"||e.key==="N") setModal("delivery");
      if(e.key==="c"||e.key==="C"){setPreItem("");setModal("checkout");}
    };
    document.addEventListener("keydown",h);
    return()=>document.removeEventListener("keydown",h);
  },[user,modal,detail,confirm,labelItem,editOrder,useItem,notifyItem,editReq,pendingItem,editItem]);

  // computed
  const lowStock = items.filter(isLowStock);
  const activeOut = checkouts.filter(c=>c.status==="Active");
  const overdues = checkouts.filter(c=>isOverdue(c));
  const pendingCos = checkouts.filter(c=>c.status===CO_PENDING);
  // Grouped by item so the admin sees the queue for one thing in one place,
  // which is the only way "pick one of these" reads as a choice rather than as
  // a list of unrelated rows that happen to share a name.
  const pendingByItem = pendingCos.reduce((m,c)=>{
    const k=String(c.itemId||c.item); (m[k]=m[k]||[]).push(c); return m;
  },{});

  // handlers
  // The address is minted on first use, so this is a request rather than a lookup.
  const openSubscribe = async (rotate) => {
    // Preview opens the modal to explain itself rather than firing an error toast.
    // The feature works; it is this session that has no lab behind it, and a red
    // error reads as broken to the one audience preview exists for.
    if (!APP_CONFIG.apps_script_url || user?.token === "local") {
      setIcsUrl(""); setModal("subscribe");
      return;
    }
    setIcsBusy(true);
    const res = await postAction("getIcsUrl", rotate ? { rotate: true } : {});
    setIcsBusy(false);
    if (res?.url) { setIcsUrl(res.url); setModal("subscribe"); if (rotate) addToast("success", "New address minted — the old one is dead"); }
    else if (!res?.error) addToast("error", "Could not get a calendar address");
  };

  const postAction = (action, payload) => {
    // Mark data type as locally modified → suppress poll override for 60s
    const now = Date.now();
    if (/item|consumable/i.test(action)) lastModified.current.items = now;
    if (/checkout|return/i.test(action)) { lastModified.current.checkouts = now; lastModified.current.items = now; }
    if (/order/i.test(action)) lastModified.current.orders = now;
    if (/delivery/i.test(action)) lastModified.current.deliveries = now;
    // No backend (local preview, or apps_script_url not set yet): the local state
    // change IS the write, so report success. Returning null here would read as a
    // failed request and make optimistic updates roll themselves back.
    // `offline` marks it so server-only actions can tell the difference.
    if (!APP_CONFIG.apps_script_url || user?.token === "local") return Promise.resolve({ ok: true, offline: true });
    // Queue requests so rapid edits don't race in GAS
    return new Promise(resolve => {
      apiQueue.current.push({action, payload, resolve});
      if (!apiRunning.current) {
        (async () => {
          apiRunning.current = true;
          while (apiQueue.current.length > 0) {
            const req = apiQueue.current.shift();
            try {
              // Token is fetched per request, not at enqueue time — a request that
              // sat in the queue would otherwise go out with an expired token.
              const result = await API.post(await getFreshToken(), req.action, req.payload);
              if (result?.error === "Unauthorized") { setSessionExpired(true); }
              if (result?.error === "NotMember") { setUser(null); localStorage.removeItem("labtrack_user"); setSignedOutBecause("Your account is not authorized to access this lab's system."); }
              if (result?.error && result.error !== "Unauthorized" && result.error !== "NotMember") addToast("error", `Error: ${result.error} — ${result.detail||""}`);
              req.resolve(result);
            } catch(e) { req.resolve(null); }
          }
          apiRunning.current = false;
        })();
      }
    });
  };

  const handleDelivery=async(d)=>{
    setDeliv(p=>[d,...p]);
    addToast("success",`Delivery logged: ${d.item}`);
    await postAction("addDelivery", {delivery: d});
  };

  // A checkout points at one specific unit. Splitting an item produces siblings
  // that share a name and differ only by id and label, so matching on name moved
  // all of them at once — checking out one unit marked every sibling In Use.
  // Records written before itemId was populated have only the name to go on.
  // Only a booking that is under way right now moves the item. The backend applies
  // the same test, and its daily sweep is what hands the item over on the morning a
  // future booking starts.
  const markInUse=(co)=>{
    if(!bookingHoldsItem(co)) return;
    setItems(prev=>prev.map(i=>isCheckoutTarget(i,co)?{...i,status:i.shared?"Available":"In Use",usedBy:toArr(i.usedBy).includes(co.user)?toArr(i.usedBy):[...toArr(i.usedBy),co.user]}:i));
  };

  const handleCheckout=async(c)=>{
    // itemId comes from the picker now. It used to be left unset, so the column
    // sat empty and every lookup fell back to the item's name.
    const checkout={...c, checkedOutByEmail: user?.email||""};
    const pending=checkout.status===CO_PENDING;
    // A pending booking reserves the slot but not the item. Marking it In Use now
    // would take it off the shelf just for having been asked for.
    if(!pending) markInUse(checkout);
    setCheckouts(p=>[checkout,...p]);
    addToast("success",pending?`${checkout.item} — sent to an admin for approval`:`${checkout.item} → ${checkout.user}`);
    const res=await postAction("addCheckout", {checkout});
    // Two people can fill in the same slot at once and neither browser sees the
    // other's draft, so the backend gets the last word. Undo the optimistic write.
    if(res&&res.error){
      // `checkouts` is the list from before this one was added — i.e. the rest.
      const heldElsewhere=checkouts.some(x=>x.status==="Active"&&x.user===checkout.user&&String(x.itemId||"")===String(checkout.itemId||""));
      setCheckouts(p=>p.filter(x=>x.id!==checkout.id));
      // Only undo what markInUse actually did — a booking that had not started
      // moved nothing, and stripping the holder here would free an item somebody
      // else is really holding.
      if(!pending&&!heldElsewhere&&bookingHoldsItem(checkout)) setItems(prev=>prev.map(i=>isCheckoutTarget(i,checkout)?{...i,status:"Available",usedBy:toArr(i.usedBy).filter(u=>u!==checkout.user)}:i));
      addToast("error",res.detail||res.error);
      return;
    }
    // The browser guessed from a list that is up to a poll old; the server decided
    // from the whole table. If someone joined the queue for this slot in between,
    // what we just drew as a checkout is really a request — say so, and put the
    // item back on the shelf rather than leaving it marked In Use on this screen
    // while the sheet says nobody has it.
    if(res&&res.pending&&!pending){
      setCheckouts(p=>p.map(x=>x.id===checkout.id?{...x,status:CO_PENDING}:x));
      if(!checkouts.some(x=>x.status==="Active"&&x.user===checkout.user&&String(x.itemId||"")===String(checkout.itemId||"")))
        if(bookingHoldsItem(checkout)) setItems(prev=>prev.map(i=>isCheckoutTarget(i,checkout)?{...i,status:"Available",usedBy:toArr(i.usedBy).filter(u=>u!==checkout.user)}:i));
      addToast("info",res.reason==="queue"
        ? `Someone else asked for this slot first — ${checkout.item} is waiting on an admin`
        : `${checkout.item} needs an admin's approval`);
    }
  };

  const handleUpdateRequest=async(coId,patch)=>{
    const co=checkouts.find(c=>c.id===coId); if(!co)return;
    // Editing re-runs the rules: shorten it under the limit and the reason it
    // needed an admin is gone, so it becomes a plain checkout.
    const merged={...co,...patch};
    const nowActive=!waitReason(merged,checkouts);
    const next={...merged,status:nowActive?"Active":CO_PENDING};
    setCheckouts(p=>p.map(c=>c.id===coId?next:c));
    if(nowActive) markInUse(next);
    addToast("success",nowActive?`${co.item} — request shortened, checked out`:`${co.item} request updated`);
    const res=await postAction("updateCheckout",{checkoutId:coId,checkout:patch});
    if(res&&res.error){
      setCheckouts(p=>p.map(c=>c.id===coId?co:c));
      if(nowActive&&bookingHoldsItem(next)) setItems(prev=>prev.map(i=>isCheckoutTarget(i,co)?{...i,status:"Available",usedBy:toArr(i.usedBy).filter(u=>u!==co.user)}:i));
      addToast("error",res.detail||res.error);
    }
  };

  const handleCancelRequest=async(coId)=>{
    const co=checkouts.find(c=>c.id===coId); if(!co)return;
    setCheckouts(p=>p.filter(c=>c.id!==coId));
    addToast("success",`Request for ${co.item} withdrawn`);
    const res=await postAction("cancelCheckout",{checkoutId:coId});
    if(res&&res.error){ setCheckouts(p=>[co,...p.filter(c=>c.id!==coId)]); addToast("error",res.detail||res.error); }
  };

  const handleDecideCheckout=async(coId,approve)=>{
    const co=checkouts.find(c=>c.id===coId); if(!co)return;
    const wasHeld=items.some(i=>isCheckoutTarget(i,co)&&toArr(i.usedBy).includes(co.user));
    setCheckouts(p=>p.map(c=>c.id===coId?{...c,status:approve?"Active":"Rejected"}:c));
    if(approve) markInUse(co);
    addToast("success",approve?`${co.item} approved for ${co.user}`:`Request for ${co.item} rejected`);
    const res=await postAction("decideCheckout",{checkoutId:coId,approve});
    // The usual refusal here is "taken while this was waiting", so leaving the row
    // reading Active would tell the admin they granted something they did not.
    if(!res||res.error){
      setCheckouts(p=>p.map(c=>c.id===coId?{...c,status:co.status}:c));
      if(approve&&!wasHeld&&bookingHoldsItem(co)) setItems(prev=>prev.map(i=>isCheckoutTarget(i,co)?{...i,status:i.shared?i.status:"Available",usedBy:toArr(i.usedBy).filter(u=>u!==co.user)}:i));
      addToast("error",(res&&(res.detail||res.error))||"Could not reach the lab sheet — nothing was changed");
    }
  };

  const handleNotifyLowStock = async (item, note) => {
    addToast("success",`Reported "${item.name}" as running low`);
    await postAction("notifyLowStock", {item:item.name, loc:item.loc||"", note:note||""});
  };

  const handleUseConsumable = async (itemId, qty) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    const item = items.find(i=>i.id===itemId); if(!item) return;
    // Send what was taken, not what the number should become. Two people helping
    // themselves from the same box at once both computed the same "new total" from
    // the same stale count, and one of the deductions vanished.
    setItems(p=>p.map(i=>i.id===itemId?{...i,qty:Math.max(0,Number(i.qty||0)-qty)}:i));
    addToast("success",`Used ${qty} ${item.unit} of ${item.name}`);
    const res = await postAction("useConsumable", {itemId, used: qty});
    if(!res||res.error){
      setItems(p=>p.map(i=>i.id===itemId?{...i,qty:item.qty}:i));   // put it back
      addToast("error",(res&&(res.detail||res.error))||"Could not record that — nothing was changed");
      return;
    }
    // The server subtracted from the number actually on the sheet, which may not be
    // the one this browser was showing. Take its answer.
    if(!res.offline && typeof res.qty === "number")
      setItems(p=>p.map(i=>i.id===itemId?{...i,qty:res.qty}:i));
  };

  const handleReturn=async(coId)=>{
    const co=checkouts.find(c=>c.id===coId); if(!co)return;
    const now=new Date();
    const nowStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    const settled=checkouts.map(c=>c.id===coId?{...c,status:"Returned",ret:nowStr}:c);
    setCheckouts(settled);
    // Derived from what is left holding it, not asserted. A sole-use item can carry
    // a second Active booking for later, and Maintenance or Broken is somebody's
    // call about the object that giving it back must not quietly undo.
    setItems(p=>p.map(i=>isCheckoutTarget(i,co)?{...i,...deriveItemState(i,settled)}:i));
    addToast("success",`${co.item} returned`);
    await postAction("returnItem", {checkoutId: coId});
  };

  // effectiveRole: in admin preview mode, show UI as a regular member would see it
  const effectiveRole = previewMode ? "member" : userRole;
  // Yours are what you can do something about — the checkout is in your name, or
  // you were listed on it. An admin is on the hook for everyone else's too.
  // Group emails are typed by hand, so they arrive in whatever case somebody used.
  // The server has always compared them lowercased; the browser asked the same
  // question in two places and only one of them agreed, so a member listed as
  // JDoe1@jh.edu was missing from the overdue banner for a loan they are on the
  // hook for. One predicate now, so the two cannot drift apart again.
  const emailsOn = c => [String(c.checkedOutByEmail||"")]
    .concat(String(c.groupEmails||"").split(","))
    .map(e=>e.trim().toLowerCase()).filter(Boolean);
  const onCheckout = c => !!user?.email && emailsOn(c).includes(String(user.email).trim().toLowerCase());
  const overdueMine = overdues.filter(onCheckout);
  const overdueBanner = effectiveRole==="admin" ? overdues : overdueMine;

  const canReturn=(c)=>{
    if(effectiveRole==="admin")return true;
    if(!c.checkedOutByEmail)return true; // legacy records without an owner recorded
    return onCheckout(c);
  };

  const handleBulkReturn=()=>{
    const ids=[...selected];
    const coMap=Object.fromEntries(checkouts.filter(c=>ids.includes(c.id)).map(c=>[c.id,c]));
    const settled=checkouts.map(c=>ids.includes(c.id)?{...c,status:"Returned"}:c);
    setCheckouts(settled);
    setItems(prev=>prev.map(i=>
      ids.some(id=>coMap[id]&&isCheckoutTarget(i,coMap[id])) ? {...i,...deriveItemState(i,settled)} : i));
    setSelected(new Set());
    addToast("success",`${ids.length} item${ids.length>1?"s":""} returned`);
    ids.forEach(id=>postAction("returnItem",{checkoutId:id}));
  };

  const handleQuickCheckout=(itemId)=>{ setPreItem(itemId); setModal("checkout"); };

  const handleAddItem = async (item) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return null;}
    setItems(p=>[item,...p]);
    const res = await postAction("addItem", {item});
    if(!res||res.error){
      setItems(p=>p.filter(i=>i.id!==item.id)); // rollback optimistic add
      if(!res) addToast("error",`Failed to save "${item.name}" — check your connection`);
      return null;
    }
    addToast("success",`"${item.name}" added`);
    const finalId = res.displayId || item.displayId;
    if(res.displayId && res.displayId !== item.displayId)
      setItems(p=>p.map(i=>i.id===item.id?{...i,displayId:res.displayId}:i));
    return finalId;
  };

  const handleUpdateItem = async (updatedItem) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    const before = items.find(i=>i.id===updatedItem.id);
    setItems(p=>p.map(i=>i.id===updatedItem.id?{...i,...updatedItem}:i));
    addToast("success",`"${updatedItem.name}" updated`);
    const res = await postAction("updateItem", {item: updatedItem});
    if(!res||res.error){
      if(before) setItems(p=>p.map(i=>i.id===updatedItem.id?before:i));
      addToast("error",(res&&(res.detail||res.error))||"Could not save that — nothing was changed");
      return;
    }
    // The server drops fields this person may not move. Put them back rather than
    // leaving the screen showing a value the sheet does not hold.
    if(before&&res.ignored&&res.ignored.length){
      setItems(p=>p.map(i=>{
        if(i.id!==updatedItem.id) return i;
        const fixed={...i};
        res.ignored.forEach(k=>{fixed[k]=before[k];});
        return fixed;
      }));
      addToast("error",`${res.ignored.join(", ")} ${res.ignored.length>1?"are":"is"} an admin's to change — everything else was saved`);
    }
  };

  const handleDeleteItem = async (itemId) => {
    if (userRole !== "admin") {
      addToast("error", "Only admins can delete items. Contact a lab admin.");
      return;
    }
    const deletedItem = items.find(i=>i.id===itemId);
    deletedItemIds.current.add(String(itemId));
    setItems(p=>p.filter(i=>i.id!==itemId));
    addToast("success","Item deleted");
    const result = await postAction("deleteItem", {itemId});
    if (result && result.error === "Forbidden") {
      deletedItemIds.current.delete(String(itemId));
      if (deletedItem) setItems(p=>[deletedItem,...p]);
      addToast("error", "Server rejected: " + (result.detail||"Not authorized"));
    }
  };

  const handleEditItem = (item) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setEditItem(item);
  };

  const handleAddOrder = async (order) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setOrders(p=>[order,...p]);
    addToast("success",`Order request submitted: ${order.item}`);
    await postAction("addOrder", {order});
  };

  const handleAddOrderMany = async (orders) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setOrders(p=>[...orders,...p]);
    addToast("success",`${orders.length} order request${orders.length>1?"s":""} submitted`);
    for (const order of orders) {
      await postAction("addOrder", {order});
    }
  };

  const handleSendDigest = async () => {
    const tid2 = addToast("info", "Sending digest to Slack…");
    const result = await postAction("sendDigest", {});
    if (result && result.ok) addToast("success", "Slack digest sent! Check your channel.");
    else if (!result || result.error) addToast("error", "Digest failed — check webhook config.");
  };

  const handleBackupNow = async () => {
    if(backingUp) return;
    setBackingUp(true);
    addToast("info","Creating backup in Google Drive…");
    const result = await postAction("backupNow", {});
    setBackingUp(false);
    if(result && result.ok){
      const now=new Date();
      const pad=n=>String(n).padStart(2,"0");
      const ts=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      setLastBackup(ts);
      addToast("success",`Backup saved: ${result.backupName}`);
    } else {
      addToast("error","Backup failed — "+((result&&result.detail)||"check Apps Script logs"));
    }
  };

  const handleUpdateOrderStatus = async (orderId, newStatus) => {
    setOrders(p=>p.map(o=>o.id===orderId?{...o,status:newStatus}:o));
    addToast("success",`Order marked as ${newStatus}`);
    await postAction("updateOrderStatus", {orderId, status: newStatus});
  };

  const handleUpdateOrder = async (order) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    setOrders(p=>p.map(o=>o.id===order.id?order:o));
    addToast("success","Order updated");
    await postAction("updateOrder", {order});
  };

  const handleDeleteOrder = async (orderId) => {
    if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}
    if (userRole !== "admin") {
      addToast("error", "Only admins can delete orders.");
      return;
    }
    setOrders(p=>p.filter(o=>o.id!==orderId));
    addToast("success","Order request removed");
    await postAction("deleteOrder", {orderId});
  };

  // Show staging modal immediately; sync to sheet in background
  const handleOrderReceived = (order) => {
    setPendingItem(order); // instant — no waiting for API
    const delivery={id:uid(),item:order.item,qty:order.qty,unit:order.unit,from:"(Order #"+order.id+")",receivedBy:user?.name||"",date:getToday(),tracking:"",status:"Logged"};
    handleDelivery(delivery);              // fire and forget
    handleUpdateOrderStatus(order.id,"Received"); // fire and forget
  };

  const handleConfirmPendingItem = async (itemData) => {
    const newItem = {id:uid(), status:"Available", usedBy:[], ...itemData, qty:+itemData.qty||0, minQty:isNaN(+itemData.minQty)?0:+itemData.minQty};
    setItems(p=>[newItem,...p]);
    addToast("success",`"${newItem.name}" added to inventory!`);
    const res = await postAction("addItem", {item: newItem});
    if(res?.displayId && res.displayId !== newItem.displayId)
      setItems(p=>p.map(i=>i.id===newItem.id?{...i,displayId:res.displayId}:i));
  };

  // filtered & sorted inventory
  const filtered = useMemo(()=>{
    let f = items.filter(i=>{
      const q=search.toLowerCase();
      const s = v => String(v==null?"":v).toLowerCase();
      return(s(i.name).includes(q)||s(i.loc).includes(q)||s(i.cat).includes(q)||s(i.desc).includes(q)||s(i.serial).includes(q))
        &&(catF==="All"||i.cat===catF);
    });
    // Sort
    const srt = v => String(v==null?"":v);
    if(sortBy==="name-az") f.sort((a,b)=>srt(a.name).localeCompare(srt(b.name)));
    else if(sortBy==="name-za") f.sort((a,b)=>srt(b.name).localeCompare(srt(a.name)));
    else if(sortBy==="newest") f.sort((a,b)=>Number(b.id)-Number(a.id));
    else if(sortBy==="qty-low") f.sort((a,b)=>a.qty-b.qty);
    else if(sortBy==="qty-high") f.sort((a,b)=>b.qty-a.qty);
    return f;
  },[items, search, catF, sortBy]);

  // Group sub-ID items (track-individually, non-consumable) under one display entry
  const displayItems = useMemo(()=>{
    const groups = {};
    const result = [];
    filtered.forEach(item => {
      if (isSubItem(item.displayId) && !item.consumable) {
        const baseId = getBaseId(item.displayId);
        if (!groups[baseId]) {
          const g = {_isGroup:true,_baseId:baseId,_items:[],id:baseId,name:item.name,cat:item.cat,loc:item.loc,desc:item.desc,img:item.img,unit:item.unit,displayId:baseId,shared:item.shared,consumable:false,minQty:item.minQty};
          groups[baseId] = g;
          result.push(g);
        }
        groups[baseId]._items.push(item);
      } else {
        result.push(item);
      }
    });
    Object.values(groups).forEach(g=>{
      // By label number, not by whatever order the rows happen to sit in. A unit
      // added later lands at the end of the item list, so -03 could be listed
      // before -01 — and once one is deleted and re-added the sequence is
      // arbitrary. Numeric compare, so -10 sorts after -09 rather than beside -01.
      g._items.sort((a,b)=>(parseDisplayId(a.displayId)?.sub??0)-(parseDisplayId(b.displayId)?.sub??0));
      g.qty = g._items.length;
      // The card has room for one location, and g.loc was whichever unit happened
      // to be first in the item list. Show the lowest-numbered unit's, and say how
      // many others differ rather than quietly picking one.
      const locs = [...new Set(g._items.map(i=>String(i.loc||"").trim()).filter(Boolean))];
      g.loc = locs.length>1 ? `${g._items[0].loc} +${locs.length-1} more` : (locs[0]||"");
      const inUseCount = g._items.filter(i=>toArr(i.usedBy).length>0).length;
      g.usedBy = [...new Set(g._items.flatMap(i=>toArr(i.usedBy)))];
      g.status = inUseCount===0?"Available":inUseCount===g._items.length?"In Use":"Partially In Use";
    });
    return result;
  },[filtered]);

  // Load-more sliced items
  const paginatedItems = displayItems.slice(0, invLimit);

  const pendingOrders = orders.filter(o=>o.status==="Pending").length;
  const activeOrders = orders.filter(o=>o.status!=="Received"&&o.status!=="Rejected").sort((a,b)=>Number(b.id)-Number(a.id));
  const receivedOrders = orders.filter(o=>o.status==="Received"||o.status==="Rejected").sort((a,b)=>Number(b.id)-Number(a.id));
  const ORDERS_PER_PAGE = 15;
  const filteredActiveOrders = activeOrders.filter(o=>{
    const q = orderSearch.toLowerCase();
    const matchText = !q || (o.item||"").toLowerCase().includes(q) || (o.store||"").toLowerCase().includes(q) || (o.requestedBy||"").toLowerCase().includes(q) || (o.reason||"").toLowerCase().includes(q);
    const matchStatus = orderStatusFilter==="All" || o.status===orderStatusFilter;
    const matchDate = true; // date filter handled via orderStatusFilter "Today" below
    return matchText && matchStatus;
  });
  const ordersPageCount = Math.ceil(filteredActiveOrders.length/ORDERS_PER_PAGE);
  const pagedActiveOrders = filteredActiveOrders.slice(ordersPage*ORDERS_PER_PAGE, (ordersPage+1)*ORDERS_PER_PAGE);

  const TABS=[
    {id:"inventory",l:"Inventory",n:"grid",count:items.length},
    {id:"orders",l:"Order Requests",n:"cart",count:activeOrders.length},
    {id:"usage",l:"Usage",n:"users",count:activeOut.length},
    {id:"calendar",l:"Calendar",n:"calendar",count:0},
  ];

  // Loading
  if (loading) {
    return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg0)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:40,height:40,border:"3px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 16px"}}/>
        <div style={{color:"var(--sub)",fontSize:14}}>Loading...</div>
      </div>
    </div>;
  }

  if (!user) return <LoginPage onSignIn={handleSignIn} notice={signedOutBecause}/>;

  return(
    <div style={{background:"var(--bg0)",minHeight:"100vh",color:"var(--text)",display:"flex",flexDirection:"column"}}>
      {/* HEADER */}
      <header style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12,position:"sticky",top:0,zIndex:200}}>
        <div style={{display:"flex",alignItems:"center",gap:13}}>
          <div style={{width:38,height:38,borderRadius:10,background:"#ffffff",border:"1px solid var(--border)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,overflow:"hidden"}}>
            <img src={LAB.logo} alt={LAB.lab_name} style={{width:30,height:30,objectFit:"contain",display:"block"}}/>
          </div>
          <div>
            <div style={{fontFamily:"'Roboto',sans-serif",fontWeight:900,fontSize:16,letterSpacing:"-0.02em",whiteSpace:"nowrap"}}>{LAB.app_title}</div>
            <div style={{color:"var(--dim)",fontSize:10,fontFamily:"'IBM Plex Mono',monospace"}}>inventory system · v0.1</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {overdues.length>0&&(
            <div className="overdue-pulse" style={{display:"flex",alignItems:"center",gap:6,background:"var(--red-d)",border:"1px solid color-mix(in srgb, var(--red) 38%, transparent)",borderRadius:20,padding:"5px 12px",fontSize:12,color:"var(--red)"}}>
              <Ico n="clock" s={13} col="var(--red)"/>{overdues.length} overdue
            </div>
          )}
          {/* Same reasoning as the banner: purchasing is an admin's job. The
              overdue chip beside it stays for everyone — a member may well be the
              one holding the late item, and either way it is the lab's problem. */}
          {lowStock.length>0&&effectiveRole==="admin"&&(
            <div style={{display:"flex",alignItems:"center",gap:6,background:"var(--amber-d)",border:"1px solid color-mix(in srgb, var(--amber) 38%, transparent)",borderRadius:20,padding:"5px 12px",fontSize:12,color:"var(--amber)"}}>
              <Ico n="alert" s={13} col="var(--amber)"/>{lowStock.length} low stock
            </div>
          )}
          {/* Help */}
          <button onClick={()=>setModal("help")} title="Help & Guide" className="ibtn"
            style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:"var(--sub)"}}>
            <Ico n="help" s={14}/>
          </button>
          {/* Theme toggle */}
          <button onClick={()=>setDarkMode(d=>!d)} title={darkMode?"Switch to Light Mode":"Switch to Dark Mode"}
            style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:"var(--sub)",transition:"all .15s"}}
            className="ibtn">
            <Ico n={darkMode?"sun":"moon"} s={14}/>
          </button>
          {/* Edit lock */}
          <button onClick={()=>{
            if(editLocked && userRole!=="admin"){
              postAction("logEditUnlock",{user:user?.name||"",email:user?.email||""});
            }
            setEditLocked(l=>!l);
          }} title={editLocked?"Unlock editing":"Lock editing to prevent accidental changes"}
            style={{background:editLocked?"var(--red-d)":"var(--bg2)",border:`1px solid ${editLocked?"color-mix(in srgb, var(--red) 45%, transparent)":"var(--border)"}`,borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:editLocked?"var(--red)":"var(--sub)",transition:"all .15s"}}
            className="ibtn">
            <Ico n={editLocked?"lock":"unlock"} s={14}/>
          </button>
          {/* Admin: preview as user */}
          {userRole==="admin"&&(
            <button onClick={()=>setPreviewMode(m=>!m)} title={previewMode?"Exit preview mode (admin)":"Preview as regular user"}
              style={{background:previewMode?"var(--blue-d)":"var(--bg2)",border:`1px solid ${previewMode?"var(--blue)":"var(--border)"}`,borderRadius:8,padding:"7px 9px",cursor:"pointer",display:"flex",alignItems:"center",color:previewMode?"var(--blue)":"var(--sub)",transition:"all .15s"}}
              className="ibtn">
              <Ico n="eye" s={14}/>
            </button>
          )}
          {/* Admin: Send Digest Now */}
          {userRole==="admin"&&APP_CONFIG.apps_script_url&&(
            <button onClick={handleSendDigest} title="Send Slack digest now (admin)"
              style={{background:"var(--purple-d)",border:"1px solid color-mix(in srgb, var(--purple) 32%, transparent)",borderRadius:8,padding:"6px 11px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,color:"var(--purple)",fontSize:12,fontWeight:600,fontFamily:"'Outfit',sans-serif"}}>
              <Ico n="bell2" s={13} col="var(--purple)"/>Digest
            </button>
          )}
          {/* Admin: Backup Now */}
          {userRole==="admin"&&APP_CONFIG.apps_script_url&&(
            <button onClick={handleBackupNow} disabled={backingUp}
              title={lastBackup?`Last backup: ${lastBackup}\nClick to backup now`:"Click to backup spreadsheet to Google Drive"}
              style={{background:"var(--green-d)",border:"1px solid #00c47433",borderRadius:8,padding:"6px 11px",cursor:backingUp?"not-allowed":"pointer",display:"flex",alignItems:"center",gap:5,color:"var(--green)",fontSize:12,fontWeight:600,fontFamily:"'Outfit',sans-serif",opacity:backingUp?.6:1}}>
              {backingUp
                ? <div style={{width:13,height:13,border:"2px solid #00c47440",borderTopColor:"var(--green)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
                : <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>}
              {backingUp?"Backing up…":"Backup"}
            </button>
          )}
          <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:"5px 12px 5px 6px"}}>
            {user.picture ? (
              <img src={user.picture} alt="" style={{width:28,height:28,borderRadius:"50%",border:"2px solid var(--border-hi)"}} onError={e=>{e.target.style.display='none';}}/>
            ) : (<MemberAvatar name={user.name} sz={28}/>)}
            <span style={{color:"var(--sub)",fontSize:12,fontWeight:500,maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{user.name}</span>
            {effectiveRole==="admin"&&<span style={{background:"var(--amber-d)",color:"var(--amber)",border:"1px solid color-mix(in srgb, var(--amber) 38%, transparent)",borderRadius:6,padding:"1px 6px",fontSize:9,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace",letterSpacing:"0.05em"}}>ADMIN</span>}
            <button onClick={handleSignOut} title="Sign out" style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:"2px",display:"flex",alignItems:"center"}}><Ico n="logout" s={14}/></button>
          </div>
        </div>
      </header>

      {/* NAV */}
      <nav style={{background:"var(--bg1)",borderBottom:"1px solid var(--border)",padding:"0 24px",display:"flex",gap:2}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{background:"transparent",border:"none",borderBottom:`2px solid ${tab===t.id?"var(--cyan)":"transparent"}`,color:tab===t.id?"var(--cyan)":"var(--dim)",padding:"13px 16px",cursor:"pointer",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:7,fontFamily:"'Outfit',sans-serif",transition:"color .15s,border-color .15s"}}>
            <Ico n={t.n} s={14} col={tab===t.id?"var(--cyan)":"var(--dim)"}/>{t.l}
            {t.count>0&&<span style={{background:t.id==="usage"&&overdues.length>0?"var(--red)":tab===t.id?"var(--cyan)":"var(--bg4)",color:t.id==="usage"&&overdues.length>0?"var(--on-accent)":tab===t.id?"var(--on-accent)":"var(--sub)",borderRadius:10,padding:"1px 6px",fontSize:10,fontWeight:800,fontFamily:"'IBM Plex Mono',monospace"}}>{t.count}</span>}
          </button>
        ))}
      </nav>

      {/* Session expired banner */}
      {sessionExpired&&(
        <div style={{background:"#7c2d12",borderBottom:"1px solid #dc262660",padding:"10px 24px",display:"flex",alignItems:"center",gap:10,justifyContent:"space-between",flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Ico n="alert" s={16} col="#fca5a5"/>
            <span style={{color:"#fca5a5",fontSize:13,fontWeight:600}}>Session expired — your data is saved. Sign in again to continue syncing.</span>
          </div>
          <button onClick={handleSignOut} style={{background:"#dc2626",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>Sign In Again →</button>
        </div>
      )}
      {/* Dev mode banner — deliberately loud and not dismissible, because leaving
          dev_key set on a real deployment means the backend has no authentication. */}
      {DEV_MODE&&(
        <div style={{background:"#7f1d1d",borderBottom:"2px solid #ef4444",padding:"9px 24px",display:"flex",alignItems:"center",gap:8}}>
          <Ico n="alert" s={15} col="#fecaca"/>
          <span style={{color:"#fecaca",fontSize:12.5,fontWeight:700,letterSpacing:"0.01em"}}>
            DEV MODE — authentication is disabled. Clear <code style={{fontFamily:"'IBM Plex Mono',monospace"}}>dev_key</code> and <code style={{fontFamily:"'IBM Plex Mono',monospace"}}>DEV_NO_AUTH_KEY</code> before this holds real inventory.
          </span>
        </div>
      )}
      {/* Admin preview mode banner */}
      {previewMode&&(
        <div style={{background:"var(--blue-d)",borderBottom:"1px solid color-mix(in srgb, var(--blue) 30%, transparent)",padding:"8px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Ico n="eye" s={14} col="var(--blue)"/>
            <span style={{color:"var(--blue)",fontSize:12,fontWeight:600}}>Admin Preview — you are viewing the site as a regular user</span>
          </div>
          <button onClick={()=>setPreviewMode(false)} style={{background:"none",border:"1px solid color-mix(in srgb, var(--blue) 38%, transparent)",color:"var(--blue)",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>Exit Preview</button>
        </div>
      )}
      {/* Overdue banner — the one thing that should not wait for you to go looking
          for it. Yours first because you are the one who can act on it; admins
          also see the rest, because chasing them is their job. */}
      {overdueBanner.length>0&&!overdueDismissed&&(
        <div style={{background:"var(--red-d)",borderBottom:`1px solid ${mix("--red",30)}`,padding:"9px 24px",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
          <div style={{display:"flex",alignItems:"flex-start",gap:9,minWidth:0}}>
            <Ico n="alert" s={15} col="var(--red)"/>
            <div style={{minWidth:0}}>
              <div style={{color:"var(--red)",fontSize:12,fontWeight:700}}>
                {overdueMine.length>0
                  ? `You have ${overdueMine.length} overdue item${overdueMine.length>1?"s":""}`
                  : `${overdueBanner.length} item${overdueBanner.length>1?"s":""} overdue in the lab`}
              </div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:4}}>
                {overdueBanner.slice(0,4).map(c=>(
                  <span key={c.id} style={{color:"var(--sub)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>
                    {c.item} · {c.user} · due {c.ret}
                  </span>
                ))}
                {overdueBanner.length>4&&<span style={{color:"var(--dim)",fontSize:11}}>+{overdueBanner.length-4} more</span>}
              </div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0}}>
            <Btn sm v="ghost" onClick={()=>{setTab("usage");setOverdueDismissed(true);}}>Open Usage</Btn>
            <button onClick={()=>setOverdueDismissed(true)} title="Dismiss until next sign-in" style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:4,display:"flex"}}><Ico n="x" s={14}/></button>
          </div>
        </div>
      )}
      {/* Edit lock banner */}
      {editLocked&&(
        <div style={{background:"var(--red-d)",borderBottom:"1px solid color-mix(in srgb, var(--red) 30%, transparent)",padding:"7px 24px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Ico n="lock" s={13} col="var(--red)"/>
            <span style={{color:"var(--red)",fontSize:12,fontWeight:600}}>Editing locked — inventory is in read-only mode</span>
          </div>
          <button onClick={()=>{if(userRole!=="admin")postAction("logEditUnlock",{user:user?.name||"",email:user?.email||""});setEditLocked(false);}} style={{background:"none",border:"1px solid color-mix(in srgb, var(--red) 38%, transparent)",color:"var(--red)",borderRadius:6,padding:"3px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>Unlock</button>
        </div>
      )}

      {/* Loading overlay */}
      {fetchingData && (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",padding:"60px 20px",flexDirection:"column",gap:16}}>
          <div style={{width:40,height:40,border:"3px solid var(--border)",borderTopColor:"var(--cyan)",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
          <div style={{color:"var(--sub)",fontSize:14}}>Fetching inventory data...</div>
        </div>
      )}

      {!fetchingData && (
      <main style={{padding:"24px",maxWidth:1360,margin:"0 auto"}}>

        {/* Stats */}
        <div style={{display:"flex",gap:12,marginBottom:overdues.length||lowStock.length?16:24,flexWrap:"wrap"}}>
          {/* Four plain counts share one accent; only Overdue changes colour, and
              only because its value means something. Giving each tile its own hue
              spent the colour channel on nothing, and it could not be made safe:
              in a blue-dominant palette the fifth and sixth hues collapse against
              the blues (normal-vision ΔE 10.8–13.8, floor 15). */}
          <Stat label="Total Items" val={items.length} icon="box" ac="var(--cyan)" sub="in inventory"/>
          <Stat label="Categories" val={[...new Set(items.map(i=>i.cat))].length} icon="layers" ac="var(--cyan)" sub="active types"/>
          <Stat label="Orders" val={activeOrders.length} icon="cart" ac="var(--cyan)" sub="in pipeline"/>
          <Stat label="Checked Out" val={activeOut.length} icon="users" ac="var(--cyan)" sub="active"/>
          <Stat label="Overdue" val={overdues.length} icon="clock" ac={overdues.length?"var(--red)":"var(--green)"} sub="past return date" warn={overdues.length>0}/>
        </div>

        {/* Alert banners */}
        {/* Overdues used to get a strip here too. The page-top banner says the same
            thing on every tab, and the header chip stays after it is dismissed. */}
        {/* Restocking is an admin's job, so the running list is an admin's banner.
            A member still sees the Low Stock badge on the card itself, and the
            Notify button on untracked supplies — which is their way of saying
            something is running out. A banner they cannot act on is just noise. */}
        {lowStock.length>0&&effectiveRole==="admin"&&(
          <div style={{background:"var(--amber-d)",border:"1px solid color-mix(in srgb, var(--amber) 30%, transparent)",borderRadius:10,padding:"10px 16px",marginBottom:24,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <Ico n="alert" s={15} col="var(--amber)"/>
            <span style={{color:"var(--amber)",fontSize:13,fontWeight:600}}>Low stock:</span>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {lowStock.map(i=>(
                <button key={i.id} onClick={()=>{setDetail(i);setTab("inventory");}} style={{background:"var(--amber-d)",color:"var(--amber)",border:"1px solid color-mix(in srgb, var(--amber) 38%, transparent)",borderRadius:12,padding:"2px 10px",fontSize:12,cursor:"pointer",fontWeight:600}}>
                  {i.name} ({i.qty} {i.unit})
                </button>
              ))}
            </div>
          </div>
        )}

        {/* ════════ INVENTORY TAB ════════ */}
        {tab==="inventory"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              <div style={{position:"relative",flex:1,minWidth:200,maxWidth:320}}>
                <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)"}}><Ico n="search" s={14} col="var(--dim)"/></span>
                <Inp placeholder="Search name, location, serial no..." value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:34}}/>
                {search&&<button onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--dim)",cursor:"pointer",padding:0,display:"flex"}}><Ico n="x" s={13}/></button>}
              </div>

              <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                {["All",...categories].map(c=>{
                  const count=c==="All"?items.length:items.filter(i=>i.cat===c).length;
                  if(count===0&&c!=="All")return null;
                  const isSel=catF===c;
                  const ac=getCatAccent(c,categories);
                  return(
                    <button key={c} onClick={()=>setCatF(c)} style={{background:isSel?(c==="All"?"var(--bg4)":`${ac}18`):"var(--bg2)",color:isSel?(c==="All"?"var(--text)":ac):"var(--sub)",border:`1px solid ${isSel?(c==="All"?"var(--border-hi)":ac):"var(--border)"}`,borderRadius:20,padding:"4px 11px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'Outfit',sans-serif",transition:"all .15s",display:"flex",alignItems:"center",gap:4}}>
                      {c}{c!=="All"&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:10,opacity:.7}}>{count}</span>}
                    </button>
                  );
                })}
                {effectiveRole==="admin"&&<button onClick={()=>setModal("manageCategories")} title="Manage Categories (admin only)" style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:20,padding:"4px 8px",cursor:"pointer",display:"flex",alignItems:"center",transition:"all .15s"}}>
                  <Ico n="settings" s={13} col="var(--dim)"/>
                </button>}
              </div>

              {/* Sort */}
              <Sel value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{width:"auto",padding:"6px 10px",fontSize:12,borderRadius:8}}>
                <option value="name-az">Name A-Z</option>
                <option value="name-za">Name Z-A</option>
                <option value="newest">Newest</option>
                <option value="qty-low">Qty Low→High</option>
                <option value="qty-high">Qty High→Low</option>
              </Sel>

              <div style={{display:"flex",gap:2,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,padding:3,marginLeft:"auto"}}>
                {["grid","list"].map(v=>(
                  <button key={v} onClick={()=>setView(v)} style={{background:view===v?"var(--bg4)":"transparent",border:view===v?"1px solid var(--border-hi)":"1px solid transparent",borderRadius:6,padding:"5px 9px",cursor:"pointer",display:"flex",alignItems:"center",transition:"all .15s"}}>
                    <Ico n={v} s={15} col={view===v?"var(--cyan)":"var(--dim)"}/>
                  </button>
                ))}
              </div>

              <Btn v="ghost" onClick={()=>{setPreItem("");setModal("checkout");}}><Ico n="tag" s={14}/>Check Out</Btn>
              <Btn onClick={()=>{if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}setModal("addItem");}}><Ico n="plus" s={14} col="var(--on-accent)"/>Add Item</Btn>
            </div>

            {search&&<div style={{color:"var(--dim)",fontSize:12,marginBottom:12}}>{filtered.length} result{filtered.length!==1?"s":""} for "{search}"</div>}

            {filtered.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px",color:"var(--dim)"}}>
                <Ico n={items.length===0?"box":"search"} s={48} col="var(--bg4)"/>
                <div style={{marginTop:16,fontSize:16,color:"var(--sub)"}}>{items.length===0?"No items in inventory yet":"No items found"}</div>
                <div style={{fontSize:13,marginTop:4}}>{items.length===0?"Add your first item to get started":"Try a different search or category"}</div>
                {items.length===0 ? (
                  <Btn style={{marginTop:16}} onClick={()=>{if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}setModal("addItem");}}><Ico n="plus" s={14} col="var(--on-accent)"/>Add First Item</Btn>
                ) : (
                  <button onClick={()=>{setSearch("");setCatF("All");}} style={{marginTop:16,background:"none",border:"1px solid var(--border)",color:"var(--cyan)",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:13}}>Clear filters</button>
                )}
              </div>
            ):view==="grid"?(
              <ErrorBoundary>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(238px,1fr))",gap:14}}>
                {paginatedItems.map((item,idx)=>{
                  const ac=getCatAccent(item.cat,categories);
                  if(item._isGroup){
                    const availCount=item._items.filter(i=>!i.usedBy?.length).length;
                    const inUseCount=item._items.length-availCount;
                    return(
                      <div key={item._baseId} className="card-item" onClick={()=>setGroupDetail(item)} style={{background:"var(--bg1)",border:"2px solid var(--border)",borderRadius:14,overflow:"hidden",animation:`fadeUp .3s ease ${Math.min(idx,.8)*0.04}s both`,cursor:"pointer"}}>
                        <div style={{position:"relative"}}>
                          <ItemImage src={item.img} cat={item.cat} style={{width:"100%",height:112}}/>
                          <div style={{position:"absolute",bottom:0,left:0,right:0,height:44,background:"linear-gradient(transparent,var(--bg1))"}}/>
                          <CardTags cat={item.cat} catColor={ac} status={item.status}/>
                        </div>
                        <div style={{padding:"11px 14px 13px"}}>
                          <div style={{fontWeight:700,fontSize:14,color:"var(--text)",marginBottom:2,fontFamily:"'Roboto',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                          <div style={{color:"var(--dim)",fontSize:11,marginBottom:4,fontFamily:"'IBM Plex Mono',monospace",display:"flex",gap:8,flexWrap:"wrap"}}>
                            <CopyIdBadge id={item.displayId}/>
                            <span style={{color:"var(--purple)",fontSize:10}}>TRACKED UNITS</span>
                          </div>
                          <div style={{color:"var(--dim)",fontSize:11,marginBottom:10,fontFamily:"'IBM Plex Mono',monospace"}}>{item.loc||"—"}</div>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                            <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                              <span style={{color:ac,fontFamily:"'Roboto',sans-serif",fontSize:24,fontWeight:900,lineHeight:1,letterSpacing:"-0.02em"}}>{item.qty}</span>
                              <span style={{color:"var(--dim)",fontSize:11}}>units</span>
                            </div>
                            <div style={{fontSize:11,textAlign:"right",lineHeight:1.4}}>
                              <div style={{color:"var(--green)",fontWeight:600}}>{availCount} avail</div>
                              {inUseCount>0&&<div style={{color:"var(--amber)",fontWeight:600}}>{inUseCount} in use</div>}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  }
                  const isLow=isLowStock(item)||isOutOfStock(item);
                  return(
                    <div key={item.id} className="card-item" onClick={()=>setDetail(item)} style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden",animation:`fadeUp .3s ease ${Math.min(idx,.8)*0.04}s both`}}>
                      <div style={{position:"relative"}}>
                        <ItemImage src={item.img} cat={item.cat} style={{width:"100%",height:112}}/>
                        <div style={{position:"absolute",bottom:0,left:0,right:0,height:44,background:"linear-gradient(transparent,var(--bg1))"}}/>
                        <CardTags cat={item.cat} catColor={ac} status={stockStatus(item)||item.status}/>
                      </div>
                      <div style={{padding:"11px 14px 13px"}}>
                        <div style={{fontWeight:700,fontSize:14,color:"var(--text)",marginBottom:2,fontFamily:"'Roboto',sans-serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{item.name}</div>
                        <div style={{color:"var(--dim)",fontSize:11,marginBottom:4,fontFamily:"'IBM Plex Mono',monospace",display:"flex",gap:8,flexWrap:"wrap"}}>
                          <CopyIdBadge id={item.displayId}/>
                          {item.shared&&<span style={{color:"var(--purple)",fontSize:10}}>SHARED</span>}
                          {item.consumable&&<span style={{color:"var(--amber)",fontSize:10}}>CONSUMABLE</span>}
                        </div>
                        <div style={{color:"var(--dim)",fontSize:11,marginBottom:10,fontFamily:"'IBM Plex Mono',monospace"}}>{item.loc||"—"}{item.serial?` · S/N: ${item.serial}`:""}</div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                          <div style={{display:"flex",alignItems:"baseline",gap:4}}>
                            {isUntracked(item)
                              ? <span style={{color:"var(--dim)",fontSize:12,fontFamily:"'IBM Plex Mono',monospace"}}>Not tracked</span>
                              : <><span style={{color:isLow?"var(--red)":ac,fontFamily:"'Roboto',sans-serif",fontSize:24,fontWeight:900,lineHeight:1,letterSpacing:"-0.02em"}}>{item.qty}</span>
                            <span style={{color:"var(--dim)",fontSize:11}}>{item.unit}</span></>}
                          </div>
                          {item.consumable?(
                            // Was a window.prompt(). Untracked supplies have no number to deduct, so they
                            // get Notify instead — the only thing you can usefully do is tell whoever restocks.
                            <button onClick={e=>{e.stopPropagation();if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}isUntracked(item)?setNotifyItem(item):setUseItem(item);}}
                              style={{background:editLocked?"var(--bg3)":"var(--amber-d)",color:editLocked?"var(--dim)":"var(--amber)",border:"1px solid color-mix(in srgb, var(--amber) 30%, transparent)",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:editLocked?"not-allowed":"pointer",whiteSpace:"nowrap"}}>
                              {isUntracked(item)?"Notify":"Use"}</button>
                          ):toArr(item.usedBy).length>0?(
                            <div style={{display:"flex"}}>{toArr(item.usedBy).slice(0,3).map((u,i)=><div key={u} style={{marginLeft:i>0?-8:0,zIndex:3-i}}><MemberAvatar name={u} sz={24}/></div>)}</div>
                          ):null}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
              </ErrorBoundary>
            ):(
              <ErrorBoundary>
              <div style={{background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
                <div ref={tableScrollRef} style={{overflow:"auto",maxHeight:"65vh"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <thead><tr style={{borderBottom:"1px solid var(--border)"}}>
                      {["Item","Category","Stock","Location","Serial/Product No.","Status","In Use By"].map(h=>(
                        <th key={h} className="sticky-th" style={{padding:"11px 16px",textAlign:"left",color:"var(--dim)",fontSize:10,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:"'IBM Plex Mono',monospace"}}>{h}</th>
                      ))}
                    </tr></thead>
                    <tbody>
                      {paginatedItems.map((item,i)=>{
                        if(item._isGroup){
                          const availCount=item._items.filter(it=>!it.usedBy?.length).length;
                          const inUseCount=item._items.length-availCount;
                          return(
                            <tr key={item._baseId} className="row-hover" onClick={()=>setGroupDetail(item)} style={{borderBottom:i<paginatedItems.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}>
                              <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{item.name}<span style={{marginLeft:6,fontSize:10,color:"var(--purple)",fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>TRACKED UNITS</span></td>
                              <td style={{padding:"10px 16px"}}><span style={{color:getCatAccent(item.cat,categories),fontSize:12}}>{item.cat}</span></td>
                              <td style={{padding:"10px 16px",fontFamily:"'IBM Plex Mono',monospace",fontWeight:600}}>{item.qty} <span style={{color:"var(--dim)",fontWeight:400}}>units</span></td>
                              <td style={{padding:"10px 16px",color:"var(--sub)",fontSize:12}}>{item.loc||"—"}</td>
                              <td style={{padding:"10px 16px",color:"var(--dim)",fontSize:11}}><span style={{color:"var(--green)"}}>{availCount} avail</span>{inUseCount>0&&<span style={{color:"var(--amber)",marginLeft:6}}>{inUseCount} in use</span>}</td>
                              <td style={{padding:"10px 16px"}}><Badge status={item.status}/></td>
                              <td style={{padding:"10px 16px"}}>{toArr(item.usedBy).length>0?<div style={{display:"flex",gap:4}}>{toArr(item.usedBy).slice(0,3).map(u=><MemberAvatar key={u} name={u} sz={24}/>)}</div>:<span style={{color:"var(--dim)"}}>—</span>}</td>
                            </tr>
                          );
                        }
                        return(
                          <tr key={item.id} className="row-hover" onClick={()=>setDetail(item)} style={{borderBottom:i<paginatedItems.length-1?"1px solid var(--border)":"none",cursor:"pointer",transition:"background .15s"}}>
                            <td style={{padding:"10px 16px",color:"var(--text)",fontWeight:600}}>{item.name}</td>
                            <td style={{padding:"10px 16px"}}><span style={{color:getCatAccent(item.cat,categories),fontSize:12}}>{item.cat}</span></td>
                            <td style={{padding:"10px 16px",fontFamily:"'IBM Plex Mono',monospace",color:isOutOfStock(item)?"var(--red)":isLowStock(item)?"var(--amber)":"var(--text)",fontWeight:600}}>{item.qty} <span style={{color:"var(--dim)",fontWeight:400}}>{item.unit}</span></td>
                            <td style={{padding:"10px 16px",color:"var(--sub)",fontSize:12}}>{item.loc||"—"}</td>
                            <td style={{padding:"10px 16px",color:"var(--dim)",fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{item.serial||"—"}</td>
                            <td style={{padding:"10px 16px"}}><Badge status={stockStatus(item)||item.status}/></td>
                            <td style={{padding:"10px 16px"}}>{toArr(item.usedBy).length>0?<div style={{display:"flex",gap:4}}>{toArr(item.usedBy).slice(0,3).map(u=><MemberAvatar key={u} name={u} sz={24}/>)}</div>:<span style={{color:"var(--dim)"}}>—</span>}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
              </ErrorBoundary>
            )}
            {displayItems.length>invLimit&&(
              <div style={{textAlign:"center",marginTop:16,color:"var(--dim)",fontSize:12,padding:"8px 0"}}>
                Showing {invLimit} of {displayItems.length} items
              </div>
            )}
            {displayItems.length>0&&displayItems.length<=invLimit&&invLimit>ITEMS_PER_PAGE&&(
              <div style={{textAlign:"center",marginTop:16,color:"var(--dim)",fontSize:12}}>All {displayItems.length} items shown</div>
            )}
          </div>
        )}

        {/* ════════ ORDER REQUESTS TAB ════════ */}
        {tab==="orders"&&(
          <div style={{animation:"fadeUp .3s ease"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
              <div>
                <h2 style={{margin:"0 0 3px",fontFamily:"'Roboto',sans-serif",fontSize:18,fontWeight:700}}>Order Requests</h2>
                <p style={{margin:0,color:"var(--sub)",fontSize:13}}>{activeOrders.length} active · {pendingOrders} pending approval · {deliveries.length} deliveries</p>
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
                {filteredActiveOrders.length>0&&(
                  <Btn v="ghost" sm onClick={()=>{
                    const filteredIds=new Set(filteredActiveOrders.map(o=>String(o.id)));
                    const allFilteredSelected=[...filteredIds].every(id=>selectedOrders.has(id));
                    if(allFilteredSelected){const s=new Set(selectedOrders);filteredIds.forEach(id=>s.delete(id));setSelectedOrders(s);}
                    else{const s=new Set(selectedOrders);filteredIds.forEach(id=>s.add(id));setSelectedOrders(s);}
                  }}>
                    {[...new Set(filteredActiveOrders.map(o=>String(o.id)))].every(id=>selectedOrders.has(id))?"Deselect Filtered":"Select Filtered"}
                  </Btn>
                )}
                {selectedOrders.size>0&&(<>
                  <Btn v="amber" onClick={()=>{
                    const text=generateEmailText(activeOrders.filter(o=>selectedOrders.has(String(o.id))));
                    const w=window.open('','_blank','width=720,height=520,resizable=yes,scrollbars=yes');
                    if(w){
                      w.document.write('<html><head><title>Purchase Request</title></head><body style="margin:0;padding:24px;font-family:monospace;background:#f4f7fb;color:#1a2030"><h3 style="font-family:sans-serif;color:#002d72;margin:0 0 16px">&#x1F6D2; Purchase Request &#x2014; select all and copy (Ctrl+A &#x2192; Ctrl+C)</h3><pre id="t" style="white-space:pre-wrap;font-size:13px;line-height:2;background:#ffffff;border:1px solid #cdd8ea;padding:20px;border-radius:8px"></pre></body></html>');
                      w.document.close();
                      w.document.getElementById('t').textContent=text;
                    }
                    else{setEmailText(text);setModal("emailText");}
                  }}>
                    <Ico n="mail" s={14} col="var(--amber)"/>Copy Text ({selectedOrders.size})
                  </Btn>
                  {/* Rebuilds a shared tab in the Sheet, deleting what was there —
                      an admin's artifact, and it needs the backend, so it is hidden
                      without one, like the Digest and Backup buttons. The server
                      refuses a member independently. */}
                  {APP_CONFIG.apps_script_url && effectiveRole==="admin" && <Btn v="ghost" onClick={async()=>{
                    const sel=activeOrders.filter(o=>selectedOrders.has(String(o.id)));
                    addToast("info","Creating sheet summary…");
                    const r=await postAction("generatePurchaseSummary",{orders:sel});
                    if(r&&r.ok&&!r.offline) addToast("success","Purchase summary saved to Google Sheet ✓");
                    else addToast("error","Could not create sheet — check GAS deployment");
                  }}>
                    <Ico n="layers" s={14}/>Save to Sheet
                  </Btn>}
                </>)}
                <Btn v="ghost" onClick={()=>setModal("delivery")}><Ico n="truck" s={14}/>Log Delivery</Btn>
                <Btn onClick={()=>{if(editLocked){addToast("error","Editing is locked — click 🔒 in the header to unlock");return;}setModal("order");}}><Ico n="cart" s={14} col="var(--on-accent)"/>New Request</Btn>
              </div>
            </div>

            {/* Filter bar */}
            <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              <div style={{position:"relative",flex:1,minWidth:180}}>
                <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)"}}><Ico n="search" s={13} col="var(--dim)"/></span>
                <input placeholder="Search item, store, person…" value={orderSearch} onChange={e=>{setOrderSearch(e.target.value);setOrdersPage(0);}} style={{width:"100%",background:"var(--bg2)",border:"1px solid var(--border)",color:"var(--text)",borderRadius:8,padding:"7px 10px 7px 28px",fontSize:13,outline:"none",fontFamily:"'Outfit',sans-serif"}}/>
              </div>
              {["All","Pending","Approved","Ordered"].map(s=>(
                <button key={s} onClick={()=>{setOrderStatusFilter(s);setOrdersPage(0);}} style={{background:orderStatusFilter===s?"var(--cyan-d)":"var(--bg2)",color:orderStatusFilter===s?"var(--cyan)":"var(--sub)",border:`1px solid ${orderStatusFilter===s?"var(--cyan-m)":"var(--border)"}`,borderRadius:20,padding:"5px 12px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"'Outfit',sans-serif"}}>{s}</button>
              ))}
              {(orderSearch||orderStatusFilter!=="All")&&<button onClick={()=>{setOrderSearch("");setOrderStatusFilter("All");setOrdersPage(0);}} style={{background:"none",border:"none",color:"var(--dim)",cursor:"pointer",fontSize:12}}>Clear</button>}
            </div>

            {/* Active Orders */}
            <div style={{marginBottom:28}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <h3 style={{fontFamily:"'Roboto',sans-serif",fontWeight:700,fontSize:15,color:"var(--text)",margin:0}}>Active Orders <span style={{color:"var(--dim)",fontSize:12,fontWeight:400}}>({filteredActiveOrders.length}{filteredActiveOrders.length!==activeOrders.length?` of ${activeOrders.length}`:""})</span></h3>
                <span style={{color:"var(--dim)",fontSize:11}}>Shift+click to select range</span>
              </div>
              {activeOrders.length===0?(
                <div style={{textAlign:"center",padding:"40px 20px",color:"var(--dim)",background:"var(--bg1)",border:"1px solid var(--border)",borderRadius:14}}>

                  <div style={{marginTop:12,fontSize:14,color:"var(--sub)"}}>No active orders</div>

                </div>

                    const uc=urgColors[o.urgency]||urgColors.Normal;
                    const statusColors={Pending:{bg:"var(--amber-d)",col:"var(--amber)"},Approved:{bg:"var(--blue-d)",col:"var(--blue)"},Ordered:{bg:"var(--purple-d)",col:"var(--purple)"}};
                    const sc=statusColors[o.status]||statusColors.Pending;
                    const nextStatus={Pending:"Approved",Approved:"Ordered",Ordered:"Received"};
                    const ns=nextStatus[o.status];
                    // The label is the action, not the state it lands in. Approving is
                    // a decision taken now; the other two record something that already
                    // happened, which is why only the first reads as a bare verb.
                    const nsLabel={Approved:"Approve",Ordered:"Ordered →",Received:"Mark Received"}[ns];
                    const isSel=selectedOrders.has(String(o.id));
                    const handleOrderClick=(e)=>{
                      const id=String(o.id);
                      if(e.shiftKey&&lastSelOrder.current!=null){
                        const ids=pagedActiveOrders.map(x=>String(x.id));
                        const a=ids.indexOf(lastSelOrder.current),b=ids.indexOf(id);
                        const [lo,hi]=[Math.min(a,b),Math.max(a,b)];
                        const sel=new Set(selectedOrders);
                        ids.slice(lo,hi+1).forEach(x=>sel.add(x));
                        setSelectedOrders(sel);
                      } else {
                        const sel=new Set(selectedOrders);sel.has(id)?sel.delete(id):sel.add(id);setSelectedOrders(sel);
                        lastSelOrder.current=id;
                      }
                    };
                    return(
                      <div key={o.id} onClick={handleOrderClick} style={{background:isSel?"var(--cyan-d)":"var(--bg1)",border:`1px solid ${isSel?"var(--cyan)":"var(--border)"}`,borderRadius:12,padding:"14px 18px",cursor:"pointer",transition:"background .15s,border-color .15s",userSelect:"none"}}>

                          <div style={{paddingTop:2,flexShrink:0}} onClick={e=>e.stopPropagation()}>

                          <div style={{flex:1,minWidth:200}}>
                            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6,flexWrap:"wrap"}}>
